/* Layout: 상단 바 + 탭, 아래는 탭별 작업 화면 */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --sunk:#eceeea; --line:#d8dcd6; --fg:#1d2420; --muted:#5f6a63;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --ok:#1f7a3f; --ok-soft:#e1f2e6; --warn:#a35a00; --warn-soft:#fbeedb; --bad:#b3261e; --bad-soft:#fbe4e2; --info:#2754a3; --info-soft:#e3ebf8;
  --kakao:#FEE500; --kakao-ink:#191600;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131816; --surface:#1b211e; --sunk:#232a26; --line:#333c37; --fg:#e7ece8; --muted:#9aa69f;
  --accent:#4fbfa8; --accent-ink:#0b1412; --accent-soft:#1d3a34;
  --ok:#6cc98a; --ok-soft:#1d3426; --warn:#f0a948; --warn-soft:#3a2c17; --bad:#f08a80; --bad-soft:#3d2120; --info:#8fb2f0; --info-soft:#1f2b40; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--sans);font-size:14px;line-height:1.55;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.role{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);letter-spacing:.03em}
.role.admin{background:var(--accent-soft);color:var(--accent)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.tabs button{font:inherit;font-weight:500;border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:17px}
main{padding-block:20px 48px}
section[data-view]{display:flex;flex-direction:column;gap:18px}
h2{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .grow{flex:1;min-width:200px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert{border-color:var(--bad);background:var(--bad-soft)}
.stat.alert b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:180px}
.row .main b{font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;font-size:16px}
@media (min-width:700px){input,select,textarea{font-size:14px}}
textarea{resize:vertical;min-height:64px}
input[readonly]{background:var(--sunk);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f.req>span::after{content:" *";color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fields .wide{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
button.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button.btn:hover{background:var(--sunk)}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.pri:hover{filter:brightness(1.08)}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.sm{padding:4px 9px;font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.pick{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:420px;overflow:auto}
.pick label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick label:first-child{border-top:0}
.pick label.off{cursor:not-allowed;opacity:.6}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pick .main{flex:1;min-width:0}
.notice{border-radius:var(--r);padding:10px 12px;font-size:13px;background:var(--info-soft);color:var(--info)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.ship-box{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:24px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
pre.mail{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:6px;padding:12px;margin:0;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:380px;width:100%;padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-align:center}
.gate .card h1{font-size:20px;margin:0}
.gate .card p{margin:0;color:var(--muted);font-size:13.5px}
button.kakao{font:inherit;font-weight:600;font-size:15px;background:var(--kakao);color:var(--kakao-ink);border:0;border-radius:8px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
button.kakao svg{width:18px;height:18px}
.boot{padding:40px 0;color:var(--muted)}
.ver{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.gate .ver{margin-top:4px}
button.ver{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.log h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.log ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.calnav{display:flex;align-items:center;gap:8px}
.calnav b{font-size:16px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dow{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:6px 0;background:var(--sunk);border-bottom:1px solid var(--line)}
.cal .day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--bg)}
.cal .day.out .dn{opacity:.45}
.cal .dn{font-size:12px;font-family:var(--mono);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cal .day.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cal .sun .dn b{color:var(--bad)} .cal .day.today.sun .dn b{color:var(--accent-ink)}
.chip{font-size:11px;line-height:17px;padding:0 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;font-family:inherit;width:100%}
.chip.cont{opacity:.55}
.c-reserved{background:var(--accent-soft);color:var(--accent)} .c-out{background:var(--info-soft);color:var(--info)}
.c-checking{background:var(--warn-soft);color:var(--warn)} .c-overdue{background:var(--bad-soft);color:var(--bad)} .c-done{background:var(--sunk);color:var(--muted)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.cnt{display:none;font-size:11px;font-weight:600;color:var(--accent);font-family:var(--mono)}
@media (max-width:640px){.cal .day{min-height:56px}.cal .chip,.cal .more{display:none}.cnt{display:block}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tl td.d{padding:0;width:26px;min-width:26px;height:30px;border-left:1px solid var(--line);text-align:center;font-size:10.5px;font-weight:600;cursor:default}
.tl th.d{padding:4px 0;width:26px;min-width:26px;text-align:center;font-family:var(--mono);font-size:10.5px}
.tl .we{background:var(--sunk)} .tl th.today,.tl td.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tl td.d[data-act]{cursor:pointer}
.tl td.c-reserved{background:color-mix(in srgb,var(--accent) 32%,transparent)} .tl td.c-out{background:color-mix(in srgb,var(--info) 32%,transparent)}
.tl td.c-overdue{background:color-mix(in srgb,var(--bad) 32%,transparent)} .tl td.c-checking{background:color-mix(in srgb,var(--warn) 32%,transparent)}
.tl td.c-done{background:color-mix(in srgb,var(--muted) 22%,transparent)}
.legend i.c-reserved{background:var(--accent)} .legend i.c-out{background:var(--info)} .legend i.c-overdue{background:var(--bad)} .legend i.c-checking{background:var(--warn)} .legend i.c-done{background:var(--muted)}
.tl .eqc{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:180px;white-space:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const EQ_STATUS = { available:["사용 가능","p-ok"], onloan:["대여 중","p-info"], inspect:["점검 중","p-warn"], repair:["수리 중","p-bad"], retired:["폐기",""] };
const LOAN_STATUS = { reserved:["예약","p-acc"], out:["출고","p-info"], checking:["반납 확인 중","p-warn"], done:["반납 완료","p-ok"], cancelled:["취소",""] };
const OUT_STATUS = { pending:["요청 전","p-warn"], requested:["요청 완료","p-acc"], in_transit:["배송 중","p-info"], delivered:["도착","p-ok"] };
const PICK_STATUS = { scheduled:["회수 예정",""], pending:["회수 요청 전","p-warn"], requested:["회수 요청 완료","p-acc"], done:["회수 완료","p-ok"], cancelled:["회수 취소",""] };
const RETURN_METHODS = { drop_munjeong:"직접 반납 – 문정", drop_uiwang:"직접 반납 – 의왕", pickup:"물류사 회수 요청" };
const USER_STATUS = { pending:["승인 대기","p-warn"], active:["사용 중","p-ok"], disabled:["사용 중지",""] };
const CATS = ["BLS","ALS","환자 시뮬레이터","술기 트레이너","소프트웨어","기타"];
const LOCS = ["문정","의왕"];
const PURPOSES = ["고객 데모","전시회","교육·워크숍","학회","내부 교육","기타"];
const CONDS = { ok:"정상", minor:"경미한 손상", broken:"파손", missing:"구성품 누락" };
const ACTIVE = s => s === "reserved" || s === "out";
const CHECK_PILL = { ok:"p-ok", minor:"p-warn", broken:"p-bad", missing:"p-bad" };
const locGroup = loc => LOCS.includes(loc) ? loc : "기타";
function locPicker(px, cur) {
  const etc = !!cur && !LOCS.includes(cur);
  return `<label class="f"><span>보관 위치</span><select id="${px}Loc">${LOCS.map(c => `<option ${cur === c ? "selected" : ""}>${c}</option>`).join("")}<option value="__etc" ${etc ? "selected" : ""}>기타 (직접 기록)</option></select></label>
    <label class="f" id="${px}LocEtcWrap" ${etc ? "" : "hidden"}><span>기타 위치</span><input id="${px}LocEtc" value="${esc(etc ? cur : "")}" placeholder="예: 물류사 창고, OO병원"></label>`;
}
function bindLocPicker(m, px) { $(`#${px}Loc`, m).addEventListener("change", ev => { $(`#${px}LocEtcWrap`, m).hidden = ev.target.value !== "__etc"; }); }
function locValue(m, px) { const v = $(`#${px}Loc`, m).value; return v === "__etc" ? $(`#${px}LocEtc`, m).value.trim() : v; }
function checkCell(e) {
  if (!e.last_check) return `<span class="meta">기록 없음</span>`;
  const who = e.last_check_source === "self" ? "반납자 자가점검" : "관리자 확인";
  return `<span class="pill ${CHECK_PILL[e.last_check] || ""}">${esc(CONDS[e.last_check])}</span><div class="meta">${who} · ${fmtT(e.last_check_at)}${e.last_check_note ? `<br>${esc(e.last_check_note)}` : ""}</div>`;
}
const pill = (map, k) => { const [t, c] = map[k] || [k || "–", ""]; return `<span class="pill ${c}">${esc(t)}</span>`; };

if (!window.supabase || SUPABASE_KEY.includes("REPLACE_ME")) {
  document.getElementById("gate").hidden = false;
  document.getElementById("gate").innerHTML = `<div class="card"><h1>설정이 필요해요</h1><p>index.html의 SUPABASE_KEY에 공개 키(sb_publishable_…)를 넣어 주세요.</p><div class="ver">${APP_VERSION}</div></div>`;
  return;
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "pkce", persistSession: true, detectSessionInUrl: true } });

let session = null, profile = null;
let me = { id: null, isAdmin: false };
let equipment = [], loans = [], shipments = [], people = [];
let view = (location.hash || "").slice(1) || "home";
let filters = { eqQ: "", eqCat: "", eqLoc: "", ledgerQ: "", ledgerSt: "open" };
let draft = { start: todayStr(), due: addDays(todayStr(), 7), picks: new Set() };
let cal = { ym: todayStr().slice(0, 7), mode: "month", mine: false, loc: "" };

const isOverdue = l => l.status === "out" && l.due_date < todayStr();
const eqById = id => equipment.find(e => e.id === id);
const nameOf = id => people.find(p => p.id === id)?.display_name || (id === me.id ? "나" : "알 수 없음");
const reqInfo = l => [l.internal_requester ? `내부 ${l.internal_requester}` : "", l.external_requester ? `외부 ${l.external_requester}` : ""].filter(Boolean).join(" · ");
const shipOf = (no, dir) => shipments.find(s => s.loan_no === no && s.direction === dir);

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
function errText(e) {
  if (!e) return "알 수 없는 오류가 났어요.";
  if (e.code === "23P01") return "그 기간에 이미 다른 예약이 있어요. 기간을 바꿔 주세요.";
  if (e.code === "23505") return "이미 쓰는 값이에요. 자산번호가 겹치지 않는지 확인해 주세요.";
  if (e.code === "42501" && !/[가-힣]/.test(e.message || "")) return "권한이 없어요. 장비 관리자에게 문의해 주세요.";
  if (/Failed to fetch|NetworkError/i.test(e.message || "")) return "서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";
  return e.message || "저장하지 못했어요.";
}
function fail(e) { console.error(e); toast(errText(e)); }
async function must(p) { const { data, error } = await p; if (error) throw error; return data; }

const KAKAO_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.52 2 10.86c0 2.8 1.86 5.25 4.66 6.64l-.95 3.48c-.08.3.26.54.52.37l4.15-2.74c.53.06 1.07.1 1.62.1 5.52 0 10-3.52 10-7.85S17.52 3 12 3z"/></svg>`;

  $("#kakaoLogin")?.addEventListener("click", async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: "kakao", options: { redirectTo: location.origin + location.pathname } });
    if (error) fail(error);

  $("#reload")?.addEventListener("click", () => location.reload());

async function logout() { await sb.auth.signOut(); location.hash = ""; location.reload(); }
$("#logout").addEventListener("click", logout);

/* ---------- 데이터 ---------- */
async function loadAll() {
  const [e, l, s, p] = await Promise.all([
    must(sb.from("equipment").select("*").order("asset_no")),
    must(sb.from("loans").select("*").order("start_date", { ascending: false }).limit(3000)),
    must(sb.from("shipments").select("*")),
    must(sb.from("profiles").select("id,display_name,role,status,created_at").order("created_at")),
  ]);
  equipment = e; loans = l; shipments = s; people = p;
}
async function refresh(quiet) {
  try { await loadAll(); softRender(); }
  catch (e) { if (!quiet) fail(e); }
}

/* ---------- 탭 ---------- */
const TABS = () => [
  ["home","현황"], ["cal","일정"], ["equip","장비"], ["request","출납 신청"], ["mine","내 신청"],
  ["ship","배송", shipments.filter(s => s.status === "pending").length],
  ["ledger","출납 대장", loans.filter(isOverdue).length],
  ...(me.isAdmin ? [["users","사용자", people.filter(p => p.status === "pending").length]] : []),
];
function renderTabs() {
  $("#tabs").innerHTML = TABS().map(([k, t, n]) => `<button role="tab" aria-selected="${view === k}" data-tab="${k}">${t}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("");
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; go(b.dataset.tab); });
function go(v) { view = v; try { history.replaceState(null, "", "#" + v); } catch {} render(); window.scrollTo(0, 0); }

/* ---------- 화면 ---------- */
function render() {
  renderTabs();
  const views = { home: vHome, cal: vCal, equip: vEquip, request: vRequest, mine: vMine, ship: vShip, ledger: vLedger, users: vUsers };
  if (!views[view] || (view === "users" && !me.isAdmin)) view = "home";
  $("#main").innerHTML = `<section data-view="${view}">${views[view]()}</section>`;
}

function loanLine(l, extra = "") {
  const ri = reqInfo(l);
  return `<div class="row"><div class="main"><b>${esc(eqById(l.equipment_id)?.name || "")}</b> <span class="mono">${esc(eqById(l.equipment_id)?.asset_no || "")}</span>
    <div class="meta">${esc(l.customer || l.purpose)} · ${esc(nameOf(l.requester_id))}${ri ? ` (${esc(ri)})` : ""} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}${l.delivery ? " · 배송" : ""}</div></div>${extra}</div>`;
}

function vHome() {
  const t = todayStr();
  const out = loans.filter(isOverdue).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const startSoon = loans.filter(l => l.status === "reserved" && l.start_date <= addDays(t, 1)).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const dueToday = loans.filter(l => l.status === "out" && l.due_date === t);
  const checking = loans.filter(l => l.status === "checking");
  const cnt = k => equipment.filter(e => e.status === k).length;
  return `
  <div class="head"><div class="grow"><h2>오늘 현황</h2><p class="sub">${t.replace(/-/g, ".")} 기준. 연체는 반납 예정일이 지났는데 아직 출고 상태인 건이에요.</p></div>
    <button class="btn" data-act="refresh">새로 고침</button><button class="btn pri" data-go="request">출납 신청</button></div>
  <div class="stats">
    <div class="stat"><b>${cnt("available")}</b><span>사용 가능 장비</span></div>
    <div class="stat"><b>${cnt("onloan")}</b><span>대여 중</span></div>
    <div class="stat"><b>${cnt("repair") + cnt("inspect")}</b><span>점검·수리 중</span></div>
    <div class="stat ${out.length ? "alert" : ""}"><b>${out.length}</b><span>연체</span></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>연체</h3><div class="list">${out.length ? out.map(l => loanLine(l, `<span class="pill p-bad">${daysBetween(l.due_date, t)}일 지남</span>`)).join("") : `<div class="empty">연체된 장비가 없어요.</div>`}</div></div>
    <div class="panel"><h3>출고 예정 (오늘·내일)</h3><div class="list">${startSoon.length ? startSoon.map(l => loanLine(l, me.isAdmin ? `<button class="btn sm pri" data-act="checkout" data-id="${l.id}">출고 처리</button>` : pill(LOAN_STATUS, l.status))).join("") : `<div class="empty">예정된 출고가 없어요.</div>`}</div></div>
    <div class="panel"><h3>오늘 반납 예정</h3><div class="list">${dueToday.length ? dueToday.map(l => loanLine(l)).join("") : `<div class="empty">오늘 반납 예정인 장비가 없어요.</div>`}</div></div>
    <div class="panel"><h3>반납 확인 대기</h3><div class="list">${checking.length ? checking.map(l => loanLine(l, me.isAdmin ? `<button class="btn sm pri" data-act="inspect" data-id="${l.id}">반납 확인</button>` : pill(LOAN_STATUS, l.status))).join("") : `<div class="empty">확인을 기다리는 반납이 없어요.</div>`}</div></div>
  </div>`;
}

/* ---------- 일정 (달력) ---------- */
const DOW = ["일","월","화","수","목","금","토"];
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const loanEnd = l => isOverdue(l) ? (todayStr() > l.due_date ? todayStr() : l.due_date) : l.due_date;
const calClass = l => isOverdue(l) ? "c-overdue" : ({ reserved: "c-reserved", out: "c-out", checking: "c-checking", done: "c-done" })[l.status] || "c-done";
function calLoans() {
  return loans.filter(l => l.status !== "cancelled"
    && (!cal.mine || l.requester_id === me.id)
    && (!cal.loc || locGroup(eqById(l.equipment_id)?.location) === cal.loc))
    .sort((a, b) => a.start_date.localeCompare(b.start_date) || a.loan_no.localeCompare(b.loan_no) || (eqById(a.equipment_id)?.asset_no || "").localeCompare(eqById(b.equipment_id)?.asset_no || ""));
}
const onDay = (list, d) => list.filter(l => l.start_date <= d && d <= loanEnd(l));
const chipLabel = l => `${eqById(l.equipment_id)?.name || "?"} · ${nameOf(l.requester_id)}`;
function vCal() {
  const [y, m] = cal.ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const list = calLoans(), t = todayStr();
  const monthLoans = list.filter(l => l.start_date <= ds(last) && loanEnd(l) >= ds(first));
  const head = `
  <div class="head"><div class="grow"><h2>일정</h2><p class="sub">누가 어떤 장비를 언제 쓰는지 보여 줘요. 일정을 누르면 자세히 볼 수 있어요.</p></div>
    <button class="btn pri" data-go="request">출납 신청</button></div>
  <div class="toolbar">
    <div class="calnav"><button class="btn sm" data-act="calPrev" aria-label="이전 달">◀</button><b>${y}년 ${m}월</b><button class="btn sm" data-act="calNext" aria-label="다음 달">▶</button><button class="btn sm" data-act="calToday">이번 달</button></div>
    <span style="flex:1"></span>
    <div class="seg" role="group" aria-label="보기"><button data-act="calMode" data-v="month" aria-pressed="${cal.mode === "month"}">달력</button><button data-act="calMode" data-v="equip" aria-pressed="${cal.mode === "equip"}">장비별</button></div>
    <select id="calLoc"><option value="">전체 위치</option>${[...LOCS, "기타"].map(c => `<option ${cal.loc === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <label class="check"><input type="checkbox" id="calMine" ${cal.mine ? "checked" : ""}> 내 신청만</label>
  </div>
  <div class="legend"><span><i class="c-reserved"></i>예약</span><span><i class="c-out"></i>출고</span><span><i class="c-overdue"></i>연체</span><span><i class="c-checking"></i>반납 확인 중</span><span><i class="c-done"></i>반납 완료</span><span class="meta">· 이번 달 ${new Set(monthLoans.map(l => l.loan_no)).size}건, 장비 ${monthLoans.length}대</span></div>`;

  if (cal.mode === "equip") {
    const days = []; for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) days.push(new Date(d));
    const eqs = equipment.filter(e => e.status !== "retired" && (!cal.loc || locGroup(e.location) === cal.loc))
      .filter(e => !cal.mine || monthLoans.some(l => l.equipment_id === e.id))
      .sort((a, b) => a.category.localeCompare(b.category) || a.asset_no.localeCompare(b.asset_no));
    const rows = eqs.map(e => {
      const mine = monthLoans.filter(l => l.equipment_id === e.id);
      return `<tr><td class="eqc"><b>${esc(e.name)}</b><div class="meta mono">${esc(e.asset_no)} · ${esc(e.location)}</div></td>${days.map(d => {
        const key = ds(d), l = mine.find(x => x.start_date <= key && key <= loanEnd(x));
        const today = key === t ? "today " : "";
        if (!l) return `<td class="d ${d.getDay() % 6 === 0 ? "we " : ""}${today}"></td>`;
        const cls = today;
        const startCell = key === l.start_date || key === ds(first);
        return `<td class="d ${cls}${calClass(l)}" data-act="calLoan" data-id="${l.id}" title="${esc(chipLabel(l))} (${fmtD(l.start_date)}–${fmtD(l.due_date)})">${startCell ? esc((nameOf(l.requester_id) || "").slice(0, 2)) : ""}</td>`;
      }).join("")}</tr>`;
    }).join("");
    return head + (eqs.length ? `<div class="tbl-wrap tl"><table><thead><tr><th class="eqc">장비</th>${days.map(d => `<th class="d ${d.getDay() % 6 === 0 ? "we " : ""}${ds(d) === t ? "today" : ""}">${d.getDate()}<div class="meta">${DOW[d.getDay()]}</div></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="meta">막대 첫 칸에 신청자 이름 앞 두 글자가 보여요. 칸을 누르면 자세히 볼 수 있어요.</p>`
      : `<div class="panel"><div class="empty">조건에 맞는 장비가 없어요.</div></div>`);
  }

  const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let d = new Date(start); cells.length < 42 && (d <= last || cells.length % 7); d.setDate(d.getDate() + 1)) {
    const key = ds(d), items = onDay(monthLoans, key), inMonth = d.getMonth() === m - 1;
    const chips = items.slice(0, 3).map(l => {
      const cont = key !== l.start_date && d.getDay() !== 0;
      return `<button class="chip ${calClass(l)}${cont ? " cont" : ""}" data-act="calLoan" data-id="${l.id}" title="${esc(chipLabel(l))} (${fmtD(l.start_date)}–${fmtD(l.due_date)})">${cont ? "↳ " : ""}${esc(chipLabel(l))}</button>`;
    }).join("");
    cells.push(`<div class="day${inMonth ? "" : " out"}${key === t ? " today" : ""}${d.getDay() === 0 ? " sun" : ""}" data-act="calDay" data-d="${key}">
      <div class="dn"><b>${d.getDate()}</b><span class="cnt">${items.length || ""}</span></div>${chips}${items.length > 3 ? `<span class="more">+${items.length - 3}건 더</span>` : ""}</div>`);
  }
  return head + `<div class="cal">${DOW.map(w => `<div class="dow">${w}</div>`).join("")}${cells.join("")}</div>
    <p class="meta">↳ 표시는 앞에서 이어지는 일정이에요. 휴대폰에서는 날짜를 누르면 그날 일정이 보여요.</p>`;
}
function calDay(key) {
  const items = onDay(calLoans(), key);
  modal(`<h2>${key.replace(/-/g, ".")} (${DOW[new Date(key + "T00:00:00").getDay()]}) 일정</h2>
    <div class="list">${items.map(l => `<div class="row"><div class="main"><b>${esc(eqById(l.equipment_id)?.name)}</b> <span class="mono">${esc(eqById(l.equipment_id)?.asset_no)}</span>
      <div class="meta">${esc(nameOf(l.requester_id))} · ${esc(l.customer || l.purpose)} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}</div></div>
      ${isOverdue(l) ? `<span class="pill p-bad">연체</span>` : pill(LOAN_STATUS, l.status)}<button class="btn sm" data-act="calLoan" data-id="${l.id}">자세히</button></div>`).join("") || `<div class="empty">이날은 일정이 없어요.</div>`}</div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button>${key >= todayStr() ? `<button class="btn pri" id="dReq">이날부터 신청</button>` : ""}</div>`, mm => {
    $("#dReq", mm)?.addEventListener("click", () => { draft.start = key; if (draft.due < key) draft.due = addDays(key, 2); closeModal(); go("request"); });
  });
}
function calLoan(id) {
  const l = loans.find(x => x.id === id); if (!l) return;
  const e = eqById(l.equipment_id) || {}, group = loans.filter(x => x.loan_no === l.loan_no && x.id !== l.id && x.status !== "cancelled");
  const o = shipOf(l.loan_no, "outbound"), ri = reqInfo(l);
  modal(`<div class="head"><div class="grow"><h2>${esc(e.name)}</h2><div class="meta"><span class="mono">${esc(e.asset_no)}</span> · ${esc(e.location)}</div></div>${isOverdue(l) ? `<span class="pill p-bad">연체 ${daysBetween(l.due_date, todayStr())}일</span>` : pill(LOAN_STATUS, l.status)}</div>
    <div class="fields">
      <div><div class="meta">신청번호</div><div class="mono">${esc(l.loan_no)}</div></div>
      <div><div class="meta">기간</div><div class="mono">${esc(l.start_date)} ~ ${esc(l.due_date)}${l.extension_count ? ` (연장 ${l.extension_count}회)` : ""}</div></div>
      <div><div class="meta">신청자</div><div>${esc(nameOf(l.requester_id))}</div></div>
      <div><div class="meta">요청자</div><div>${esc(ri || "–")}</div></div>
      <div><div class="meta">목적</div><div>${esc(l.purpose)}</div></div>
      <div><div class="meta">고객사·기관</div><div>${esc(l.customer || "–")}</div></div>
      <div class="wide"><div class="meta">배송</div><div>${o ? `${esc(OUT_STATUS[o.status]?.[0] || o.status)} · ${esc(o.address)} (${fmtD(o.requested_date)} 도착 희망)` : "직접 수령"}</div></div>
      ${l.note ? `<div class="wide"><div class="meta">메모</div><div style="white-space:pre-wrap">${esc(l.note)}</div></div>` : ""}
      ${group.length ? `<div class="wide"><div class="meta">함께 신청한 장비</div><div>${group.map(x => `${esc(eqById(x.equipment_id)?.name)} (${esc(eqById(x.equipment_id)?.asset_no)})`).join(", ")}</div></div>` : ""}
    </div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn" id="lLedger">출납 대장에서 보기</button></div>`, mm => {
    $("#lLedger", mm).addEventListener("click", () => { filters.ledgerQ = l.loan_no; filters.ledgerSt = "all"; closeModal(); go("ledger"); });
  });
}

function vEquip() {
  const q = filters.eqQ.trim().toLowerCase();
  const list = equipment.filter(e => (!filters.eqCat || e.category === filters.eqCat) && (!filters.eqLoc || locGroup(e.location) === filters.eqLoc) && (!q || `${e.asset_no} ${e.name} ${e.item_no} ${e.serial_no} ${e.location}`.toLowerCase().includes(q)));
  const t = todayStr();
  const byLoc = [...LOCS, "기타"].map(k => [k, equipment.filter(e => locGroup(e.location) === k && e.status !== "retired").length]);
  const needRepair = equipment.filter(e => e.status === "repair").length;
  return `
  <div class="head"><div class="grow"><h2>장비</h2><p class="sub">장비 ${equipment.length}대. 보관 위치와 최근 점검 결과는 반납 신청과 관리자 점검 때 자동으로 바뀌어요. 행을 누르면 자세히 볼 수 있어요.</p></div>
    ${me.isAdmin ? `<button class="btn pri" data-act="eqNew">장비 등록</button>` : ""}</div>
  <div class="stats">${byLoc.map(([k, n]) => `<div class="stat"><b>${n}</b><span>${k} 보관</span></div>`).join("")}
    <div class="stat ${needRepair ? "alert" : ""}"><b>${needRepair}</b><span>수리 필요</span></div></div>
  <div class="toolbar">
    <input id="eqQ" type="search" placeholder="제품명·자산번호·위치 검색" value="${esc(filters.eqQ)}" style="flex:1;min-width:200px">
    <select id="eqLoc"><option value="">전체 위치</option>${[...LOCS, "기타"].map(c => `<option ${filters.eqLoc === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <select id="eqCat"><option value="">전체 분류</option>${CATS.map(c => `<option ${filters.eqCat === c ? "selected" : ""}>${c}</option>`).join("")}</select>
  </div>
  ${equipment.length === 0 ? `<div class="panel"><div class="empty">아직 등록된 장비가 없어요. ${me.isAdmin ? "‘장비 등록’으로 첫 장비를 추가해 주세요." : "장비 관리자가 장비를 등록하면 여기에 나타나요."}</div></div>` : `
  <div class="tbl-wrap"><table>
    <thead><tr><th>자산번호</th><th>제품명</th><th>분류</th><th>보관 위치</th><th>상태</th><th>최근 점검</th><th>다음 예약</th></tr></thead>
    <tbody>${list.map(e => {
      const next = loans.filter(l => l.equipment_id === e.id && ACTIVE(l.status) && l.due_date >= t).sort((a, b) => a.start_date.localeCompare(b.start_date))[0];
      const cur = e.status === "onloan" ? loans.find(l => l.equipment_id === e.id && l.status === "out") : null;
      return `<tr data-act="eqView" data-id="${e.id}" style="cursor:pointer">
        <td class="mono">${esc(e.asset_no)}</td><td>${esc(e.name)}<div class="meta">${esc(e.item_no || "")}</div></td>
        <td>${esc(e.category)}</td>
        <td>${esc(e.location)}${cur ? `<div class="meta">지금: ${esc(cur.customer || cur.purpose)} (${esc(nameOf(cur.requester_id))})</div>` : ""}</td>
        <td>${pill(EQ_STATUS, e.status)}</td>
        <td>${checkCell(e)}</td>
        <td class="mono">${next ? `${fmtD(next.start_date)}–${fmtD(next.due_date)}` : "–"}</td></tr>`;
    }).join("") || `<tr><td colspan="7" class="empty">조건에 맞는 장비가 없어요.</td></tr>`}</tbody>
  </table></div>`}`;
}

function conflictsFor(eqId, start, due, ignoreId) {
  return loans.filter(l => l.equipment_id === eqId && l.id !== ignoreId && ACTIVE(l.status) && l.start_date <= due && start <= l.due_date);
}

function vRequest() {
  const { start, due } = draft;
  const badRange = !start || !due || due < start;
  const rows = equipment.filter(e => e.status !== "retired").sort((a, b) => a.category.localeCompare(b.category) || a.asset_no.localeCompare(b.asset_no));
  const pickHtml = rows.map(e => {
    const c = badRange ? [] : conflictsFor(e.id, start, due);
    const blocked = e.status === "repair" || e.status === "inspect" || c.length > 0;
    if (blocked) draft.picks.delete(e.id);
    const why = e.status === "repair" ? "수리 중" : e.status === "inspect" ? "점검 중" : c.length ? "예약 겹침" : "";
    const title = c.length ? `${c[0].loan_no} (${fmtD(c[0].start_date)}–${fmtD(c[0].due_date)})` : why;
    return `<label class="${blocked ? "off" : ""}"><input type="checkbox" data-pick="${e.id}" ${draft.picks.has(e.id) ? "checked" : ""} ${blocked ? "disabled" : ""}>
      <div class="main"><b>${esc(e.name)}</b> <span class="mono">${esc(e.asset_no)}</span><div class="meta">${esc(e.category)} · ${esc(e.location)}</div></div>
      ${blocked ? `<span class="pill p-bad" title="${esc(title)}">${esc(why)}</span>` : `<span class="pill p-ok">가능</span>`}</label>`;
  }).join("");
  return `
  <div class="head"><div class="grow"><h2>출납 신청</h2><p class="sub">승인 없이 저장하는 즉시 예약이 확정돼요. 같은 기간에 이미 예약된 장비는 고를 수 없어요.</p></div></div>
  <form id="reqForm" class="grid2" novalidate>
    <div class="panel">
      <h3>1. 기간과 장비</h3>
      <div class="fields">
        <label class="f req"><span>사용 시작일</span><input type="date" id="rStart" value="${esc(start)}" min="${todayStr()}" required></label>
        <label class="f req"><span>반납 예정일</span><input type="date" id="rDue" value="${esc(due)}" required></label>
      </div>
      ${badRange ? `<div class="notice bad">반납 예정일은 사용 시작일과 같거나 그 뒤여야 해요.</div>` : ""}
      ${rows.length ? `<div class="pick" id="pickList">${pickHtml}</div>` : `<div class="empty">신청할 수 있는 장비가 없어요.</div>`}
      <div class="meta" id="pickCount">선택 ${draft.picks.size}대</div>
    </div>
    <div class="panel">
      <h3>2. 사용 정보</h3>
      <div class="fields">
        <label class="f wide"><span>신청자</span><input id="rApplicant" value="${esc(profile?.display_name || "나")}" readonly></label>
        <label class="f"><span>내부 요청자</span><input id="rInternal" placeholder="요청한 사내 담당자 (없으면 비움)"></label>
        <label class="f"><span>외부 요청자</span><input id="rExternal" placeholder="고객사 담당자 이름·직함"></label>
        <label class="f req"><span>목적</span><select id="rPurpose">${PURPOSES.map(p => `<option>${p}</option>`).join("")}</select></label>
        <label class="f"><span>고객사·기관</span><input id="rCustomer" placeholder="예: OO대학교 간호학과"></label>
        <label class="f wide"><span>메모</span><textarea id="rNote" placeholder="데모 장소, 함께 가져갈 소모품 등"></textarea></label>
      </div>
      <label class="check"><input type="checkbox" id="rDelivery"> 외부 물류사 배송이 필요해요</label>
      <div class="ship-box" id="shipBox" hidden>
        <div class="fields">
          <label class="f req"><span>수령인</span><input id="sName"></label>
          <label class="f req"><span>연락처</span><input id="sPhone" inputmode="tel" placeholder="010-0000-0000"></label>
          <label class="f req wide"><span>배송지 주소</span><input id="sAddr"></label>
          <label class="f req"><span>도착 희망일</span><input type="date" id="sDate" value="${esc(start)}"></label>
          <label class="f"><span>회수 희망일</span><input type="date" id="sPick" value="${esc(addDays(due || start, 1))}"></label>
          <label class="f wide"><span>배송 메모</span><textarea id="sMemo" placeholder="하차 위치, 엘리베이터 유무, 설치 필요 여부 등"></textarea></label>
        </div>
      </div>
      <div class="notice bad" id="reqErr" hidden></div>
      <div class="toolbar" style="justify-content:flex-end"><button class="btn pri" type="submit" id="reqSubmit">신청 저장</button></div>
    </div>
  </form>`;
}

function vMine() {
  const mine = loans.filter(l => l.requester_id === me.id).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  const open = mine.filter(l => l.status !== "done" && l.status !== "cancelled");
  const past = mine.filter(l => !open.includes(l)).slice(0, 30);
  const actions = l => {
    if (l.status === "reserved") return `<button class="btn sm" data-act="extend" data-id="${l.id}">연장</button><button class="btn sm danger" data-act="cancel" data-id="${l.id}">취소</button>`;
    if (l.status === "out") return `<button class="btn sm" data-act="extend" data-id="${l.id}">연장</button><button class="btn sm pri" data-act="return" data-id="${l.id}">반납 신청</button>`;
    return "";
  };
  const line = l => { const e = eqById(l.equipment_id) || {}, ri = reqInfo(l); return `<div class="row"><div class="main"><b>${esc(e.name)}</b> <span class="mono">${esc(e.asset_no)}</span>
      <div class="meta"><span class="mono">${esc(l.loan_no)}</span> · ${esc(l.customer || l.purpose)}${ri ? ` · ${esc(ri)}` : ""} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}${l.delivery ? " · 배송" : ""}</div></div>
      ${isOverdue(l) ? `<span class="pill p-bad">연체 ${daysBetween(l.due_date, todayStr())}일</span>` : pill(LOAN_STATUS, l.status)} ${actions(l)}</div>`; };
  return `
  <div class="head"><div class="grow"><h2>내 신청</h2><p class="sub">반납을 누르면 반납 방법과 장비 상태를 적는 반납 신청서가 열려요. 장비 관리자가 점검하면 반납이 완료돼요.</p></div></div>
  <div class="panel"><h3>진행 중 ${open.length}건</h3><div class="list">${open.map(line).join("") || `<div class="empty">진행 중인 신청이 없어요. ‘출납 신청’에서 장비를 빌려 보세요.</div>`}</div></div>
  <div class="panel"><h3>지난 신청</h3><div class="list">${past.map(line).join("") || `<div class="empty">지난 신청이 없어요.</div>`}</div></div>`;
}

function groupBy(arr, k) { const m = new Map(); for (const x of arr) { if (!m.has(x[k])) m.set(x[k], []); m.get(x[k]).push(x); } return [...m.values()]; }

function vShip() {
  const groups = groupBy(loans.filter(l => l.status !== "cancelled" && (l.delivery || shipOf(l.loan_no, "pickup"))), "loan_no").sort((a, b) => a[0].start_date.localeCompare(b[0].start_date));
  const openG = groups.filter(g => { const o = shipOf(g[0].loan_no, "outbound"), p = shipOf(g[0].loan_no, "pickup"); return (o && o.status !== "delivered") || (p && !["done", "cancelled"].includes(p.status)); });
  const card = g => {
    const l = g[0], o = shipOf(l.loan_no, "outbound") || {}, p = shipOf(l.loan_no, "pickup"), c = o.id ? o : (p || {});
    return `<div class="panel">
      <div class="head"><div class="grow"><h3><span class="mono">${esc(l.loan_no)}</span> · ${esc(l.customer || l.purpose)}</h3>
        <div class="meta">${g.map(x => `${esc(eqById(x.equipment_id)?.name)} (${esc(eqById(x.equipment_id)?.asset_no)})`).join(", ")}</div></div>
        ${[...new Set(g.map(x => x.status))].map(k => pill(LOAN_STATUS, k)).join(" ")}</div>
      <div class="meta">${o.id ? "수령" : "회수 담당"} ${esc(c.recipient)} · ${esc(c.phone)} · ${esc(c.address)}</div>
      ${o.id ? `<div class="row"><div class="main"><b>출고 배송</b><div class="meta">도착 희망 ${fmtD(o.requested_date)}${o.carrier ? ` · ${esc(o.carrier)}` : ""}${o.tracking_no ? ` · 운송장 <span class="mono">${esc(o.tracking_no)}</span>` : ""}</div></div>
        ${pill(OUT_STATUS, o.status)}
        <button class="btn sm" data-act="mail" data-no="${esc(l.loan_no)}" data-dir="outbound">요청 메일</button>
        ${me.isAdmin ? `<button class="btn sm" data-act="shipEdit" data-sid="${o.id}">상태·운송장</button>` : ""}</div>` : ""}
      ${p ? `<div class="row"><div class="main"><b>회수</b><div class="meta">회수 희망 ${fmtD(p.requested_date)}${p.tracking_no ? ` · 운송장 <span class="mono">${esc(p.tracking_no)}</span>` : ""}</div></div>
        ${pill(PICK_STATUS, p.status)}
        <button class="btn sm" data-act="mail" data-no="${esc(l.loan_no)}" data-dir="pickup">회수 메일</button>
        ${me.isAdmin ? `<button class="btn sm" data-act="shipEdit" data-sid="${p.id}">상태·운송장</button>` : ""}</div>` : ""}
    </div>`;
  };
  return `
  <div class="head"><div class="grow"><h2>배송 요청</h2><p class="sub">‘요청 메일’로 물류사에 보낼 문안을 복사하고, 보낸 뒤 상태를 ‘요청 완료’로 바꿔 주세요. 회수 요청은 반납 신청에서 ‘물류사 회수 요청’을 고르면 ‘요청 전’으로 바뀌어요.</p></div></div>
  ${openG.length ? openG.map(card).join("") : `<div class="panel"><div class="empty">처리할 배송 요청이 없어요. 출납 신청에서 ‘배송 필요’를 체크하면 여기에 나타나요.</div></div>`}`;
}

function vLedger() {
  const q = filters.ledgerQ.trim().toLowerCase(), st = filters.ledgerSt;
  const list = loans.filter(l => {
    if (st === "open" && !(ACTIVE(l.status) || l.status === "checking")) return false;
    if (st === "overdue" && !isOverdue(l)) return false;
    if (st === "done" && l.status !== "done") return false;
    if (st === "cancelled" && l.status !== "cancelled") return false;
    const e = eqById(l.equipment_id) || {};
    return !q || `${l.loan_no} ${e.asset_no} ${e.name} ${l.customer} ${nameOf(l.requester_id)} ${reqInfo(l)}`.toLowerCase().includes(q);
  }).sort((a, b) => b.start_date.localeCompare(a.start_date) || a.loan_no.localeCompare(b.loan_no));
  const act = l => {
    if (!me.isAdmin) return "";
    if (l.status === "reserved") return `<button class="btn sm pri" data-act="checkout" data-id="${l.id}">출고</button>`;
    if (l.status === "out") return `<button class="btn sm" data-act="return" data-id="${l.id}">반납 신청</button>`;
    if (l.status === "checking") return `<button class="btn sm pri" data-act="inspect" data-id="${l.id}">반납 확인</button>`;
    return "";
  };
  return `
  <div class="head"><div class="grow"><h2>출납 대장</h2><p class="sub">장비 1대가 한 줄이에요. 함께 신청한 장비는 같은 신청번호를 써요.${me.isAdmin ? "" : " 출고·점검은 장비 관리자만 할 수 있어요."}</p></div>
    <button class="btn" data-act="csv">CSV 내보내기</button></div>
  <div class="toolbar">
    <input id="lgQ" type="search" placeholder="신청번호·장비·고객사·신청자 검색" value="${esc(filters.ledgerQ)}" style="flex:1;min-width:200px">
    <select id="lgSt">${[["open","진행 중"],["overdue","연체"],["done","반납 완료"],["cancelled","취소"],["all","전체"]].map(([k, t]) => `<option value="${k}" ${st === k ? "selected" : ""}>${t}</option>`).join("")}</select>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>신청번호</th><th>장비</th><th>신청자·요청자</th><th>목적·고객사</th><th>기간</th><th>배송</th><th>상태</th><th>출고</th><th>반납·점검</th><th></th></tr></thead>
    <tbody>${list.map(l => { const e = eqById(l.equipment_id) || {}, ri = reqInfo(l), o = shipOf(l.loan_no, "outbound"); return `<tr class="${isOverdue(l) ? "overdue" : ""}">
      <td class="mono">${esc(l.loan_no)}</td>
      <td>${esc(e.name)}<div class="meta mono">${esc(e.asset_no)}</div></td>
      <td>${esc(nameOf(l.requester_id))}${ri ? `<div class="meta">${esc(ri)}</div>` : ""}</td>
      <td>${esc(l.purpose)}<div class="meta">${esc(l.customer || "")}</div></td>
      <td class="mono">${fmtD(l.start_date)}–${fmtD(l.due_date)}${l.extension_count ? `<div class="meta">연장 ${l.extension_count}회</div>` : ""}</td>
      <td>${l.delivery && o ? pill(OUT_STATUS, o.status) : "–"}</td>
      <td>${isOverdue(l) ? `<span class="pill p-bad">연체 ${daysBetween(l.due_date, todayStr())}일</span>` : pill(LOAN_STATUS, l.status)}</td>
      <td class="mono">${fmtT(l.checkout_at)}</td>
      <td>${l.returned_at ? `<span class="mono">${fmtT(l.returned_at)}</span>` : "–"}${l.return_method ? `<div class="meta">${esc(RETURN_METHODS[l.return_method])} · 자가점검 ${esc(CONDS[l.return_self_check] || "–")}${l.return_self_note ? ` (${esc(l.return_self_note)})` : ""}</div>` : ""}${l.return_condition ? `<div class="meta">점검 ${esc(CONDS[l.return_condition])}${l.return_note ? ` · ${esc(l.return_note)}` : ""}</div>` : ""}</td>

      <td class="mono">${(p.created_at || "").slice(0, 10)}</td>
      <td>${self ? "" : [

/* ---------- 모달 ---------- */
function modal(html, onMount) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = root.firstElementChild;
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close-btn]")) closeModal(); });
  onMount && onMount(ov.firstElementChild);
  const f = ov.querySelector("input:not([type=radio]),select,textarea,button"); f && f.focus();
}
function showChangelog() {
  modal(`<h2>버전 기록</h2><p class="meta">지금 보고 있는 버전은 <b>${APP_VERSION}</b>이에요. 새로 올렸는데 번호가 그대로면 강력 새로 고침(PC: Ctrl+Shift+R)을 해 주세요.</p>
    <div class="log" style="display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow:auto">${CHANGELOG.map(c => `<div>
      <h3><span class="mono">${esc(c.v)}</span><span class="meta">${esc(c.date)}</span>${c.v === APP_VERSION ? `<span class="pill p-acc">현재</span>` : ""}</h3>
      <ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      ${c.db ? `<div class="meta" style="margin-top:4px">DB 변경: <span class="mono">${esc(c.db)}</span></div>` : ""}</div>`).join("")}</div>

}
function closeModal() { $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
async function busy(btn, fn) { if (btn) btn.disabled = true; try { await fn(); } catch (e) { fail(e); } finally { if (btn) btn.disabled = false; } }

function confirmBox(title, body, okText, fn, danger) {
  modal(`<h2>${esc(title)}</h2><p class="meta">${body}</p><div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn ${danger ? "danger" : "pri"}" id="cOk">${esc(okText)}</button></div>`,
    m => { const b = $("#cOk", m); b.addEventListener("click", () => busy(b, async () => { await fn(); closeModal(); await refresh(); })); });
}

function nextAssetNo() { const n = Math.max(0, ...equipment.map(e => +(/DEMO-(\d+)/.exec(e.asset_no)?.[1] || 0))); return `DEMO-${String(n + 1).padStart(4, "0")}`; }

      <label class="f wide"><span>구성품 (반납 점검 기준)</span><textarea id="eComp" placeholder="본체, 충전기, 케이스 …">${esc(e.components)}</textarea></label>

function verdictHtml(cond) {
  const repair = cond === "broken" || cond === "missing";
  return `<div><h3>장비 판정</h3><div class="fields" style="margin-top:6px">
    <label class="check"><input type="radio" name="vd" value="ok" ${repair ? "" : "checked"}> 사용 가능</label>
    <label class="check"><input type="radio" name="vd" value="repair" ${repair ? "checked" : ""}> 수리 필요</label></div>
    <div class="meta">파손·구성품 누락이면 ‘수리 필요’로 자동 선택돼요. 필요하면 바꿔 주세요.</div></div>`;
}
function bindVerdict(m, condName) {
  let touched = false;
  m.querySelectorAll('input[name="vd"]').forEach(r => r.addEventListener("change", () => touched = true));
  m.querySelectorAll(`input[name="${condName}"]`).forEach(r => r.addEventListener("change", () => {
    if (touched || !r.checked) return;
    const rep = r.value === "broken" || r.value === "missing";
    m.querySelector(`input[name="vd"][value="${rep ? "repair" : "ok"}"]`).checked = true;
  }));
}
function eqCheck(e) {
  const lent = e.status === "onloan" || e.status === "inspect";
  modal(`<h2>상태 점검 기록</h2><p class="meta">${esc(e.name)} (<span class="mono">${esc(e.asset_no)}</span>) · 실사나 수리 후 확인처럼 출납과 관계없는 점검을 기록해요.</p>
    <div class="fields">${Object.entries(CONDS).map(([k, t]) => `<label class="check"><input type="radio" name="kc" value="${k}" ${(e.last_check || "ok") === k ? "checked" : ""}> ${t}</label>`).join("")}</div>
    <label class="f"><span>점검 메모</span><textarea id="kNote"></textarea></label>
    ${lent ? `<div class="notice">지금 ${esc(EQ_STATUS[e.status][0])} 상태라서 장비 상태는 바꾸지 않고 점검 결과만 기록해요.</div>` : verdictHtml(e.last_check || "ok")}
    <div class="fields">${locPicker("k", e.location)}</div>
    <div class="notice bad" id="kErr" hidden></div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="kOk">기록</button></div>`, m => {
    bindLocPicker(m, "k"); if (!lent) bindVerdict(m, "kc");
    const b = $("#kOk", m);
    b.addEventListener("click", () => {
      const cond = m.querySelector('input[name="kc"]:checked').value, note = $("#kNote", m).value.trim(), loc = locValue(m, "k"), err = $("#kErr", m);
      if (cond !== "ok" && !note) { err.textContent = "손상이나 누락이 있으면 내용을 메모에 적어 주세요."; err.hidden = false; return; }
      if (!loc) { err.textContent = "기타를 골랐다면 위치를 직접 입력해 주세요."; err.hidden = false; return; }
      const d = { last_check: cond, last_check_note: note, last_check_source: "admin", last_check_by: me.id, last_check_at: new Date().toISOString(), location: loc };
      if (!lent) d.status = m.querySelector('input[name="vd"]:checked').value === "repair" ? "repair" : (e.status === "repair" ? "available" : e.status);
      busy(b, async () => { await must(sb.from("equipment").update(d).eq("id", e.id)); closeModal(); toast("점검 결과를 기록했어요."); await refresh(); });
    });
  });
}

async function submitRequest() {
  const err = $("#reqErr"), show = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "nearest" }); };
  err.hidden = true;
  const start = $("#rStart").value, due = $("#rDue").value;
  if (!start || !due || due < start) return show("사용 기간을 확인해 주세요. 반납 예정일은 시작일과 같거나 그 뒤여야 해요.");
  if (start < todayStr()) return show("사용 시작일은 오늘이나 그 뒤로 정해 주세요.");
  const picks = [...draft.picks];
  if (!picks.length) return show("빌릴 장비를 1대 이상 골라 주세요.");
  let shipment = null;
  if ($("#rDelivery").checked) {
    shipment = { recipient: $("#sName").value.trim(), phone: $("#sPhone").value.trim(), address: $("#sAddr").value.trim(), date: $("#sDate").value, memo: $("#sMemo").value.trim() };
    if (!shipment.recipient || !shipment.phone || !shipment.address || !shipment.date) return show("배송이 필요하면 수령인, 연락처, 주소, 도착 희망일을 모두 입력해 주세요.");
    if ($("#sPick").value) shipment.pickup_date = $("#sPick").value;
  }
  const btn = $("#reqSubmit"); btn.disabled = true;
  try {
    const no = await must(sb.rpc("create_loan_request", {
      p_equipment_ids: picks, p_start: start, p_due: due, p_purpose: $("#rPurpose").value,
      p_customer: $("#rCustomer").value, p_internal: $("#rInternal").value, p_external: $("#rExternal").value,
      p_note: $("#rNote").value, p_shipment: shipment,
    }));
    draft = { start: todayStr(), due: addDays(todayStr(), 7), picks: new Set() };
    await refresh(true); go("mine");
    toast(`${no} 예약을 확정했어요.${shipment ? " 배송 탭에서 물류사 요청 메일을 보내 주세요." : ""}`);
  } catch (e) { btn.disabled = false; show(errText(e)); await refresh(true); }
}

      const method = m.querySelector('input[name="rm"]:checked')?.value;
      const self = m.querySelector('input[name="sc"]:checked')?.value;
      const note = $("#scNote", m).value.trim();
      if (!method) return show("반납 방법을 골라 주세요.");
      if (!self) return show("장비 상태를 골라 주세요.");
      if (self !== "ok" && !note) return show("손상이나 누락이 있으면 내용을 메모에 적어 주세요.");
      let pickup = null;
      if (method === "pickup") {
        const date = $("#rpDate", m)?.value;
        if (!date) return show("회수 희망일을 골라 주세요.");
        pickup = { date };
        if ($("#rpName", m)) {
          Object.assign(pickup, { recipient: $("#rpName", m).value.trim(), phone: $("#rpPhone", m).value.trim(), address: $("#rpAddr", m).value.trim(), memo: $("#rpMemo", m).value.trim() });
          if (!pickup.recipient || !pickup.phone || !pickup.address) return show("담당자, 연락처, 회수 주소를 입력해 주세요.");
        }
      }
      b.disabled = true;
      const { error } = await sb.rpc("request_return", { p_loan_id: l.id, p_method: method, p_self_check: self, p_self_note: note, p_pickup: pickup });
      b.disabled = false;
      if (error) return show(errText(error));
      closeModal(); toast(method === "pickup" ? "반납을 신청했어요. 배송 탭에서 물류사에 회수 요청 메일을 보내 주세요." : "반납을 신청했어요. 장비를 " + RETURN_METHODS[method].slice(8) + "에 가져다 놓아 주세요."); await refresh();
    });
  });
}

function inspect(l) {
  const e = eqById(l.equipment_id) || {};
  const self = l.return_self_check, selfNote = l.return_self_note || "";
  const defLoc = ({ drop_munjeong: "문정", drop_uiwang: "의왕" })[l.return_method] || e.location;
  const defRepair = self === "broken" || self === "missing";
  modal(`<h2>반납 확인</h2><p class="meta">${esc(e.name)} (<span class="mono">${esc(e.asset_no)}</span>) · ${esc(nameOf(l.requester_id))} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}</p>
    ${self ? `<div class="panel" style="gap:6px">
      <h3>반납자 자가점검</h3>
      <div><span class="pill ${CHECK_PILL[self] || ""}">${esc(CONDS[self])}</span> <span class="meta">${esc(RETURN_METHODS[l.return_method] || "–")} · ${fmtT(l.returned_at)}</span></div>
      <div style="white-space:pre-wrap">${selfNote ? esc(selfNote) : `<span class="meta">메모 없음</span>`}</div>
      <div class="meta">확인하면 → 장비 ${defRepair ? "<b>수리 필요</b>" : "<b>사용 가능</b>"} · 보관 위치 <b>${esc(defLoc)}</b></div>
    </div>` : `<div class="notice">반납자 자가점검 기록이 없어요. 아래에서 직접 점검해 주세요.</div>`}
    <div id="iEdit" ${self ? "hidden" : ""} style="display:flex;flex-direction:column;gap:14px">
      ${e.components ? `<div><h3>구성품 기준</h3><div class="meta" style="white-space:pre-wrap">${esc(e.components)}</div></div>` : ""}
      <div><h3>관리자 점검 결과</h3><div class="fields" style="margin-top:6px">${Object.entries(CONDS).map(([k, t]) => `<label class="check"><input type="radio" name="cond" value="${k}" ${(self || "ok") === k ? "checked" : ""}> ${t}</label>`).join("")}</div></div>
      <label class="f"><span>점검 메모 (반납자 메모를 그대로 가져왔어요. 필요하면 고쳐 주세요)</span><textarea id="iNote">${esc(selfNote)}</textarea></label>
      ${verdictHtml(self || "ok")}
      <div class="fields">${locPicker("i", defLoc)}</div>
    </div>
    <div class="notice bad" id="iErr" hidden></div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button>
      ${self ? `<button class="btn" id="iEditBtn">내용 수정</button>` : ""}
      <button class="btn pri" id="iOk">${self ? "자가점검대로 확인" : "점검 완료"}</button></div>`, m => {
    bindLocPicker(m, "i"); bindVerdict(m, "cond");
    const b = $("#iOk", m);
    $("#iEditBtn", m)?.addEventListener("click", ev => { $("#iEdit", m).hidden = false; ev.target.remove(); b.textContent = "수정한 내용으로 확인"; $("#iNote", m).focus(); });
    b.addEventListener("click", async () => {
      const cond = m.querySelector('input[name="cond"]:checked').value, note = $("#iNote", m).value.trim(), err = $("#iErr", m);
      const repair = m.querySelector('input[name="vd"]:checked').value === "repair", loc = locValue(m, "i");
      const show = t => { err.textContent = t; err.hidden = false; $("#iEdit", m).hidden = false; };
      if (cond !== "ok" && !note) return show("손상이나 누락이 있으면 내용을 메모에 적어 주세요.");
      if (!loc) return show("기타를 골랐다면 보관 위치를 직접 입력해 주세요.");
      b.disabled = true;
      const { error } = await sb.from("loans").update({ status: "done", return_condition: cond, return_note: note, repair_needed: repair, return_location: loc }).eq("id", l.id);
      b.disabled = false;
      if (error) return show(errText(error));
      closeModal(); toast(repair ? `반납을 확인하고 장비를 수리 필요로 표시했어요. (${loc})` : `반납을 확인했어요. 장비를 다시 빌릴 수 있어요. (${loc})`); await refresh();
    });
  });
}

function mailText(no, dir) {
  const g = loans.filter(l => l.loan_no === no), l = g[0], s = shipOf(no, dir) || {};
  const items = g.map((x, i) => `  ${i + 1}. ${eqById(x.equipment_id)?.name} / 자산번호 ${eqById(x.equipment_id)?.asset_no} / 1대`).join("\n");
  const locs = [...new Set(g.map(x => eqById(x.equipment_id)?.location).filter(Boolean))].join(", ") || "확인 필요";
  if (dir === "pickup") return `제목: [Laerdal Medical Korea] 데모장비 회수 요청 – ${no}\n\n안녕하세요. 아래 데모장비 회수를 요청드립니다.\n\n■ 신청번호: ${no}\n■ 장비\n${items}\n■ 회수지: ${s.address}\n■ 담당자: ${s.recipient} / ${s.phone}\n■ 회수 희망일: ${s.requested_date || "협의"}\n■ 입고지: ${locs}\n■ 메모: ${s.memo || "없음"}\n\n회수 일정과 운송장 번호를 회신 부탁드립니다.\n감사합니다.`;
  return `제목: [Laerdal Medical Korea] 데모장비 배송 요청 – ${no}\n\n안녕하세요. 아래 데모장비 배송을 요청드립니다.\n\n■ 신청번호: ${no}\n■ 장비\n${items}\n■ 출발지: ${locs}\n■ 배송지: ${s.address}\n■ 수령인: ${s.recipient} / ${s.phone}\n■ 도착 희망일: ${s.requested_date}\n■ 사용 기간: ${l.start_date} ~ ${l.due_date}\n■ 메모: ${s.memo || "없음"}\n\n출고 일정과 운송장 번호를 회신 부탁드립니다.\n감사합니다.`;
}
function mail(no, dir) {
  const text = mailText(no, dir);
  modal(`<h2>${dir === "pickup" ? "회수" : "배송"} 요청 메일</h2><p class="meta">복사해서 물류사에 메일로 보내 주세요. 보낸 뒤 상태를 ‘요청 완료’로 바꿔 주세요.</p>
    <pre class="mail" id="mText">${esc(text)}</pre>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="mCopy">문안 복사</button></div>`, m => {
    $("#mCopy", m).addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); toast("메일 문안을 복사했어요."); }
      catch { const r = document.createRange(); r.selectNodeContents($("#mText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("문안을 선택했어요. 복사해 주세요."); }
    });
  });
}
function shipEdit(sid) {
  const s = shipments.find(x => x.id === sid); if (!s) return;
  const opts = s.direction === "pickup" ? PICK_STATUS : OUT_STATUS;
  modal(`<h2>${s.direction === "pickup" ? "회수" : "출고 배송"} 상태</h2><p class="meta"><span class="mono">${esc(s.loan_no)}</span></p>
    <div class="fields">
      <label class="f"><span>상태</span><select id="hSt">${Object.entries(opts).map(([k, [t]]) => `<option value="${k}" ${s.status === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="f"><span>물류사</span><input id="hCar" value="${esc(s.carrier)}"></label>
      <label class="f wide"><span>운송장 번호</span><input id="hTr" value="${esc(s.tracking_no)}"></label>
    </div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="hOk">저장</button></div>`, m => {
    const b = $("#hOk", m);
    b.addEventListener("click", () => busy(b, async () => {
      await must(sb.from("shipments").update({ status: $("#hSt").value, carrier: $("#hCar").value.trim(), tracking_no: $("#hTr").value.trim() }).eq("id", sid));
      closeModal(); toast("배송 상태를 저장했어요."); await refresh();
    }));
  });
}

function exportCsv() {
  const head = ["신청번호","자산번호","제품명","보관 위치","신청자","내부 요청자","외부 요청자","목적","고객사","시작일","반납 예정일","배송","상태","연체일","출고","반납","반납 방법","자가점검","자가점검 메모","점검 결과","점검 메모","연장 횟수"];
  const t = todayStr();
  const rows = [...loans].sort((a, b) => a.loan_no.localeCompare(b.loan_no)).map(l => { const e = eqById(l.equipment_id) || {}; return [l.loan_no, e.asset_no, e.name, e.location, nameOf(l.requester_id), l.internal_requester, l.external_requester, l.purpose, l.customer, l.start_date, l.due_date,
    l.delivery ? "Y" : "N", LOAN_STATUS[l.status]?.[0] || l.status, isOverdue(l) ? daysBetween(l.due_date, t) : "", fmtT(l.checkout_at), fmtT(l.returned_at), RETURN_METHODS[l.return_method] || "", CONDS[l.return_self_check] || "", l.return_self_note || "", CONDS[l.return_condition] || "", l.return_note || "", l.extension_count || 0]; });
  const csv = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `데모장비_출납대장_${t}.csv`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const l = loans.find(x => x.id === a.dataset.id);
  const eqName = l ? `${esc(eqById(l.equipment_id)?.name)} (${esc(eqById(l.equipment_id)?.asset_no)})` : "";
  switch (a.dataset.act) {
    case "refresh": busy(a, () => refresh()); break;
    case "changelog": showChangelog(); break;
    case "calPrev": case "calNext": { const [y, m] = cal.ym.split("-").map(Number); const d = new Date(y, m - 1 + (a.dataset.act === "calNext" ? 1 : -1), 1); cal.ym = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); break; }
    case "calToday": cal.ym = todayStr().slice(0, 7); render(); break;
    case "calMode": cal.mode = a.dataset.v; render(); break;
    case "calLoan": calLoan(a.dataset.id); break;
    case "calDay": calDay(a.dataset.d); break;
    case "eqNew": eqForm(); break;
    case "eqView": eqView(a.dataset.id); break;
    case "checkout": l && confirmBox("출고 처리", `${eqName}를 ${esc(nameOf(l.requester_id))}에게 출고해요. 구성품을 확인했는지 봐 주세요.<br><br>${esc(eqById(l.equipment_id)?.components || "")}`, "출고",
      async () => { await must(sb.from("loans").update({ status: "out" }).eq("id", l.id)); toast("출고 처리했어요."); }); break;
    case "return": l && returnForm(l); break;
    case "inspect": l && inspect(l); break;
    case "extend": l && extend(l); break;
    case "cancel": l && confirmBox("신청 취소", `${esc(l.loan_no)} · ${eqName} 예약을 취소해요.`, "예약 취소",
      async () => { await must(sb.from("loans").update({ status: "cancelled" }).eq("id", l.id)); toast("예약을 취소했어요."); }, true); break;
    case "mail": mail(a.dataset.no, a.dataset.dir); break;
    case "shipEdit": shipEdit(a.dataset.sid); break;
    case "csv": exportCsv(); break;
    case "uStatus": case "uRole": {
      const p = people.find(x => x.id === a.dataset.uid); if (!p) break;
      const field = a.dataset.act === "uStatus" ? "status" : "role", v = a.dataset.v;
      const label = field === "status" ? { active: "승인", disabled: "사용 중지" }[v] : (v === "admin" ? "관리자로 지정" : "관리자 해제");
      confirmBox(label, `${esc(p.display_name || "(이름 없음)")}님을 ${esc(label)}해요.`, label,
        async () => { await must(sb.from("profiles").update({ [field]: v }).eq("id", p.id)); toast(`${label}했어요.`); }, v === "disabled");
      break;
    }
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "eqQ" || id === "lgQ") {
    const pos = e.target.selectionStart;
    filters[id === "eqQ" ? "eqQ" : "ledgerQ"] = e.target.value; render();
    const n = $("#" + id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
  }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "eqCat") { filters.eqCat = e.target.value; render(); }
  else if (id === "eqLoc") { filters.eqLoc = e.target.value; render(); }
  else if (id === "calLoc") { cal.loc = e.target.value; render(); }
  else if (id === "calMine") { cal.mine = e.target.checked; render(); }
  else if (id === "lgSt") { filters.ledgerSt = e.target.value; render(); }
  else if (id === "rStart" || id === "rDue") {
    draft[id === "rStart" ? "start" : "due"] = e.target.value;
    if (id === "rStart" && draft.due < draft.start) draft.due = draft.start;
    const keep = collectReqFields(); render(); restoreReqFields(keep);
  }
  else if (e.target.dataset.pick) { e.target.checked ? draft.picks.add(e.target.dataset.pick) : draft.picks.delete(e.target.dataset.pick); const c = $("#pickCount"); if (c) c.textContent = `선택 ${draft.picks.size}대`; }
  else if (id === "rDelivery") { $("#shipBox").hidden = !e.target.checked; }
});
document.addEventListener("submit", e => { if (e.target.id === "reqForm") { e.preventDefault(); submitRequest(); } });
const REQ_IDS = ["rPurpose","rCustomer","rInternal","rExternal","rNote","rDelivery","sName","sPhone","sAddr","sDate","sPick","sMemo"];
function collectReqFields() { const o = {}; for (const id of REQ_IDS) { const n = $("#" + id); if (n) o[id] = n.type === "checkbox" ? n.checked : n.value; } return o; }
function restoreReqFields(o) { for (const [id, v] of Object.entries(o)) { if (!o.rDelivery && (id === "sDate" || id === "sPick")) continue; const n = $("#" + id); if (!n) continue; if (n.type === "checkbox") n.checked = v; else n.value = v; } const d = $("#rDelivery"); if (d) $("#shipBox").hidden = !d.checked; }
function softRender() {
  if ($("#app").hidden || $("#modalRoot").innerHTML) { renderTabs(); return; }
  if (view === "request" && $("#reqForm")) { const keep = collectReqFields(); render(); restoreReqFields(keep); return; }
  const a = document.activeElement?.id; render();
  if (a === "eqQ" || a === "lgQ") { const n = $("#" + a); n && n.focus(); }
}

/* ---------- 시작 ---------- */
async function start() {
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get("error_description");
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (!session) {
    showGate("login", oauthErr ? `<div class="notice bad">로그인하지 못했어요: ${esc(oauthErr)}</div>` : "");
    return;
  }
  if (location.search) { try { history.replaceState(null, "", location.pathname + location.hash); } catch {} }
  me.id = session.user.id;
  try {
    const rows = await must(sb.from("profiles").select("*").eq("id", me.id));
    profile = rows[0] || null;
  } catch (e) { showGate("error", esc(errText(e))); return; }
  if (!profile || profile.status === "pending") { showGate("pending"); return; }
  if (profile.status === "disabled") { showGate("disabled"); return; }
  me.isAdmin = profile.role === "admin";
  $("#gate").hidden = true; $("#app").hidden = false;
  $("#meName").textContent = profile.display_name || "나";
  const r = $("#meRole"); r.textContent = me.isAdmin ? "장비 관리자" : "신청자"; r.classList.toggle("admin", me.isAdmin);
  renderTabs();
  try { await loadAll(); render(); } catch (e) { showGate("error", esc(errText(e))); return; }
  setInterval(() => { if (document.visibilityState === "visible") refresh(true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
}
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });
start();
})();
</script>
