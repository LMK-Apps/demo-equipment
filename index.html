<style>
/* Layout: 상단 바 + 탭, 아래는 탭별 작업 화면 */
:root{

}

  --ok:#6cc98a; --ok-soft:#1d3426; --warn:#f0a948; --warn-soft:#3a2c17; --bad:#f08a80; --bad-soft:#3d2120; --info:#8fb2f0; --info-soft:#1f2b40; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}

.flow{display:flex;flex-direction:column;flex:1;min-height:0}
.flow-top{display:flex;align-items:center;gap:10px;height:52px}

@media (prefers-reduced-motion:reduce){.flow section{animation:none}.flow-bar i{transition:none}}
.flow-k{margin:0;color:var(--accent);font-weight:700;font-size:15px}
.flow-q{margin:0;font-size:26px;line-height:1.35;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.flow-box{background:var(--sunk);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.flow-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:20px}

.flow .big,.flow button.btn.big{font:inherit;font-size:18px;font-weight:700;min-height:58px;border-radius:14px;cursor:pointer;width:100%}

.yn-n{border:0;background:var(--sunk);color:var(--fg)}

.flow-opts{display:flex;flex-direction:column;gap:10px}
.opt-sub{display:block;margin-top:4px;font-size:14px;font-weight:500;color:var(--muted)}
.opt-tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.opt{text-align:left;font:inherit;font-size:18px;font-weight:600;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px 18px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flow textarea{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);color:var(--fg);resize:vertical}
.flow-sum{display:flex;flex-direction:column}
.sum-row{display:flex;justify-content:space-between;gap:16px;text-align:left;font:inherit;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.sum-row span{color:var(--muted)}.sum-row b{text-align:right;white-space:pre-wrap;flex:none;max-width:55%}

.sum-res{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 4px;font-weight:600}
button.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button.btn:hover{background:var(--sunk)}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.pri:hover{filter:brightness(1.08)}

button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.sm{padding:4px 9px;font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.list2{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.list2>.empty{padding:24px}
.r2{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.r2:last-child{border-bottom:0}
.r2[data-act]{cursor:pointer}
.row.clickable{cursor:pointer;border-radius:6px}.row.clickable:hover{background:var(--sunk)}
.lv-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-8px}
.lv-sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.lv-sec h3{margin:0}.r2[data-act]:hover{background:var(--sunk)}
.r2.overdue{box-shadow:inset 3px 0 0 var(--bad)}
.r2-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r2-l1{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.r2-title{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.r2-l1 .meta{flex:none}
.r2-l2{display:flex;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-width:0}
.r2-l2>span:not(:last-child)::after{content:"·";margin:0 7px;opacity:.6}
.r2-l2 b{font-weight:600}
.r2-note{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ok{color:var(--ok)}.c-minor{color:var(--warn)}.c-broken,.c-missing{color:var(--bad)}
.r2-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pick{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:420px;overflow:auto}
.pick label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick label:first-child{border-top:0}
.pick label.off{cursor:not-allowed;opacity:.6}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pick .main{flex:1;min-width:0}
.notice{border-radius:var(--r);padding:10px 12px;font-size:13px;background:var(--info-soft);color:var(--info)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.ship-box{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:24px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal{position:relative}
.modal-x{position:absolute;top:10px;right:10px;font-size:18px}
.modal>.modal-x+h2{padding-right:40px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
pre.mail{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;background:var(--sunk);border-radius:6px;padding:12px;margin:0;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:380px;width:100%;padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-align:center}
.gate .card h1{font-size:20px;margin:0}

button.kakao{font:inherit;font-weight:600;font-size:15px;background:var(--kakao);color:var(--kakao-ink);border:0;border-radius:8px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

.boot{padding:40px 0;color:var(--muted)}
.ver{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.gate .ver{margin-top:4px}
button.ver{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.log h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.log ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

.calnav{display:flex;align-items:center;gap:8px}
.calnav b{font-size:16px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dow{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:6px 0;background:var(--sunk);border-bottom:1px solid var(--line)}

.cal .sun .dn b{color:var(--bad)} .cal .day.today.sun .dn b{color:var(--accent-ink)}
.chip{font-size:11px;line-height:17px;padding:0 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;font-family:inherit;width:100%}
.chip.cont{opacity:.55}
.c-reserved{background:var(--accent-soft);color:var(--accent)} .c-out{background:var(--info-soft);color:var(--info)}

.more{font-size:11px;color:var(--muted);padding-left:4px}
.cnt{display:none;font-size:11px;font-weight:600;color:var(--accent);font-family:var(--mono)}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---------- 일정 (달력) ---------- */
const DOW = ["일","월","화","수","목","금","토"];
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const loanEnd = l => isOverdue(l) ? (todayStr() > l.due_date ? todayStr() : l.due_date) : l.due_date;
const calClass = l => isOverdue(l) ? "c-overdue" : ({ reserved: "c-reserved", out: "c-out", checking: "c-checking", done: "c-done" })[l.status] || "c-done";
function calLoans() {
  return loans.filter(l => l.status !== "cancelled"
    && (!cal.mine || l.requester_id === me.id)
    && (!cal.loc || locGroup(eqById(l.equipment_id)?.location) === cal.loc))
    .sort((a, b) => a.start_date.localeCompare(b.start_date) || a.loan_no.localeCompare(b.loan_no) || (eqById(a.equipment_id)?.asset_no || "").localeCompare(eqById(b.equipment_id)?.asset_no || ""));
}
const onDay = (list, d) => list.filter(l => l.start_date <= d && d <= loanEnd(l));
const chipLabel = l => `${eqById(l.equipment_id)?.name || "?"} · ${nameOf(l.requester_id)}`;
function vCal() {
  const [y, m] = cal.ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const list = calLoans(), t = todayStr();
  const monthLoans = list.filter(l => l.start_date <= ds(last) && loanEnd(l) >= ds(first));
  const head = `
  <div class="head"><div class="grow"><h2>일정</h2><p class="sub">누가 어떤 장비를 언제 쓰는지 보여 줘요. 일정을 누르면 자세히 볼 수 있어요.</p></div>
    <button class="btn pri" data-go="request">출납 신청</button></div>
  <div class="toolbar">
    <div class="calnav"><button class="btn sm" data-act="calPrev" aria-label="이전 달">◀</button><b>${y}년 ${m}월</b><button class="btn sm" data-act="calNext" aria-label="다음 달">▶</button><button class="btn sm" data-act="calToday">이번 달</button></div>
    <span style="flex:1"></span>
    <div class="seg" role="group" aria-label="보기"><button data-act="calMode" data-v="month" aria-pressed="${cal.mode === "month"}">달력</button><button data-act="calMode" data-v="equip" aria-pressed="${cal.mode === "equip"}">장비별</button></div>
    <select id="calLoc"><option value="">전체 위치</option>${[...LOCS, "기타"].map(c => `<option ${cal.loc === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <label class="check"><input type="checkbox" id="calMine" ${cal.mine ? "checked" : ""}> 내 신청만</label>
  </div>
  <div class="legend"><span><i class="c-reserved"></i>예약</span><span><i class="c-out"></i>출고</span><span><i class="c-overdue"></i>연체</span><span><i class="c-checking"></i>반납 확인 중</span><span><i class="c-done"></i>반납 완료</span><span class="meta">· 이번 달 ${new Set(monthLoans.map(l => l.loan_no)).size}건, 장비 ${monthLoans.length}대</span></div>`;

  if (cal.mode === "equip") {
    const days = []; for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) days.push(new Date(d));
    const eqs = equipment.filter(e => e.status !== "retired" && (!cal.loc || locGroup(e.location) === cal.loc))
      .filter(e => !cal.mine || monthLoans.some(l => l.equipment_id === e.id))
      .sort((a, b) => a.category.localeCompare(b.category) || a.asset_no.localeCompare(b.asset_no));
    const rows = eqs.map(e => {
      const mine = monthLoans.filter(l => l.equipment_id === e.id);
      return `<tr><td class="eqc"><b>${esc(e.name)}</b><div class="meta mono">${esc(e.asset_no)} · ${esc(e.location)}</div></td>${days.map(d => {
        const key = ds(d), l = mine.find(x => x.start_date <= key && key <= loanEnd(x));
        const today = key === t ? "today " : "";
        if (!l) return `<td class="d ${d.getDay() % 6 === 0 ? "we " : ""}${today}"></td>`;
        const cls = today;
        const startCell = key === l.start_date || key === ds(first);
        return `<td class="d ${cls}${calClass(l)}" data-act="calLoan" data-id="${l.id}" title="${esc(chipLabel(l))} (${fmtD(l.start_date)}–${fmtD(l.due_date)})">${startCell ? esc((nameOf(l.requester_id) || "").slice(0, 2)) : ""}</td>`;
      }).join("")}</tr>`;
    }).join("");
    return head + (eqs.length ? `<div class="tbl-wrap tl"><table><thead><tr><th class="eqc">장비</th>${days.map(d => `<th class="d ${d.getDay() % 6 === 0 ? "we " : ""}${ds(d) === t ? "today" : ""}">${d.getDate()}<div class="meta">${DOW[d.getDay()]}</div></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="meta">막대 첫 칸에 신청자 이름 앞 두 글자가 보여요. 칸을 누르면 자세히 볼 수 있어요.</p>`
      : `<div class="panel"><div class="empty">조건에 맞는 장비가 없어요.</div></div>`);
  }

  const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let d = new Date(start); cells.length < 42 && (d <= last || cells.length % 7); d.setDate(d.getDate() + 1)) {
    const key = ds(d), items = onDay(monthLoans, key), inMonth = d.getMonth() === m - 1;
    const chips = items.slice(0, 3).map(l => {
      const cont = key !== l.start_date && d.getDay() !== 0;
      return `<button class="chip ${calClass(l)}${cont ? " cont" : ""}" data-act="calLoan" data-id="${l.id}" title="${esc(chipLabel(l))} (${fmtD(l.start_date)}–${fmtD(l.due_date)})">${cont ? "↳ " : ""}${esc(chipLabel(l))}</button>`;
    }).join("");
    cells.push(`<div class="day${inMonth ? "" : " out"}${key === t ? " today" : ""}${d.getDay() === 0 ? " sun" : ""}" data-act="calDay" data-d="${key}">
      <div class="dn"><b>${d.getDate()}</b><span class="cnt">${items.length || ""}</span></div>${chips}${items.length > 3 ? `<span class="more">+${items.length - 3}건 더</span>` : ""}</div>`);
  }
  return head + `<div class="cal">${DOW.map(w => `<div class="dow">${w}</div>`).join("")}${cells.join("")}</div>
    <p class="meta">↳ 표시는 앞에서 이어지는 일정이에요. 휴대폰에서는 날짜를 누르면 그날 일정이 보여요.</p>`;
}
function calDay(key) {

  modal(`<h2>${key.replace(/-/g, ".")} (${DOW[new Date(key + "T00:00:00").getDay()]}) 일정</h2>
    <div class="list">${items.map(l => `<div class="row"><div class="main"><b>${esc(eqById(l.equipment_id)?.name)}</b> <span class="mono">${esc(eqById(l.equipment_id)?.asset_no)}</span>
      <div class="meta">${esc(nameOf(l.requester_id))} · ${esc(l.customer || l.purpose)} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}</div></div>
      ${isOverdue(l) ? `<span class="pill p-bad">연체</span>` : pill(LOAN_STATUS, l.status)}<button class="btn sm" data-act="calLoan" data-id="${l.id}">자세히</button></div>`).join("") || `<div class="empty">이날은 일정이 없어요.</div>`}</div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button>${key >= todayStr() ? `<button class="btn pri" id="dReq">이날부터 신청</button>` : ""}</div>`, mm => {

  });
}
function loanView(id) {

  const mine = l.requester_id === me.id, adm = me.isAdmin;

/* ---------- 장비 이력 ---------- */
const STATUS_TXT = s => EQ_STATUS[s]?.[0] || s;
function histText(ev, loanAts) {
  const d = ev.detail || {}, dt = x => x ? fmtD(String(x).slice(0, 10)) : "–";
  if (ev.table_name === "equipment") {
    if (ev.action === "insert") return `장비 등록 · 보관 위치 ${esc(d.location || "–")}`;
    if (ev.action === "delete") return "장비 삭제";
    const parts = [];
    if (d.location) parts.push(`보관 위치 → <b>${esc(d.location)}</b>`);
    if (loanAts.has(ev.at)) return parts.join(" · ") || null;          // 출납 처리와 함께 바뀐 상태는 출납 줄에 이미 있음
    if (d.last_check && d.last_check_source === "admin") parts.push(`점검 기록: <b>${esc(CONDS[d.last_check])}</b>${d.last_check_note ? ` · ${esc(d.last_check_note)}` : ""}`);
    if (d.status) parts.push(`상태 → <b>${esc(STATUS_TXT(d.status))}</b>`);
    const other = Object.keys(d).filter(k => !["location", "status", "last_check", "last_check_note", "last_check_source", "last_check_by", "last_check_at"].includes(k));
    if (other.length) parts.push("장비 정보 수정");
    return parts.join(" · ") || null;
  }
  const no = ev.loan_no ? ` <span class="mono meta">${esc(ev.loan_no)}</span>` : "";
  if (ev.action === "insert") return `출납 신청 · ${dt(d.start_date)}–${dt(d.due_date)} · ${esc(d.purpose || "")}${d.customer ? ` · ${esc(d.customer)}` : ""}${no}`;
  if (d.status === "out") return `출고${no}`;
  if (d.status === "checking") return `반납 신청${d.return_method ? ` · ${esc(retLabel(d))}` : ""}${d.return_self_check ? ` · 자가점검 <b>${esc(CONDS[d.return_self_check])}</b>` : ""}${d.return_self_note ? ` (${esc(d.return_self_note)})` : ""}${no}`;
  if (d.status === "done") return `반납 확인 · <b>${esc(CONDS[d.return_condition] || "–")}</b>${d.return_note ? ` · ${esc(d.return_note)}` : ""}${d.repair_needed === true ? " · 수리 필요" : ""}${no}`;
  if (d.status === "cancelled") return `예약 취소${no}`;
  if (d.due_date) return `반납 예정일 연장 → ${dt(d.due_date)}${no}`;
  return null;
}
async function loadHistory(eqId, box) {
  const { data, error } = await sb.rpc("equipment_history", { p_equipment_id: eqId });
  if (!box.isConnected) return;
  if (error) { box.innerHTML = `<div class="ev"><span class="t"></span><span class="meta">${esc(/function|schema cache/i.test(error.message || "") ? "이력 기능 준비 중이에요. 관리자에게 DB 업데이트를 요청해 주세요." : errText(error))}</span></div>`; return; }
  const loanAts = new Set(data.filter(x => x.table_name === "loans").map(x => x.at));
  const rows = data.map(ev => ({ ev, txt: histText(ev, loanAts) })).filter(r => r.txt);
  box.innerHTML = rows.length ? rows.map(({ ev, txt }) => `<div class="ev"><span class="t">${fmtT(ev.at)}</span><span>${txt}<div class="meta">${esc(ev.actor_name)}</div></span></div>`).join("")
    : `<div class="ev"><span class="t"></span><span class="meta">기록된 이력이 없어요.</span></div>`;
}

/* ---------- 통계 ---------- */
let statP = "3m";
const kstDate = iso => { if (!iso) return null; const d = new Date(iso); return ds(d); };
function vStats() {
  const t = todayStr();
  const used = loans.filter(l => ["out", "checking", "done"].includes(l.status) && l.start_date <= t);
  const minStart = loans.reduce((m, l) => l.start_date < m ? l.start_date : m, t);
  const ps = { m: t.slice(0, 8) + "01", "3m": addDays(t, -89), y: t.slice(0, 5) + "01-01", all: minStart }[statP];
  const pDays = daysBetween(ps, t) + 1;
  const endOf = l => l.status === "out" ? t : (kstDate(l.returned_at) || l.due_date);
  const clip = l => { const a = l.start_date > ps ? l.start_date : ps, b0 = endOf(l), b = b0 < t ? b0 : t; return b >= a ? daysBetween(a, b) + 1 : 0; };
  const inP = used.filter(l => clip(l) > 0);
  const started = loans.filter(l => l.status !== "cancelled" && l.start_date >= ps && l.start_date <= t);
  const reqCount = new Set(started.map(l => l.loan_no)).size;
  const devDays = inP.reduce((n, l) => n + clip(l), 0);
  const finished = used.filter(l => l.status !== "out" && l.start_date >= ps);
  const avgLen = finished.length ? (finished.reduce((n, l) => n + daysBetween(l.start_date, endOf(l)) + 1, 0) / finished.length) : 0;
  const lateFin = finished.filter(l => endOf(l) > l.due_date).length, overdueNow = loans.filter(isOverdue).length;
  const lateRate = (finished.length + overdueNow) ? Math.round((lateFin + overdueNow) / (finished.length + overdueNow) * 100) : 0;

  const per = equipment.filter(e => e.status !== "retired").map(e => {
    const ls = inP.filter(l => l.equipment_id === e.id), days = ls.reduce((n, l) => n + clip(l), 0);
    const last = used.filter(l => l.equipment_id === e.id).reduce((m, l) => l.start_date > m ? l.start_date : m, "");
    return { e, n: ls.length, days, util: Math.round(days / pDays * 100), last };
  }).sort((a, b) => b.days - a.days || a.e.asset_no.localeCompare(b.e.asset_no));
  const idle = per.filter(r => r.n === 0).length, maxDays = Math.max(1, ...per.map(r => r.days));

  const groups = (keyFn) => { const m = new Map(); for (const l of started) { const k = keyFn(l); if (!k) continue; if (!m.has(k)) m.set(k, new Set()); m.get(k).add(l.loan_no); } return [...m].map(([k, v]) => [k, v.size]).sort((a, b) => b[1] - a[1]).slice(0, 8); };
  const rank = (title, rows, unit) => { const mx = Math.max(1, ...rows.map(r => r[1])); return `<div class="panel"><h3>${title}</h3>${rows.length ? `<div class="rank">${rows.map(([k, v]) => `<span class="nm" title="${esc(k)}">${esc(k)}</span><span class="bar" title="${esc(k)}: ${v}${unit}"><i style="width:${Math.round(v / mx * 100)}%"></i><span>${v}${unit}</span></span>`).join("")}</div>` : `<div class="empty">기간 안에 신청이 없어요.</div>`}</div>`; };

  return `
  <div class="head"><div class="grow"><h2>통계</h2><p class="sub">${ps.replace(/-/g, ".")} ~ ${t.replace(/-/g, ".")} (${pDays}일). 대여 일수는 실제 출고부터 반납까지, 진행 중이면 오늘까지 세요. 취소된 신청은 빼요.</p></div>
    <div class="seg" role="group" aria-label="기간">${[["m", "이번 달"], ["3m", "최근 3개월"], ["y", "올해"], ["all", "전체"]].map(([k, l]) => `<button data-act="statP" data-v="${k}" aria-pressed="${statP === k}">${l}</button>`).join("")}</div></div>
  <div class="stats">
    <div class="stat"><b>${reqCount}</b><span>신청 건수</span></div>
    <div class="stat"><b>${devDays}</b><span>대여 일수 (장비·일)</span></div>
    <div class="stat"><b>${avgLen ? avgLen.toFixed(1) : "–"}</b><span>평균 대여 기간 (일)</span></div>
    <div class="stat ${lateRate >= 20 ? "alert" : ""}"><b>${lateRate}%</b><span>연체 비율 (지금 연체 ${overdueNow}건 포함)</span></div>
    <div class="stat"><b>${idle}</b><span>기간 중 미사용 장비</span></div>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>장비</th><th>보관 위치</th><th>대여 횟수</th><th>대여 일수</th><th>가동률</th><th>마지막 사용</th></tr></thead>
    <tbody>${per.map(r => `<tr data-act="eqView" data-id="${r.e.id}" style="cursor:pointer">
      <td>${esc(r.e.name)}<div class="meta mono">${esc(r.e.asset_no)}</div></td>
      <td>${esc(r.e.location)}</td>
      <td class="mono">${r.n}</td>
      <td><span class="bar" title="${esc(r.e.name)}: ${r.days}일">${r.days ? `<i style="width:${Math.round(r.days / maxDays * 140)}px"></i>` : ""}<span>${r.days}일</span></span></td>
      <td class="mono">${r.n ? r.util + "%" : `<span class="pill">미사용</span>`}</td>
      <td class="mono">${r.last ? fmtD(r.last) : "–"}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">장비가 없어요.</td></tr>`}</tbody>
  </table></div>
  <div class="grid2">
    ${rank("목적별 신청", groups(l => l.purpose), "건")}
    ${rank("고객사·기관별 신청 (상위 8)", groups(l => l.customer.trim()), "건")}
    ${rank("신청자별 신청 (상위 8)", groups(l => nameOf(l.requester_id)), "건")}
  </div>
  <p class="meta">가동률 = 대여 일수 ÷ 기간 일수. 장비를 누르면 상세와 이력을 볼 수 있어요.</p>`;
}

function conflictsFor(eqId, start, due, ignoreId) {
  return loans.filter(l => l.equipment_id === eqId && l.id !== ignoreId && ACTIVE(l.status) && l.start_date <= due && start <= l.due_date);
}

}

function applyPickFilter() {
  const list = $("#pickList"); if (!list) return;
  const q = pickF.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, total = 0;
  list.querySelectorAll("label[data-hay]").forEach(l => {
    total++;
    const picked = l.querySelector("input").checked;
    const ok = picked || ((!q.length || q.every(w => l.dataset.hay.includes(w)))
      && (!pickF.cat || l.dataset.cat === pickF.cat)
      && (!pickF.loc || l.dataset.loc === pickF.loc)
      && (!pickF.avail || l.dataset.ok === "1"));
    l.hidden = !ok; if (ok) shown++;
  });
  $("#pickNone").hidden = shown > 0;
  updatePickCount(shown, total);
}
function updatePickCount(shown, total) {
  const c = $("#pickCount"); if (!c) return;
  if (shown === undefined) { const ls = [...document.querySelectorAll("#pickList label[data-hay]")]; total = ls.length; shown = ls.filter(l => !l.hidden).length; }
  const names = [...draft.picks].map(id => eqById(id)).filter(Boolean).map(e => `${e.name} (${e.asset_no})`);
  c.innerHTML = `<b>선택 ${draft.picks.size}대</b>${names.length ? ` · ${esc(names.join(", "))}` : ""}<br><span>전체 ${total}대 중 ${shown}대 표시</span>`;
}

function vMine() {
  const mine = loans.filter(l => l.requester_id === me.id).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  const open = mine.filter(l => l.status !== "done" && l.status !== "cancelled");
  const past = mine.filter(l => !open.includes(l)).slice(0, 30);
  const actions = l => {
    if (l.status === "reserved") return `<button class="btn sm" data-act="extend" data-id="${l.id}">연장</button><button class="btn sm danger" data-act="cancel" data-id="${l.id}">취소</button>`;
    if (l.status === "out") return `<button class="btn sm" data-act="extend" data-id="${l.id}">연장</button><button class="btn sm pri" data-act="return" data-id="${l.id}">반납 신청</button>`;
    return "";
  };
  const line = l => { const e = eqById(l.equipment_id) || {}, ri = reqInfo(l); return `<div class="row clickable" data-act="loanView" data-id="${l.id}"><div class="main"><b>${esc(e.name)}</b> <span class="mono">${esc(e.asset_no)}</span>
      <div class="meta"><span class="mono">${esc(l.loan_no)}</span> · ${esc(l.customer || l.purpose)}${ri ? ` · ${esc(ri)}` : ""} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}${l.delivery ? " · 배송" : ""}</div></div>
      ${isOverdue(l) ? `<span class="pill p-bad">연체 ${daysBetween(l.due_date, todayStr())}일</span>` : pill(LOAN_STATUS, l.status)} ${actions(l)}</div>`; };
  return `
  <div class="head"><div class="grow"><h2>내 신청</h2><p class="sub">반납을 누르면 반납 방법과 장비 상태를 적는 반납 신청서가 열려요. 장비 관리자가 점검하면 반납이 완료돼요.</p></div></div>
  <div class="panel"><h3>진행 중 ${open.length}건</h3><div class="list">${open.map(line).join("") || `<div class="empty">진행 중인 신청이 없어요. ‘출납 신청’에서 장비를 빌려 보세요.</div>`}</div></div>
  <div class="panel"><h3>지난 신청</h3><div class="list">${past.map(line).join("") || `<div class="empty">지난 신청이 없어요.</div>`}</div></div>`;
}

function groupBy(arr, k) { const m = new Map(); for (const x of arr) { if (!m.has(x[k])) m.set(x[k], []); m.get(x[k]).push(x); } return [...m.values()]; }

function vShip() {
  const groups = groupBy(loans.filter(l => l.status !== "cancelled" && (l.delivery || shipOf(l.loan_no, "pickup"))), "loan_no").sort((a, b) => a[0].start_date.localeCompare(b[0].start_date));
  const openG = groups.filter(g => { const o = shipOf(g[0].loan_no, "outbound"), p = shipOf(g[0].loan_no, "pickup"); return (o && o.status !== "delivered") || (p && !["done", "cancelled"].includes(p.status)); });
  const card = g => {
    const l = g[0], o = shipOf(l.loan_no, "outbound") || {}, p = shipOf(l.loan_no, "pickup"), c = o.id ? o : (p || {});
    return `<div class="panel">
      <div class="head"><div class="grow"><h3><span class="mono">${esc(l.loan_no)}</span> · ${esc(l.customer || l.purpose)}</h3>
        <div class="meta">${g.map(x => `${esc(eqById(x.equipment_id)?.name)} (${esc(eqById(x.equipment_id)?.asset_no)})`).join(", ")}</div></div>
        ${[...new Set(g.map(x => x.status))].map(k => pill(LOAN_STATUS, k)).join(" ")}</div>
      <div class="meta">${o.id ? "수령" : "회수 담당"} ${esc(c.recipient)} · ${esc(c.phone)} · ${esc(c.address)}</div>
      ${o.id ? `<div class="row"><div class="main"><b>출고 배송</b><div class="meta">도착 희망 ${fmtD(o.requested_date)}${o.carrier ? ` · ${esc(o.carrier)}` : ""}${o.tracking_no ? ` · 운송장 <span class="mono">${esc(o.tracking_no)}</span>` : ""}</div></div>
        ${pill(OUT_STATUS, o.status)}
        <button class="btn sm" data-act="mail" data-no="${esc(l.loan_no)}" data-dir="outbound">요청 메일</button>
        ${me.isAdmin ? `<button class="btn sm" data-act="shipEdit" data-sid="${o.id}">상태·운송장</button>` : ""}</div>` : ""}
      ${p ? `<div class="row"><div class="main"><b>회수</b><div class="meta">회수 희망 ${fmtD(p.requested_date)}${p.tracking_no ? ` · 운송장 <span class="mono">${esc(p.tracking_no)}</span>` : ""}</div></div>
        ${pill(PICK_STATUS, p.status)}
        <button class="btn sm" data-act="mail" data-no="${esc(l.loan_no)}" data-dir="pickup">회수 메일</button>
        ${me.isAdmin ? `<button class="btn sm" data-act="shipEdit" data-sid="${p.id}">상태·운송장</button>` : ""}</div>` : ""}
    </div>`;
  };
  return `
  <div class="head"><div class="grow"><h2>배송 요청</h2><p class="sub">‘요청 메일’로 물류사에 보낼 문안을 복사하고, 보낸 뒤 상태를 ‘요청 완료’로 바꿔 주세요. 회수 요청은 반납 신청에서 ‘물류사 회수 요청’을 고르면 ‘요청 전’으로 바뀌어요.</p></div></div>
  ${openG.length ? openG.map(card).join("") : `<div class="panel"><div class="empty">처리할 배송 요청이 없어요. 출납 신청에서 ‘배송 필요’를 체크하면 여기에 나타나요.</div></div>`}`;
}

function vLedger() {
  const q = filters.ledgerQ.trim().toLowerCase(), st = filters.ledgerSt;
  const list = loans.filter(l => {
    if (st === "open" && !(ACTIVE(l.status) || l.status === "checking")) return false;
    if (st === "overdue" && !isOverdue(l)) return false;
    if (st === "done" && l.status !== "done") return false;
    if (st === "cancelled" && l.status !== "cancelled") return false;
    const e = eqById(l.equipment_id) || {};
    return !q || `${l.loan_no} ${e.asset_no} ${e.name} ${l.customer} ${nameOf(l.requester_id)} ${reqInfo(l)}`.toLowerCase().includes(q);
  }).sort((a, b) => b.start_date.localeCompare(a.start_date) || a.loan_no.localeCompare(b.loan_no));
  const act = l => {
    if (!me.isAdmin) return "";
    if (l.status === "reserved") return `<button class="btn sm pri" data-act="checkout" data-id="${l.id}">출고</button>`;
    if (l.status === "out") return `<button class="btn sm" data-act="return" data-id="${l.id}">반납 신청</button>`;
    if (l.status === "checking") return `<button class="btn sm pri" data-act="inspect" data-id="${l.id}">반납 확인</button>`;
    return "";
  };
  return `
  <div class="head"><div class="grow"><h2>출납 대장</h2><p class="sub">장비 1대가 한 항목이에요. 함께 신청한 장비는 같은 신청번호를 써요.${me.isAdmin ? "" : " 출고·점검은 장비 관리자만 할 수 있어요."}</p></div>
    <button class="btn" data-act="csv">CSV 내보내기</button></div>
  <div class="toolbar">
    <input id="lgQ" type="search" placeholder="신청번호·장비·고객사·신청자 검색" value="${esc(filters.ledgerQ)}" style="flex:1;min-width:200px">
    <select id="lgSt">${[["open","진행 중"],["overdue","연체"],["done","반납 완료"],["cancelled","취소"],["all","전체"]].map(([k, t]) => `<option value="${k}" ${st === k ? "selected" : ""}>${t}</option>`).join("")}</select>
  </div>
  <div class="list2">${list.map(l => { const e = eqById(l.equipment_id) || {}, ri = reqInfo(l), o = shipOf(l.loan_no, "outbound");
      const ret = l.return_method ? `${esc(l.return_method === "pickup" ? retLabel(l) : placeOf(l))}${l.returned_at ? ` ${fmtT(l.returned_at)}` : ""} · 자가점검 ${condText(l.return_self_check)}${l.return_condition ? ` → 확인 ${condText(l.return_condition)}` : ""}` : "";
      const note = [l.return_self_note, l.return_note].filter(Boolean).join(" / ");
      return `<div class="r2 ${isOverdue(l) ? "overdue" : ""}" data-act="loanView" data-id="${l.id}">
        <div class="r2-main">
          <div class="r2-l1"><b class="r2-title">${esc(e.name)}</b><span class="mono meta">${esc(e.asset_no)}</span></div>
          <div class="r2-l2"><span class="mono">${esc(l.loan_no)}</span><span>${esc(nameOf(l.requester_id))}${ri ? ` (${esc(ri)})` : ""}</span><span>${esc(l.purpose)}${l.customer ? ` · ${esc(l.customer)}` : ""}</span><span class="mono">${fmtD(l.start_date)}–${fmtD(l.due_date)}${l.extension_count ? ` 연장 ${l.extension_count}회` : ""}</span>${l.delivery && o ? `<span>배송 ${esc((OUT_STATUS[o.status] || [o.status])[0])}</span>` : ""}${l.checkout_at ? `<span>출고 <span class="mono">${fmtT(l.checkout_at)}</span></span>` : ""}${ret ? `<span>반납 ${ret}</span>` : ""}${note ? `<span class="r2-note" title="${esc(note)}">메모 ${esc(note)}</span>` : ""}</div>
        </div>
        <div class="r2-side">${isOverdue(l) ? `<span class="pill p-bad">연체 ${daysBetween(l.due_date, todayStr())}일</span>` : pill(LOAN_STATUS, l.status)}${act(l)}</div></div>`; }).join("") || `<div class="empty">조건에 맞는 기록이 없어요.</div>`}
  </div>`;
}

function nameForm(p, approve) {
  modal(`<h2>${approve ? "사용자 승인" : "표시 이름 수정"}</h2>
    <p class="meta">카카오 이름: <b>${esc(p.kakao_name || "–")}</b> · 지금 표시 이름: <b>${esc(p.display_name || "(이름 없음)")}</b><br>실명이나 이니셜처럼 팀원이 알아볼 수 있는 이름으로 정해 주세요. 카카오 이름은 바뀌지 않고 사용자 탭에 함께 남아요.</p>
    <label class="f req"><span>표시 이름</span><input id="nName" maxlength="20" value="${esc(p.display_name || "")}" placeholder="예: 송태진, TJS"></label>
    <div class="meta">1~20자. 출납 대장, 일정, 신청 화면에 이 이름이 보여요.</div>
    <div class="notice bad" id="nErr" hidden></div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="nOk">${approve ? "이 이름으로 승인" : "저장"}</button></div>`, m => {
    const inp = $("#nName", m); inp.select();
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") $("#nOk", m).click(); });
    const b = $("#nOk", m);
    inp.addEventListener("input", () => { delete b.dataset.ok; $("#nErr", m).hidden = true; });
    b.addEventListener("click", () => {
      const name = inp.value.trim().replace(/\s+/g, " "), err = $("#nErr", m);
      if (!name) { err.textContent = "표시 이름을 입력해 주세요."; err.hidden = false; return; }
      if (name.length > 20) { err.textContent = "표시 이름은 20자까지 쓸 수 있어요."; err.hidden = false; return; }
      const dup = people.find(x => x.id !== p.id && (x.display_name || "").trim() === name);
      if (dup && !b.dataset.ok) { err.textContent = `같은 이름(${name})을 쓰는 사용자가 있어요. 그래도 저장하려면 한 번 더 눌러 주세요.`; err.hidden = false; b.dataset.ok = "1"; return; }
      const d = approve ? { display_name: name, status: "active" } : { display_name: name };
      busy(b, async () => {
        await must(sb.from("profiles").update(d).eq("id", p.id));
        if (p.id === me.id) { profile.display_name = name; $("#meName").textContent = name; }
        closeModal(); toast(approve ? `${name}님을 승인했어요.` : "표시 이름을 바꿨어요."); await refresh();
      });
    });
  });
}

function vUsers() {
  const order = { pending: 0, active: 1, disabled: 2 };
  const list = [...people].sort((a, b) => order[a.status] - order[b.status] || (a.display_name || "").localeCompare(b.display_name || ""));
  const admins = people.filter(p => p.role === "admin" && p.status === "active").length;
  return `
  <div class="head"><div class="grow"><h2>사용자</h2><p class="sub">카카오로 처음 로그인하면 ‘승인 대기’로 올라와요. 사내 메신저로 본인인지 확인한 뒤 승인해 주세요. 승인할 때 실명이나 이니셜로 표시 이름을 정할 수 있어요. 본인 계정의 권한은 바꿀 수 없어요.</p></div></div>
  ${admins < 2 ? `<div class="notice">장비 관리자가 ${admins}명이에요. 관리자를 2명 이상 두면 한 사람이 자리를 비워도 승인과 점검을 할 수 있어요.</div>` : ""}
  <div class="tbl-wrap"><table>
    <thead><tr><th>표시 이름</th><th>카카오 이름</th><th>상태</th><th>역할</th><th>가입일</th><th></th></tr></thead>
    <tbody>${list.map(p => { const self = p.id === me.id; return `<tr>
      <td>${esc(p.display_name || "(이름 없음)")}${self ? ` <span class="meta">(나)</span>` : ""}</td>
      <td class="meta">${esc(p.kakao_name || "–")}</td>
      <td>${pill(USER_STATUS, p.status)}</td>
      <td>${p.role === "admin" ? `<span class="pill p-acc">장비 관리자</span>` : `<span class="pill">신청자</span>`}</td>
      <td class="mono">${(p.created_at || "").slice(0, 10)}</td>
      <td>${[`<button class="btn sm" data-act="uName" data-uid="${p.id}">이름 수정</button>`].concat(self ? [] : [
        p.status === "pending" ? `<button class="btn sm pri" data-act="uApprove" data-uid="${p.id}">승인</button>` : "",
        p.status === "disabled" ? `<button class="btn sm pri" data-act="uStatus" data-uid="${p.id}" data-v="active">다시 사용</button>` : "",
        p.status !== "disabled" ? `<button class="btn sm danger" data-act="uStatus" data-uid="${p.id}" data-v="disabled">${p.status === "pending" ? "거절" : "사용 중지"}</button>` : "",
        p.status === "active" ? `<button class="btn sm" data-act="uRole" data-uid="${p.id}" data-v="${p.role === "admin" ? "applicant" : "admin"}">${p.role === "admin" ? "관리자 해제" : "관리자로 지정"}</button>` : "",
      ]).join(" ")}</td></tr>`; }).join("")}</tbody>
  </table></div>`;
}

/* ---------- 모달 ---------- */
function modal(html, onMount) {
  const root = $("#modalRoot");
  const x = html.includes('class="flow"') ? "" : `<button class="icon-btn modal-x" data-close-btn aria-label="닫기">✕</button>`;
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${x}${html}</div></div>`;
  const ov = root.firstElementChild;
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close-btn]")) closeModal(); });
  onMount && onMount(ov.firstElementChild);
  const f = ov.querySelector("input:not([type=radio]),select,textarea,button:not(.modal-x)"); f && f.focus();
}
function showChangelog() {
  modal(`<h2>버전 기록</h2><p class="meta">지금 보고 있는 버전은 <b>${APP_VERSION}</b>이에요. 새로 올렸는데 번호가 그대로면 강력 새로 고침(PC: Ctrl+Shift+R)을 해 주세요.</p>
    <div class="log" style="display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow:auto">${CHANGELOG.map(c => `<div>

      <ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      ${c.db ? `<div class="meta" style="margin-top:4px">DB 변경: <span class="mono">${esc(c.db)}</span></div>` : ""}</div>`).join("")}</div>

function verdictHtml(cond) {
  const repair = cond === "broken" || cond === "missing";
  return `<div><h3>장비 판정</h3><div class="fields" style="margin-top:6px">
    <label class="check"><input type="radio" name="vd" value="ok" ${repair ? "" : "checked"}> 사용 가능</label>
    <label class="check"><input type="radio" name="vd" value="repair" ${repair ? "checked" : ""}> 수리 필요</label></div>
    <div class="meta">파손 또는 수리 필요·구성품 누락이면 ‘수리 필요’로 자동 선택돼요. 필요하면 바꿔 주세요.</div></div>`;
}
function bindVerdict(m, condName) {
  let touched = false;
  m.querySelectorAll('input[name="vd"]').forEach(r => r.addEventListener("change", () => touched = true));
  m.querySelectorAll(`input[name="${condName}"]`).forEach(r => r.addEventListener("change", () => {
    if (touched || !r.checked) return;
    const rep = r.value === "broken" || r.value === "missing";
    m.querySelector(`input[name="vd"][value="${rep ? "repair" : "ok"}"]`).checked = true;
  }));
}
function eqCheck(e) {
  const lent = e.status === "onloan" || e.status === "inspect";

      busy(b, async () => { await must(sb.from("equipment").update(d).eq("id", e.id)); closeModal(); toast("점검 결과를 기록했어요."); await refresh(); });

async function submitRequest() {
  const err = $("#reqErr"), show = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "nearest" }); };
  err.hidden = true;
  const start = $("#rStart").value, due = $("#rDue").value;
  if (!start || !due || due < start) return show("사용 기간을 확인해 주세요. 반납 예정일은 시작일과 같거나 그 뒤여야 해요.");
  if (start < todayStr()) return show("사용 시작일은 오늘이나 그 뒤로 정해 주세요.");
  if (start > maxStart()) return show(`사용 시작일은 오늘부터 1년 안으로 정해 주세요. 입력한 날짜: ${fullD(start)}`);
  if (due > addMonth1(start)) return show(`대여 기간은 최대 1달이에요. 반납 예정일을 ${fullD(addMonth1(start))}까지로 정해 주세요.`);
  const picks = [...draft.picks];
  if (!picks.length) return show("빌릴 장비를 1대 이상 골라 주세요.");
  let shipment = null;
  if ($("#rDelivery").checked) {
    shipment = { recipient: $("#sName").value.trim(), phone: $("#sPhone").value.trim(), address: $("#sAddr").value.trim(), date: $("#sDate").value, memo: $("#sMemo").value.trim() };
    if (!shipment.recipient || !shipment.phone || !shipment.address || !shipment.date) return show("배송이 필요하면 수령인, 연락처, 주소, 도착 희망일을 모두 입력해 주세요.");
    if ($("#sPick").value) shipment.pickup_date = $("#sPick").value;
  }
  const btn = $("#reqSubmit"); btn.disabled = true;
  try {
    const no = await must(sb.rpc("create_loan_request", {
      p_equipment_ids: picks, p_start: start, p_due: due, p_purpose: $("#rPurpose").value,
      p_customer: $("#rCustomer").value, p_internal: $("#rInternal").value, p_external: $("#rExternal").value,
      p_note: $("#rNote").value, p_shipment: shipment,
    }));
    draft = { start: todayStr(), due: addDays(todayStr(), 7), picks: new Set() };
    await refresh(true); go("mine");
    toast(`${no} 예약을 확정했어요.${shipment ? " 배송 탭에서 물류사 요청 메일을 보내 주세요." : ""}`);
  } catch (e) { btn.disabled = false; show(errText(e)); await refresh(true); }
}

    <section data-step="memo" hidden>

function exportCsv() {

  const t = todayStr();

    l.delivery ? "Y" : "N", LOAN_STATUS[l.status]?.[0] || l.status, isOverdue(l) ? daysBetween(l.due_date, t) : "", fmtT(l.checkout_at), fmtT(l.returned_at), retLabel(l), CONDS[l.return_self_check] || "", l.return_self_note || "", CONDS[l.return_condition] || "", l.return_note || "", l.extension_count || 0]; });
  const csv = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    showGate("login", oauthErr ? `<div class="notice bad">로그인하지 못했어요: ${esc(oauthErr)}</div>` : "");
    return;
  }
  if (location.search) { try { history.replaceState(null, "", location.pathname + location.hash); } catch {} }
  me.id = session.user.id;
  try {
    const rows = await must(sb.from("profiles").select("*").eq("id", me.id));
    profile = rows[0] || null;
  } catch (e) { showGate("error", esc(errText(e))); return; }
  if (!profile || profile.status === "pending") { showGate("pending"); return; }
  if (profile.status === "disabled") { showGate("disabled"); return; }
  me.isAdmin = profile.role === "admin";
  $("#gate").hidden = true; $("#app").hidden = false;
  $("#meName").textContent = profile.display_name || "나";
  const r = $("#meRole"); r.textContent = me.isAdmin ? "장비 관리자" : "신청자"; r.classList.toggle("admin", me.isAdmin);
  renderTabs();
  try { await loadAll(); render(); } catch (e) { showGate("error", esc(errText(e))); return; }
  setInterval(() => { if (document.visibilityState === "visible") refresh(true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
}
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });
start();
})();
</script>
</body>
</html>
