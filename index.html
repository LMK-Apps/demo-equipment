/* 언어: ?lang=en|ko 로 바꾸면 이 기기에 기억한다. 공개 전(I18N_PUBLIC=false)에는 고른 사람만 영어로 본다. */
window.I18N_PUBLIC = false;
window.LANG = (() => {
  let q = null, saved = null;
  try { q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "ko") localStorage.setItem("lang", q); saved = localStorage.getItem("lang"); } catch {}
  if (saved === "en" || saved === "ko") return saved;
  if (!window.I18N_PUBLIC) return "ko";
  return /^ko\b/i.test(navigator.language || "ko") ? "ko" : "en";
})();
if (window.LANG === "en") { document.documentElement.lang = "en"; document.write('<script src="i18n/en.js"><\/script>'); }
</script>

  { v: "v0.088", date: "2026-11-04", items: ["[출납 대장] 장비 줄: 상태 표시와 버튼(출고·반납 확인 등)을 위아래가 아니라 옆으로 나란히 두고 위아래 여백을 줄여 줄 높이를 낮춤"] },
  { v: "v0.087", date: "2026-11-04", items: ["[현황]·[출입고 확인] 신청 묶음 머리: 신청번호 대신 신청자와 고객사·기관을 크게 보여 줌. 신청번호는 아랫줄에 작게", "데모 신청·신청 정보 수정: 외부 요청자를 목록에서 고름(없음·성암메테크·남북의료기·써지칼코리아·기타). ‘기타’를 고르면 직접 입력 칸이 나옴"] },
  { v: "v0.086", date: "2026-11-04", items: ["데이터 사용량 줄이기: 1분마다 하는 자동 새로 고침은 장비·신청·배송 중 바뀐 것만 받아 옴(전에는 전체를 다시 받음). 15분마다, 그리고 [새로 고침]을 누르면 전체를 다시 받음", "로그인 기록(관리자)은 전체를 다시 받을 때만 불러옴"] },
  { v: "v0.085", date: "2026-11-04", items: ["메뉴 이름 변경: 배송 → 물류", "캘린더 장비별 막대: 신청자 이름 대신 머리표(예: [SH])와 고객사를 보여 줌. 머리표가 없으면 이름", "폰에서 메뉴 두 줄이 옆으로 밀지 않아도 한 화면에 다 들어오게 글자 크기와 간격을 줄임"] },
  { v: "v0.084", date: "2026-11-04", items: ["메뉴 이름 변경: 확인 → 출입고 확인, 일정 → 캘린더, 장비 → 자산. 현황의 버튼도 [출입고 확인 N건]", "캘린더 장비별 보기: 대여 기간을 칸마다 끊지 않고 막대 하나로 이어서 그림. 막대 안에 신청자 이름과 고객사를 보여 주고, 칸이 좁으면 말줄임. 날짜 칸을 조금 넓힘"] },
  { v: "v0.083", date: "2026-11-03", db: "024_checkout_note.sql", items: ["관리자 [확인] 탭 추가: 출고 대기(오늘·내일 시작)와 반납 확인 대기를 한 화면에서 처리. 탭에 처리할 건수 배지", "[현황] 맨 위에 [확인하기 N건] 버튼(장비 관리자, 처리할 건이 있을 때만)", "메뉴 정리: 윗줄은 현황 → 데모 신청 → 내 신청 → 일정 → 장비 → 배송 순. 관리자 줄은 할 일(확인) | 기록(출납 대장·통계) | 설정(사용자)으로 나눔", "출고 창에 ‘출고 메모(선택)’ 칸 추가. 묶음 출고도 같은 창. 메모는 신청 상세와 CSV(출고 메모 열)에 보임"] },
  { v: "v0.082", date: "2026-11-03", db: "023_overdue_guard.sql", items: ["연체 장비 처리: 같은 장비의 앞 신청이 아직 출고·반납 확인 중이면 뒤 예약을 출고할 수 없음(화면·DB 모두 막음). 홈 출고 예정에 ‘앞 건 반납 전’ 표시", "홈 연체 목록: 그 장비를 기다리는 뒤 예약과, 같은 모델의 대체 가능 장비 수를 함께 보여줌", "데모 신청: 연체 중인 장비는 고를 수 없음(DB도 막음). 막힌 이유와 반납 예정일을 글자로 표시"] },
  { v: "v0.081", date: "2026-11-03", items: ["데모 신청: 예약이 겹쳐 막힌 장비에 겹치는 예약 기간과 ‘같은 기간 길이로 언제부터 쓸 수 있는지’를 글자로 표시(예: 11/1–11/5 예약돼 있어요. 11/6부터 쓸 수 있어요.)", "장비 탭(관리자): ‘관리자 점검 없음’ 카드 추가. 관리자 점검이나 반납 확인 기록이 한 번도 없는 장비만 모아 봄(실사용). 위치 카드와 함께 쓸 수 있음", "장비 탭(관리자): ‘자산번호 없음’ 카드 추가. 자산번호가 비었거나 EQ 번호만 들어간 장비만 모아 봄"] },
  { v: "v0.080", date: "2026-11-03", items: ["일반 화면에서 내부 ID(EQ-0000)를 숨김: 현황·일정·장비 목록·데모 신청·내 신청·배송·출납 대장·반납·통계·상세 창. 라벨(예: SM3G, RA1)만 보이고, 라벨이 없으면 장비 이름만", "내부 ID가 그대로 보이는 곳: 장비 등록·수정 창, 장비 상세(관리자만), QR 라벨 인쇄, CSV, 물류사 요청 메일 문안. 검색은 EQ 번호로도 계속 됨"] },
  { v: "v0.079", date: "2026-11-03", db: "022_purpose_v2.sql", items: [
    "신청 목적 정리: 영업 데모 · 고객 교육·지원 · 학회·전시 · 장기 대여 · 내부 사용 · 기타. 목적을 고르면 아래에 정의가 한 줄로 보임",
    "목적이 ‘기타’면 ‘기타 내용’ 칸이 나타나고, 적어야 신청·수정할 수 있음. 상세와 출납 대장에 ‘기타 · 내용’으로 보임",

  { v: "v0.078", date: "2026-11-03", items: ["[일정] 분류 버튼 추가 (전체·시뮬레이터·BLS·MBL·Skill T.·기타). 고르면 그 분류 장비의 일정만 보임. 버튼 숫자는 이번 달 일정의 장비 수. 달력·장비별 보기 둘 다 적용"] },
  { v: "v0.077", date: "2026-11-03", items: ["[일정] 달력 칸을 늘려 한 주에 일정 막대를 7줄까지 보여 줌 (전에는 3줄). 넘칠 때만 ‘+N건 더’ 표시. 일정이 적은 주는 칸 높이가 그만큼만 늘어남"] },
  { v: "v0.076", date: "2026-11-03", items: ["[통계] 예약 건도 포함: 장비별 막대에서 사용(반납 완료·진행 중)은 진한 초록, 예약(예정)은 연한 초록으로 이어 붙여 표시. 대여 횟수·일수 옆에 ‘+ 예약 n’ 표시, 정렬은 사용+예약 합계 순", "요약에 ‘예약 일수 (예정)’ 추가. 신청 건수와 목적·고객사·신청자별 순위에 앞으로 시작할 예약도 포함하고, 순위 막대도 사용(진한 초록)·예약(연한 초록)으로 나눔", "예약만 있는 장비는 ‘예약만’으로 표시하고 미사용 장비 수에서 뺌. 마지막 사용 칸에 다음 예약일 표시. 가동률은 실제 사용 일수 기준 그대로"] },
  { v: "v0.075", date: "2026-11-03", db: "021_loan_info_edit.sql", items: ["장비 관리자: 출고·반납 확인 중·반납 완료인 신청도 상세의 [신청 정보 수정]으로 신청자·사용 기간·목적·고객사·내부/외부 요청자·메모를 고칠 수 있음. 같은 신청번호의 장비 전체에 적용되고, 바뀐 내용은 Teams로 알림", "출고된 신청은 사용 시작일을 오늘 뒤로 옮길 수 없음. 바꾼 기간이 다른 예약과 겹치면 저장되지 않음"] },
  { v: "v0.074", date: "2026-11-03", items: ["[현황] 출고 예정: 대여번호별로 묶음. 묶음 머리에 고객사·신청자·기간·배송 여부와 [출고 처리 N대], 아래에 장비 줄(분류 순서)을 들여써서 보여 줌. 장비별 [출고]도 그대로 있음", "장비 관리자: 같은 대여번호의 예약 장비를 한 번에 출고 처리 (확인 창에 장비와 구성품 목록)"] },
  { v: "v0.073", date: "2026-11-03", items: ["[장비]: QR 찍기·여러 대 선택·장비 등록 버튼을 분류 버튼 줄의 오른쪽으로 옮김", "분류 버튼(예: 기타)을 고른 상태에서 [장비 등록]을 누르면 그 분류가 미리 선택됨 (전체면 시뮬레이터)"] },
  { v: "v0.072", date: "2026-11-03", items: ["작성 창(장비 수정, 반납 신청, 예약 수정, 반납 확인 등 입력 칸이 있는 창)은 창 바깥을 눌러도 닫히지 않음. [닫기]나 ✕로만 닫힘. 바깥을 누르면 창이 살짝 흔들리고 안내가 한 번 뜸", "작성 중에 내용을 입력했으면 Esc로도 닫히지 않음", "보기 창(상세 등)도 창 안에서 끌어서 바깥에서 놓은 경우에는 닫히지 않음"] },
  { v: "v0.071", date: "2026-11-03", items: ["장비 순서 규칙을 하나로 통일: 분류 순서(시뮬레이터 → BLS → MBL → Skill T. → 기타), 같은 분류 안에서는 내부 ID 순. [내 신청]·[출납 대장]·신청 상세·반납 신청·반납 확인·[장비] 목록·[데모 신청]·일정(장비별)·물류사 메일·CSV에 모두 적용", "[내 신청]: 최근 신청이 위로, 같은 신청번호의 장비는 위 규칙대로 붙어서 보임"] },
  { v: "v0.070", date: "2026-11-03", items: ["[출납 대장] 상태 버튼 순서: [전체]를 맨 앞으로. 처음 열 때는 그대로 [대여 중]이 선택됨"] },
  { v: "v0.069", date: "2026-11-03", items: ["[출납 대장] 대여번호 줄을 토글로: 처음엔 번호 줄만 보이고, 누르면 장비 목록이 들여쓴 하위 줄로 펼쳐짐. 검색 중이거나 상세에서 ‘출납 대장에서 보기’로 오면 펼친 채로 보임"] },
  { v: "v0.068", date: "2026-11-03", items: ["[출납 대장] 대여번호(신청번호)별로 카드 하나로 묶음. 카드 머리에 신청자·목적·고객사·기간·출고 시각과 상태별 대수, 아래에 장비 줄", "상태 고르기를 드롭다운 대신 버튼으로: 대여 중(예전 ‘진행 중’) · 연체 · 반납 확인 중 · 반납 완료 · 취소 · 전체. 버튼마다 신청 건수 표시, 연체가 있으면 빨간 버튼", "반납 확인을 기다리는 장비가 2대 이상이면 카드 머리에 [반납 확인 N대] 버튼"] },
  { v: "v0.067", date: "2026-11-03", db: "020_return_date_edit.sql", items: ["장비 관리자: 신청 상세의 [반납] 칸에서 ‘실제 반납일’을 고칠 수 있음. 같은 신청번호의 반납 장비에 한 번에 적용 가능. 연체 반납 여부와 통계의 연체 비율은 실제 반납일로 셈", "반납 신청을 앱에 기록한 시각은 ‘앱에 기록한 시각’으로 따로 남고 바뀌지 않음 (실제 반납일과 다를 때만 보임)", "상세의 반납 칸: 실제 반납일이 반납 예정일보다 늦으면 ‘연체 N일’ 표시"] },
  { v: "v0.066", date: "2026-11-03", db: "019_equipment_model.sql", items: ["장비에 ‘모델 (묶음 이름)’ 칸 추가. 비워 두면 지금처럼 제품명으로 묶고, 값을 넣으면 제품명이 달라도 같은 모델로 묶음. [장비 수정]에서 기존 모델 이름을 골라 넣을 수 있음", "RA1~RA4를 ‘Resusci Anne QCPR’ 한 묶음으로. 묶음 안에서 제품명이 서로 다르면 펼친 줄마다 제품명도 같이 보여 줌 (Torso·AED 구분)", "검색에 모델 이름도 포함"] },

function errText(e) {

  if (e.code === "23P01") return "그 기간에 이미 다른 예약이 있어요. 기간을 바꿔 주세요.";

}

/* ---------- 데이터 ---------- */
// 자동 새로 고침은 바뀐 행(updated_at)만 받는다. 15분마다, 그리고 [새로 고침]을 누르면 전체를 다시 받는다
// (전체 받기 때 지워진 행이 정리됨). 늦게 커밋된 변경을 놓치지 않게 마지막 시각보다 2분 앞부터 다시 받는다.
const FULL_EVERY = 15 * 60 * 1000;
let fullAt = 0, syncAt = { equipment: "", loans: "", shipments: "" };
const maxUpd = (rows, prev = "") => rows.reduce((m, r) => (r.updated_at || "") > m ? r.updated_at : m, prev);
const since = ts => ts ? new Date(new Date(ts).getTime() - 120000).toISOString() : "1970-01-01T00:00:00Z";
const mergeRows = (cur, rows) => { if (!rows.length) return cur; const m = new Map(cur.map(r => [r.id, r])); rows.forEach(r => m.set(r.id, r)); return [...m.values()]; };
async function loadChanged() {
  const [e, l, s, p] = await Promise.all([
    must(sb.from("equipment").select("*").gte("updated_at", since(syncAt.equipment))),
    must(sb.from("loans").select("*").gte("updated_at", since(syncAt.loans))),
    must(sb.from("shipments").select("*").gte("updated_at", since(syncAt.shipments))),
    must(sb.from("profiles").select("id,display_name,kakao_name,role,status,created_at").order("created_at")),
  ]);
  equipment = mergeRows(equipment, e).sort((a, b) => (a.internal_id || "").localeCompare(b.internal_id || ""));
  loans = mergeRows(loans, l).sort((a, b) => b.start_date.localeCompare(a.start_date));
  shipments = mergeRows(shipments, s); people = p;
  syncAt = { equipment: maxUpd(e, syncAt.equipment), loans: maxUpd(l, syncAt.loans), shipments: maxUpd(s, syncAt.shipments) };
}
async function loadAll(full) {
  if (!full && fullAt && Date.now() - fullAt < FULL_EVERY) return loadChanged();
  const [e, l, s, p] = await Promise.all([
    must(sb.from("equipment").select("*").order("internal_id")),
    must(sb.from("loans").select("*").order("start_date", { ascending: false }).limit(3000)),
    must(sb.from("shipments").select("*")),
    must(sb.from("profiles").select("id,display_name,kakao_name,role,status,created_at").order("created_at")),
  ]);
  equipment = e; loans = l; shipments = s; people = p;
  syncAt = { equipment: maxUpd(e), loans: maxUpd(l), shipments: maxUpd(s) }; fullAt = Date.now();
  if (me.isAdmin) {   // 로그인 기록은 관리자만. 표가 없거나 실패해도 앱은 계속 쓴다
    try { const r = await sb.from("login_log").select("user_id,at,user_agent,kicked").order("at", { ascending: false }).limit(1000); logins = r.error ? [] : r.data || []; }
    catch { logins = []; }
  }
}

/* ---------- 기기 2대 제한 ---------- */
// 로그인 직후와 1분마다 확인한다. 다른 기기 때문에 끊긴 로그인이면 이 기기에서 로그아웃한다.
async function sessionGuard(first) {
  try {
    const { data, error } = await sb.rpc("session_check");
    if (error || !data) return false;
    if (data.status === "revoked") {
      try { sessionStorage.setItem("kicked", "1"); } catch {}
      await sb.auth.signOut({ scope: "local" }); location.reload(); return true;
    }
    if (first && data.status === "new" && data.kicked > 0) toast(`다른 기기의 로그인 ${data.kicked}개를 끊었어요. 한 계정은 동시에 2대까지 쓸 수 있어요.`);
  } catch {}
  return false;
}
// 브라우저가 알려 주는 정보로 기기·브라우저 이름을 짧게 만든다
function deviceOf(ua = "") {
  const os = /iPad/.test(ua) ? "iPad" : /iPhone/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows PC" : /Macintosh|Mac OS X/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "기타 기기";
  const br = /KAKAOTALK/i.test(ua) ? "카카오톡 앱" : /SamsungBrowser/.test(ua) ? "삼성 인터넷" : /Edg\//.test(ua) ? "Edge" : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "";
  return br ? `${os} · ${br}` : os;
}
// 관리자가 내 역할·상태를 바꾸면 1분 안에(또는 앱을 다시 볼 때) 새 권한으로 앱을 다시 연다
async function roleGuard() {
  try {
    const { data, error } = await sb.from("profiles").select("role,status,display_name").eq("id", me.id);
    if (error || !data) return false;
    const p = data[0];
    if (!p || p.status !== "active" || p.role !== profile.role) {
      try { sessionStorage.setItem("roleChanged", p?.status === "active" ? p.role : "-"); } catch {}
      location.reload(); return true;
    }
    if (p.display_name !== profile.display_name) { profile.display_name = p.display_name; $("#meName").textContent = p.display_name || "나"; }
  } catch {}
  return false;
}
async function refresh(quiet, full) {
  if (await sessionGuard(false)) return;
  if (await roleGuard()) return;
  try { await loadAll(full); softRender(); }
  catch (e) { if (!quiet) fail(e); }
  checkVersion();
}

/* ---------- 새 버전 안내 ---------- */
// 배포된 index.html의 첫 CHANGELOG 버전을 읽어 지금 화면보다 새것이면 위에 안내 띠를 띄운다.
// 5분에 한 번 이하로만 확인한다. [✕]로 닫으면 그 버전은 다시 묻지 않는다.
const verNum = v => Number(String(v).replace(/^v/, "")) || 0;
let verChecked = 0, verDismissed = "";
async function checkVersion(force) {
  if (!force && Date.now() - verChecked < 5 * 60 * 1000) return;
  verChecked = Date.now();
  try {
    const res = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const m = (await res.text()).match(/const CHANGELOG = \[\s*\{ v: "(v[\d.]+)"/);
    if (!m || verNum(m[1]) <= verNum(APP_VERSION) || m[1] === verDismissed) return;
    $("#updTxt").textContent = `새 버전(${m[1]})이 있어요.`;
    $("#upd").dataset.v = m[1]; $("#upd").hidden = false;
  } catch {}
}
$("#updGo").addEventListener("click", () => location.reload());
$("#updX").addEventListener("click", () => { verDismissed = $("#upd").dataset.v || ""; $("#upd").hidden = true; });

/* ---------- 일정 (달력) ---------- */
const DOW = ["일","월","화","수","목","금","토"];
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const loanEnd = l => isOverdue(l) ? (todayStr() > l.due_date ? todayStr() : l.due_date) : l.due_date;
const calClass = l => isOverdue(l) ? "c-overdue" : ({ reserved: "c-reserved", out: "c-out", checking: "c-checking", done: "c-done" })[l.status] || "c-done";
function calLoans(anyCat) {
  return loans.filter(l => l.status !== "cancelled"
    && (!cal.mine || l.requester_id === me.id)
    && (anyCat || !cal.cat || eqById(l.equipment_id)?.category === cal.cat)
    && (!cal.loc || locGroup(eqById(l.equipment_id)?.location) === cal.loc))
    .sort((a, b) => a.start_date.localeCompare(b.start_date) || a.loan_no.localeCompare(b.loan_no) || loanEqCmp(a, b));
}
const onDay = (list, d) => list.filter(l => l.start_date <= d && d <= loanEnd(l));
const chipLabel = l => `${eqById(l.equipment_id)?.name || "?"} · ${nameOf(l.requester_id)}`;
function vCal() {
  const [y, m] = cal.ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const list = calLoans(), t = todayStr();
  const inMonth = l => l.start_date <= ds(last) && loanEnd(l) >= ds(first);
  const monthLoans = list.filter(inMonth);
  // 분류 버튼 숫자: 이번 달 일정 중 그 분류 장비 수 (분류 고르기 전 기준)
  const allMonth = calLoans(true).filter(inMonth);
  const catN = v => v ? allMonth.filter(l => eqById(l.equipment_id)?.category === v).length : allMonth.length;
  const head = `
  <div class="head"><div class="grow"><h2>캘린더</h2><p class="sub">누가 어떤 장비를 언제 쓰는지 보여 줘요. 일정을 누르면 자세히 볼 수 있어요.</p></div>
    <button class="btn pri" data-go="request">데모 신청</button></div>
  <div class="toolbar">
    <div class="calnav"><button class="btn sm" data-act="calPrev" aria-label="이전 달">◀</button><b>${y}년 ${m}월</b><button class="btn sm" data-act="calNext" aria-label="다음 달">▶</button><button class="btn sm" data-act="calToday">이번 달</button></div>
    <span style="flex:1"></span>
    <div class="seg" role="group" aria-label="보기"><button data-act="calMode" data-v="month" aria-pressed="${cal.mode === "month"}">달력</button><button data-act="calMode" data-v="equip" aria-pressed="${cal.mode === "equip"}">장비별</button></div>
    <select id="calLoc"><option value="">전체 위치</option>${[...LOCS, "기타"].map(c => `<option ${cal.loc === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <label class="check"><input type="checkbox" id="calMine" ${cal.mine ? "checked" : ""}> 내 신청만</label>
  </div>
  ${catChips("cal", cal.cat, catN)}
  <div class="legend"><span><i class="c-reserved"></i>예약</span><span><i class="c-out"></i>출고</span><span><i class="c-overdue"></i>연체</span><span><i class="c-checking"></i>반납 확인 중</span><span><i class="c-done"></i>반납 완료</span><span class="meta">· 이번 달 ${new Set(monthLoans.map(l => l.loan_no)).size}건, 장비 ${monthLoans.length}대</span></div>`;

  if (cal.mode === "equip") {
    const days = []; for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) days.push(new Date(d));
    const eqs = equipment.filter(e => e.status !== "retired" && (!cal.loc || locGroup(e.location) === cal.loc) && (!cal.cat || e.category === cal.cat))
      .filter(e => !cal.mine || monthLoans.some(l => l.equipment_id === e.id))
      .sort(eqCmp);
    // 대여 기간은 칸을 합쳐(colspan) 막대 하나로 그린다. 막대 안에 신청자·고객사를 넣고, 좁으면 말줄임
    const shortName = id => { const n = nameOf(id) || ""; return n.match(/^\[[^\]]+\]/)?.[0] || n; };
    const rows = eqs.map(e => {
      const mine = monthLoans.filter(l => l.equipment_id === e.id);
      const cells = [];
      for (let i = 0; i < days.length;) {
        const d = days[i], key = ds(d), l = mine.find(x => x.start_date <= key && key <= loanEnd(x));
        if (!l) { cells.push(`<td class="d ${d.getDay() % 6 === 0 ? "we " : ""}${key === t ? "today" : ""}"></td>`); i++; continue; }
        let n = 1; while (i + n < days.length && mine.find(x => x.start_date <= ds(days[i + n]) && ds(days[i + n]) <= loanEnd(x)) === l) n++;
        const ti = days.slice(i, i + n).findIndex(x => ds(x) === t);
        const lab = [shortName(l.requester_id), l.customer || l.purpose].filter(Boolean).join(" · ");
        cells.push(`<td class="d tlbar ${calClass(l)}" colspan="${n}" data-act="calLoan" data-id="${l.id}" title="${esc(chipLabel(l))} (${fmtD(l.start_date)}–${fmtD(l.due_date)})">${ti >= 0 ? `<i class="tl-today" style="left:${ti * 100 / n}%;width:${100 / n}%"></i>` : ""}<span class="tl-lab${l.start_date < ds(first) ? " cut" : ""}">${esc(lab)}</span></td>`);
        i += n;
      }
      return `<tr><td class="eqc"><b>${esc(e.name)}</b><div class="meta mono">${esc([eqNo(e), e.location].filter(Boolean).join(" · "))}</div></td>${cells.join("")}</tr>`;
    }).join("");
    return head + (eqs.length ? `<div class="tbl-wrap tl"><table><thead><tr><th class="eqc">장비</th>${days.map(d => `<th class="d ${d.getDay() % 6 === 0 ? "we " : ""}${ds(d) === t ? "today" : ""}">${d.getDate()}<div class="meta">${DOW[d.getDay()]}</div></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="meta">막대 안에 신청자와 고객사가 보여요. 글자가 잘리면 막대를 눌러 자세히 봐 주세요.</p>`
      : `<div class="panel"><div class="empty">조건에 맞는 장비가 없어요.</div></div>`);
  }

  // 주(週) 줄마다 일정을 막대로 그린다. 여러 날 일정은 막대 하나로 이어진다.
  const LANES = 7, start = new Date(first);   // 한 주에 막대 7줄까지, 넘치면 +N건 더 start.setDate(1 - first.getDay());
  const order = new Map(monthLoans.map((l, i) => [l.id, i]));
  const weeks = [];
  for (let w = new Date(start); w <= last; w.setDate(w.getDate() + 7)) {
    const days = []; for (let i = 0; i < 7; i++) { const d = new Date(w); d.setDate(w.getDate() + i); days.push(d); }
    const k0 = ds(days[0]), k6 = ds(days[6]);
    // 이번 주에 걸친 일정을 구간(시작 칸, 칸 수)으로 자른다.
    const segs = monthLoans.filter(l => l.start_date <= k6 && loanEnd(l) >= k0).map(l => {
      const s = days.findIndex(d => ds(d) >= l.start_date), e = 6 - [...days].reverse().findIndex(d => ds(d) <= loanEnd(l));
      return { l, s, e, lcut: l.start_date < k0, rcut: loanEnd(l) > k6 };
    }).sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s) || order.get(a.l.id) - order.get(b.l.id));
    // 겹치지 않게 줄(lane)을 배정한다.
    const used = [];
    for (const g of segs) {
      let lane = 0;
      while ((used[lane] || []).some(o => o.s <= g.e && g.s <= o.e)) lane++;
      (used[lane] = used[lane] || []).push(g); g.lane = lane;
    }
    const cells = days.map((d, i) => {
      const key = ds(d), n = segs.filter(g => g.s <= i && i <= g.e).length, inMonth = d.getMonth() === m - 1;
      return `<div class="day${inMonth ? "" : " out"}${key === t ? " today" : ""}${d.getDay() === 0 ? " sun" : ""}" style="grid-column:${i + 1}" data-act="calDay" data-d="${key}">
        <div class="dn"><b>${d.getDate()}</b><span class="cnt">${n || ""}</span></div></div>`;
    }).join("");
    const bars = segs.filter(g => g.lane < LANES).map(g => {
      const l = g.l;
      return `<button class="chip ${calClass(l)}${g.lcut ? " l-cut" : ""}${g.rcut ? " r-cut" : ""}" style="grid-row:${g.lane + 2};grid-column:${g.s + 1} / span ${g.e - g.s + 1}" data-act="calLoan" data-id="${l.id}" title="${esc(chipLabel(l))} (${fmtD(l.start_date)}–${fmtD(l.due_date)})">${esc(chipLabel(l))}</button>`;
    }).join("");
    const more = days.map((d, i) => {
      const hid = segs.filter(g => g.lane >= LANES && g.s <= i && i <= g.e).length;
      return hid ? `<span class="more" style="grid-column:${i + 1}">+${hid}건 더</span>` : "";
    }).join("");
    weeks.push(`<div class="wk">${cells}${bars}${more}</div>`);
  }
  return head + `<div class="cal"><div class="cal-h">${DOW.map(w => `<div class="dow">${w}</div>`).join("")}</div>${weeks.join("")}</div>
    <p class="meta">여러 날 일정은 막대 하나로 이어져요. 끝이 잘린 막대는 이전·다음 주로 이어지는 일정이에요. 휴대폰에서는 날짜를 누르면 그날 일정이 보여요.</p>`;
}

      <div class="meta">${esc(nameOf(l.requester_id))} · ${esc(l.customer || l.purpose)} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}</div></div>
      ${isOverdue(l) ? `<span class="pill p-bad">연체</span>` : pill(LOAN_STATUS, l.status)}<button class="btn sm" data-act="calLoan" data-id="${l.id}">자세히</button></div>`).join("") || `<div class="empty">이날은 일정이 없어요.</div>`}</div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button>${key >= todayStr() ? `<button class="btn pri" id="dReq">이날부터 신청</button>` : ""}</div>`, mm => {
    $("#dReq", mm)?.addEventListener("click", () => { draft.start = key; if (!draft.dueSet || draft.due < key) draft.due = defaultDue(key); closeModal(); go("request"); });
  });
}
function loanView(id) {

let statP = "3m", statIdleOpen = false, statSort = { k: "days", dir: -1 };

const kstDate = iso => { if (!iso) return null; const d = new Date(iso); return ds(d); };
function vStats() {

  const avgLen = finished.length ? (finished.reduce((n, l) => n + daysBetween(l.start_date, endOf(l)) + 1, 0) / finished.length) : 0;
  const lateFin = finished.filter(l => endOf(l) > l.due_date).length, overdueNow = loans.filter(isOverdue).length;
  const lateRate = (finished.length + overdueNow) ? Math.round((lateFin + overdueNow) / (finished.length + overdueNow) * 100) : 0;

  }).sort((a, b) => (b.days + b.rdays) - (a.days + a.rdays) || b.days - a.days || eqCmp(a.e, b.e));

  const rank = (title, rows, unit) => { const mx = Math.max(1, ...rows.map(r => r[1])); return `<div class="panel"><h3>${title}</h3>${rows.length ? `<div class="rank">${rows.map(([k, v, r]) => `<span class="nm" title="${esc(k)}">${esc(k)}</span><span class="bar" title="${esc(k)}: ${v}${unit} (예약 ${r}${unit})"><span class="stk" style="width:${Math.round(v / mx * 100)}%">${v - r ? `<i style="flex:${v - r}"></i>` : ""}${r ? `<i class="rsv" style="flex:${r}"></i>` : ""}</span><span>${v}${unit}${r ? ` <span class="meta">(예약 ${r})</span>` : ""}</span></span>`).join("")}</div>` : `<div class="empty">기간 안에 신청이 없어요.</div>`}</div>`; };

// 같은 길이로 쓸 수 있는 가장 빠른 시작일 (겹치는 예약 뒤로 밀어 가며 찾음)
function nextFreeStart(eqId, start, due) {
  const len = daysBetween(start, due); let d = start;
  for (let i = 0; i < 50; i++) {
    const cs = conflictsFor(eqId, d, addDays(d, len));
    if (!cs.length) return d;
    d = addDays(cs.map(x => x.due_date).sort().pop(), 1);
  }
  return "";
}
function conflictsFor(eqId, start, due, ignoreId) {
  return loans.filter(l => l.equipment_id === eqId && l.id !== ignoreId && ACTIVE(l.status) && l.start_date <= due && start <= l.due_date
    && !(draft.edit && l.loan_no === draft.edit));
}

/* ---------- 예약 수정 ---------- */
// 같은 신청번호의 장비가 모두 '예약'(출고 전)일 때만 고칠 수 있다.

// 관리자는 지난 날짜(1년 전까지)를 시작일로 고를 수 있고, 대여 기간 1달 제한이 없다

const overMonth = (start, due) => !me.isAdmin && due > addMonth1(start);

    sDateSet: !!out?.requested_date && out.requested_date !== l.start_date, sPickSet: !!(pk && pk.status === "scheduled" && pk.requested_date !== l.due_date) };
  closeModal(); go("request");
  restoreReqFields({ rPurpose: l.purpose, rEtc: splitNote(l.note).etc, rCustomer: l.customer || "", rInternal: l.internal_requester || "", rExternal: l.external_requester || "", rNote: splitNote(l.note).memo,
    rDelivery: !!out, rShipLater: shipMissing(out), sName: out?.recipient || "", sPhone: out?.phone || "", sAddr: out?.address || "", sDate: out?.requested_date || l.start_date,
    sPick: pk && pk.status === "scheduled" ? pk.requested_date : "", sMemo: out?.memo || "" });
  lockShipFields();
  applyPickFilter();
}

  if (!draft.edit || !draft.shipLocked) return;

}

function vRequest() {
  const { start, due } = draft;

    const c = badRange ? [] : conflictsFor(e.id, start, due);

    const busyNow = outReg && e.status === "onloan";
    const od = !badRange && !own && due >= todayStr() ? loans.find(x => x.equipment_id === e.id && isOverdue(x)) : null;
    const blocked = (!own && (e.status === "repair" || e.status === "inspect")) || c.length > 0 || busyNow || !!od;
    if (blocked) draft.picks.delete(e.id);
    const why = e.status === "repair" ? "수리 중" : e.status === "inspect" ? "점검 중" : od ? "연체 중" : c.length ? "예약 겹침" : busyNow ? "대여 중" : "";
    const title = c.length ? `${c[0].loan_no} (${fmtD(c[0].start_date)}–${fmtD(c[0].due_date)})` : why;
    const detail = od ? `반납 예정일(${fmtD(od.due_date)})이 지났는데 아직 돌아오지 않았어요.` : c.length ? (() => { const nf = nextFreeStart(e.id, start, due);
      return `${c.map(x => `${fmtD(x.start_date)}–${fmtD(x.due_date)}`).slice(0, 2).join(", ")}${c.length > 2 ? ` 외 ${c.length - 2}건` : ""} 예약돼 있어요.${nf ? ` ${fmtD(nf)}부터 쓸 수 있어요.` : ""}`; })() : "";
    const hay = `${e.name} ${e.model || ""} ${e.internal_id || ""} ${e.label || ""} ${e.asset_no} ${e.item_no} ${e.serial_no} ${e.location} ${e.category}`.toLowerCase();
    return `<label class="${blocked ? "off" : ""}" data-hay="${esc(hay)}" data-cat="${esc(e.category)}" data-loc="${esc(locGroup(e.location))}" data-ok="${blocked ? "0" : "1"}"><input type="checkbox" data-pick="${e.id}" ${draft.picks.has(e.id) ? "checked" : ""} ${blocked ? "disabled" : ""}>
      <div class="main">${child ? `${frontTag(e)}${showName ? ` <b class="sub">${esc(e.name)}</b>` : ""} ${backId(e)}` : `${frontTag(e)} <b>${esc(e.name)}</b> ${backId(e)}`}<div class="meta">${child ? "" : `${esc(catName(e.category))} · `}${esc(e.location)}</div>${blocked && detail ? `<div class="why">${esc(detail)}</div>` : ""}${compLine(e) ? `<div class="r2-comp" title="${esc(e.components)}"><span>구성품</span> ${esc(compLine(e))}</div>` : ""}</div>
      ${blocked ? `<span class="pill p-bad" title="${esc(title)}">${esc(why)}</span>` : `<span class="pill p-ok">가능</span>`}</label>`;
  };
  // 같은 모델이 2대 이상이면 모델 줄 하나로 묶고, 펼치면 실제 장비를 고른다
  const pickHtml = groupByModel(rows).map(g => g.items.length === 1 ? pickRow(g.items[0], false) : `${(() => { const op = pickOpen.has(g.k) || g.items.some(e => draft.picks.has(e.id)); return `<div class="pgrp" data-grp="${esc(g.k)}" data-open="${op ? 1 : 0}">`; })()}
      <button type="button" class="pgrp-h" data-act="pickGrp" data-k="${esc(g.k)}"><span class="grp-arrow" aria-hidden="true">▸</span><div class="main"><b>${esc(modelName(g.items[0]))}</b> <span class="grp-n">${g.items.length}대</span><div class="meta">${esc(catName(g.items[0].category))} · <span class="pgrp-st"></span></div></div></button>
      <div class="pgrp-b" ${pickOpen.has(g.k) || g.items.some(e => draft.picks.has(e.id)) ? "" : "hidden"}>${g.items.map(e => pickRow(e, true, mixedNames(g.items))).join("")}</div></div>`).join("");
  const ed = draft.edit, ownerName = ed ? nameOf(draft.owner) : profile?.display_name || "나";
  const owners = proxy ? people.filter(p => p.status === "active").sort((a, b) => (a.id === me.id ? -1 : b.id === me.id ? 1 : (a.display_name || "").localeCompare(b.display_name || "", "ko"))) : [];
  const ownerSel = draft.owner || me.id;
  const t = todayStr();
  return `
  <div class="head"><div class="grow">${ed
    ? `<h2>예약 수정 <span class="mono" style="font-size:.7em">${esc(ed)}</span></h2><p class="sub">출고 전이라 기간, 장비, 사용 정보, 배송 정보를 고칠 수 있어요. 저장하면 장비 관리자에게 알림이 가요.</p>`
    : `<h2>데모 신청</h2><p class="sub">승인 없이 저장하는 즉시 예약이 확정돼요. 같은 기간에 이미 예약된 장비는 고를 수 없어요.${proxy ? " 장비 관리자는 다른 사람 이름으로 신청하거나, 이미 가져간 장비를 지난 날짜로 등록할 수 있어요." : ""}</p>`}</div>
    ${ed ? `<button class="btn" type="button" data-act="exitEdit">수정 그만두기</button>` : ""}</div>
  <form id="reqForm" class="grid2" novalidate>
    <div class="panel">
      <h3>1. 기간과 장비</h3>
      <div class="fields">
        <label class="f req"><span>사용 시작일</span><input type="date" id="rStart" value="${esc(start)}" min="${minStart()}" max="${outReg ? t : maxStart()}" required></label>
        <label class="f req"><span>반납 예정일</span><input type="date" id="rDue" value="${esc(due)}" min="${esc(start || t)}" ${start && !me.isAdmin ? `max="${addMonth1(start)}"` : ""} required></label>
      </div>
      ${proxy ? `<label class="check out-reg"><input type="checkbox" id="rOut" ${draft.out ? "checked" : ""}> 출고됨으로 등록 <span class="meta">이미 가져간 장비예요. 저장하면 바로 ‘출고’ 상태가 돼요.</span></label>` : ""}
      ${!start || !due ? "" : start > maxStart() ? `<div class="notice bad">사용 시작일은 오늘부터 1년 안으로 정해 주세요. ${fullD(maxStart())}까지 고를 수 있어요. 입력한 날짜: ${fullD(start)}</div>`
        : start < minStart() ? (me.isAdmin ? `<div class="notice bad">사용 시작일은 1년 전까지만 정할 수 있어요.</div>` : `<div class="notice bad">사용 시작일은 오늘이나 그 뒤로 정해 주세요.</div>`)
        : due < start ? `<div class="notice bad">반납 예정일은 사용 시작일과 같거나 그 뒤여야 해요.</div>`
        : overMonth(start, due) ? `<div class="notice bad">대여 기간은 최대 1달이에요. 반납 예정일을 ${fullD(addMonth1(start))}까지로 정해 주세요.</div>`
        : outReg && start > t ? `<div class="notice bad">출고됨으로 등록하려면 사용 시작일이 오늘이나 그 전이어야 해요.</div>`
        : !outReg && !ed && due < t ? `<div class="notice bad">반납 예정일이 이미 지났어요. 장비를 이미 가져갔다면 ‘출고됨으로 등록’을 켜 주세요.</div>`
        : `<div class="notice">기간: <b>${fullD(start)} ~ ${fullD(due)}</b> · ${daysBetween(start, due) + 1}일${outReg && due < t ? `<span> · <b class="t-bad">저장하면 바로 연체로 보여요</b></span>` : ""}${!outReg && start < t ? `<span> · <b>지난 날짜로 시작하는 예약이에요</b></span>` : ""}</div>`}
      ${rows.length ? `<div class="toolbar">
        <input id="rQ" type="search" placeholder="제품명·자산번호 검색" value="${esc(pickF.q)}" style="flex:1;min-width:160px">
        <select id="rLoc" aria-label="보관 위치"><option value="">전체 위치</option>${[...LOCS, "기타"].map(c => `<option ${pickF.loc === c ? "selected" : ""}>${c}</option>`).join("")}</select>
        <label class="check"><input type="checkbox" id="rAvail" ${pickF.avail ? "checked" : ""}> 가능한 장비만</label>
      </div>
      ${catChips("req", pickF.cat)}
      <div class="pick" id="pickList">${pickHtml}<div class="empty" id="pickNone" hidden style="padding:12px">조건에 맞는 장비가 없어요. 검색어나 필터를 바꿔 주세요.</div></div>` : `<div class="empty">신청할 수 있는 장비가 없어요.</div>`}
      <div class="meta" id="pickCount"></div>
    </div>
    <div class="panel">
      <h3>2. 사용 정보</h3>
      <div class="fields">
        ${proxy ? `<label class="f wide"><span>신청자</span><select id="rOwner">${owners.map(p => `<option value="${p.id}" ${p.id === ownerSel ? "selected" : ""}>${esc(p.display_name || "(이름 없음)")}${p.id === me.id ? " (나)" : ""}</option>`).join("")}</select></label>`
          : `<label class="f wide"><span>신청자</span><input id="rApplicant" value="${esc(ownerName)}" readonly></label>`}
        <label class="f"><span>내부 요청자</span><input id="rInternal" placeholder="요청한 사내 담당자 (없으면 비움)"></label>
        ${extField("rExternal")}
        <label class="f req"><span>목적</span><select id="rPurpose">${PURPOSES.map(p => `<option>${p}</option>`).join("")}</select><span class="meta" id="rPurposeDesc">${esc(purposeDesc(PURPOSES[0]))}</span></label>
        <label class="f req" id="rEtcWrap" hidden><span>기타 내용</span><input id="rEtc" maxlength="60" placeholder="어떤 용도인지 적어 주세요 (예: 사내 행사 지원)"></label>
        <label class="f"><span>고객사·기관</span><input id="rCustomer" placeholder="예: OO대학교 간호학과"></label>
        <label class="f wide"><span>메모</span><textarea id="rNote" placeholder="데모 장소, 함께 가져갈 소모품 등"></textarea></label>
      </div>
      <label class="check"><input type="checkbox" id="rDelivery"> 외부 물류사 배송이 필요해요</label>
      ${ed && draft.shipLocked ? `<div class="notice">물류사에 이미 배송을 요청해서 배송 정보는 여기서 바꿀 수 없어요. 바꿔야 하면 장비 관리자에게 말해 주세요.</div>` : ""}
      <div class="ship-box" id="shipBox" hidden>
        <label class="check"><input type="checkbox" id="rShipLater"> 수령인·주소는 아직 몰라요. 나중에 입력할게요</label>
        <p class="meta" id="shipLaterTip" hidden>지금은 배송 건으로만 신청해요. 출고 전에 [내 신청]의 예약 수정이나 [물류]에서 넣어 주세요. 아는 칸만 채워도 돼요.</p>
        <div class="fields" id="shipFields">
          <label class="f req"><span>수령인</span><input id="sName"></label>
          <label class="f req"><span>연락처</span><input id="sPhone" inputmode="tel" placeholder="010-0000-0000"></label>
          <label class="f req wide"><span>배송지 주소</span><input id="sAddr"></label>
          <label class="f req"><span>도착 희망일</span><input type="date" id="sDate" value="${esc(start)}"></label>
          <label class="f"><span>회수 희망일</span><input type="date" id="sPick" value="${esc(due || start)}"></label>
          <p class="meta wide" style="margin:-4px 0 0">도착 희망일은 사용 시작일, 회수 희망일은 반납 예정일과 같게 맞춰져요. 물류 일정이 다르면 직접 바꿔 주세요.</p>
          <label class="f wide"><span>배송 메모</span><textarea id="sMemo" placeholder="하차 위치, 엘리베이터 유무, 설치 필요 여부 등"></textarea></label>
        </div>
      </div>
      <div class="notice bad" id="reqErr" hidden></div>
      <div class="toolbar" style="justify-content:flex-end"><button class="btn pri" type="submit" id="reqSubmit">${ed ? "수정 저장" : outReg ? "출고 등록" : "신청 저장"}</button></div>
    </div>
  </form>`;
}

function applyPickFilter() {
  const list = $("#pickList"); if (!list) return;
  const q = pickF.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, total = 0;
  list.querySelectorAll("label[data-hay]").forEach(l => {
    total++;
    const picked = l.querySelector("input").checked;
    const ok = picked || ((!q.length || q.every(w => l.dataset.hay.includes(w)))
      && (!pickF.cat || l.dataset.cat === pickF.cat)
      && (!pickF.loc || l.dataset.loc === pickF.loc)
      && (!pickF.avail || l.dataset.ok === "1"));
    l.hidden = !ok; if (ok) shown++;
  });
  list.querySelectorAll(".pgrp").forEach(g => {
    const vis = [...g.querySelectorAll("label[data-hay]")].filter(l => !l.hidden);
    g.hidden = !vis.length;
    const open = pickOpen.has(g.dataset.grp) || g.querySelector("input:checked") || (q.length > 0 && vis.length > 0);
    g.querySelector(".pgrp-b").hidden = !open; g.dataset.open = open ? "1" : "0";
  });
  paintPickGroups();
  $("#pickNone").hidden = shown > 0;
  updatePickCount(shown, total);
}
// 모델 줄: 가능 대수와 고른 대수
function paintPickGroups() {
  document.querySelectorAll("#pickList .pgrp").forEach(g => {
    const ls = [...g.querySelectorAll("label[data-hay]")];
    const ok = ls.filter(l => l.dataset.ok === "1").length, sel = ls.filter(l => l.querySelector("input").checked).length;
    g.querySelector(".pgrp-st").innerHTML = `가능 ${ok}대${sel ? ` · <b style="color:var(--accent)">${sel}대 선택</b>` : ""}`;
  });
}
function updatePickCount(shown, total) {
  const c = $("#pickCount"); if (!c) return;
  if (shown === undefined) { const ls = [...document.querySelectorAll("#pickList label[data-hay]")]; total = ls.length; shown = ls.filter(l => !l.hidden).length; }
  const names = [...draft.picks].map(id => eqById(id)).filter(Boolean).map(e => `${e.name}${eqParenT(e)}`);
  c.innerHTML = `<b>선택 ${draft.picks.size}대</b>${names.length ? ` · ${esc(names.join(", "))}` : ""}<br><span>전체 ${total}대 중 ${shown}대 표시</span>`;
}

function vMine() {
  const mineAll = loans.filter(l => l.requester_id === me.id);
  const noAt = new Map(); mineAll.forEach(l => { const c = l.created_at || ""; if (!noAt.has(l.loan_no) || c < noAt.get(l.loan_no)) noAt.set(l.loan_no, c); });
  // 최근 신청이 위로, 같은 신청 안에서는 장비 순서 규칙대로
  const mine = mineAll.sort((a, b) => noAt.get(b.loan_no).localeCompare(noAt.get(a.loan_no)) || b.loan_no.localeCompare(a.loan_no) || loanEqCmp(a, b));
  const open = mine.filter(l => l.status !== "done" && l.status !== "cancelled");
  const past = mine.filter(l => !open.includes(l)).slice(0, 30);
  const actions = l => {
    if (l.status === "reserved") return `${canEditRes(l) ? `<button class="btn sm" data-act="editRes" data-id="${l.id}">수정</button>` : `<button class="btn sm" data-act="extend" data-id="${l.id}">연장</button>`}<button class="btn sm danger" data-act="cancel" data-id="${l.id}">취소</button>`;
    if (l.status === "out") return `<button class="btn sm" data-act="extend" data-id="${l.id}">연장</button><button class="btn sm pri" data-act="return" data-id="${l.id}">반납 신청</button>`;
    return "";
  };
  const line = l => { const e = eqById(l.equipment_id) || {}, ri = reqInfo(l); return `<div class="row clickable" data-act="loanView" data-id="${l.id}"><div class="main"><b>${esc(e.name)}</b> <span class="mono">${esc(eqNo(e))}</span>
      <div class="meta"><span class="mono">${esc(l.loan_no)}</span> · ${esc(l.customer || l.purpose)}${ri ? ` · ${esc(ri)}` : ""} · ${fmtD(l.start_date)}–${fmtD(l.due_date)}${l.delivery ? " · 배송" : ""}</div></div>
      ${isOverdue(l) ? `<span class="pill p-bad">연체 ${daysBetween(l.due_date, todayStr())}일</span>` : pill(LOAN_STATUS, l.status)} ${actions(l)}</div>`; };
  return `
  <div class="head"><div class="grow"><h2>내 신청</h2><p class="sub">반납을 누르면 반납 방법과 장비 상태를 적는 반납 신청서가 열려요. 장비 관리자가 점검하면 반납이 완료돼요.</p></div></div>
  ${(() => { const coming = shipments.filter(x => x.direction === "outbound" && x.status === "in_transit" && loans.some(l => l.loan_no === x.loan_no && l.requester_id === me.id && l.status !== "cancelled"));
    return coming.length ? `<div class="panel"><h3>배송 중 ${coming.length}건</h3><p class="meta" style="margin:0 0 6px">장비를 받았으면 [도착 확인]을 눌러 주세요. 장비 관리자에게 알림이 가요.</p><div class="list">${coming.map(x => { const l = loans.find(y => y.loan_no === x.loan_no && y.status !== "cancelled") || {};
      return `<div class="row"><div class="main"><b>${esc(l.customer || l.purpose || "")}</b><div class="meta"><span class="mono">${esc(x.loan_no)}</span> · 도착 희망 ${fmtD(x.requested_date) || "–"}${x.address ? ` · ${esc(x.address)}` : ""}</div></div><button class="btn sm pri" data-act="shipArrive" data-sid="${x.id}">도착 확인</button></div>`; }).join("")}</div></div>` : ""; })()}
  <div class="panel"><h3>진행 중 ${open.length}건</h3><div class="list">${open.map(line).join("") || `<div class="empty">진행 중인 신청이 없어요. ‘데모 신청’에서 장비를 빌려 보세요.</div>`}</div></div>
  <div class="panel"><h3>지난 신청</h3><div class="list">${past.map(line).join("") || `<div class="empty">지난 신청이 없어요.</div>`}</div></div>`;
}

function groupBy(arr, k) { const m = new Map(); for (const x of arr) { if (!m.has(x[k])) m.set(x[k], []); m.get(x[k]).push(x); } return [...m.values()]; }

// 배송 진행 단계: 누른 단계까지 색이 채워진다 (장비 관리자만 누를 수 있음)
const OUT_STEPS = ["pending", "requested", "in_transit", "delivered"];
const PICK_STEPS = ["pending", "requested", "done"];   // 반납 신청 전(scheduled)·취소는 버튼 없이 표시만
const steps = (x, order, map) => { const cur = order.indexOf(x.status);
  return `<div class="steps" role="group" aria-label="진행 단계">${order.map((k, i) => `<button class="step ${i < cur ? "done" : i === cur ? "cur" : ""}" data-act="shipStep" data-sid="${x.id}" data-st="${k}" aria-pressed="${i <= cur}" ${me.isAdmin ? "" : "disabled"}>${i < cur ? "✓ " : ""}${esc(map[k][0])}</button>`).join("")}</div>`; };
// 화물 배차 정보 (shipments.dispatch). 배송은 사무실 → 고객, 회수는 고객 → 사무실
const DSP = s => (s && s.dispatch) || {};
const lastDispatch = exceptId => shipments.filter(x => x.id !== exceptId && DSP(x).office).sort((a, b) => (b.updated_at || "").localeCompare(a.updated_at || ""))[0];
// 배차 시간: 날짜 + 시간대 (오전·오후·정각). 메시지에는 "2026.11.10 오전", "26.11.10 오후 4시"처럼 들어간다
const SLOTS = ["오전", "오후", ...[8, 9, 10, 11].map(h => `오전 ${h}시`), "오후 12시", ...[1, 2, 3, 4, 5, 6, 7].map(h => `오후 ${h}시`)];
const slotTxt = (date, slot, fmt) => date ? `${fmt(date)} ${slot || "(시간 입력 필요)"}` : "";
const shortDate = d => d ? `${d.slice(2, 4)}.${+d.slice(5, 7)}.${+d.slice(8, 10)}` : "";
const longDate = d => d ? `${d.slice(0, 4)}.${+d.slice(5, 7)}.${+d.slice(8, 10)}` : "";
function dispatchDefaults(s) {
  const d = DSP(s), last = DSP(lastDispatch(s.id));
  const g = loans.filter(l => l.loan_no === s.loan_no), loc = eqById(g[0]?.equipment_id)?.location || "";
  const day = s.requested_date || g[0]?.[s.direction === "pickup" ? "due_date" : "start_date"] || "";
  return { depart_date: d.depart_date ?? day, depart_slot: d.depart_slot ?? "", arrive_date: d.arrive_date ?? day, arrive_slot: d.arrive_slot ?? "",
    depart_time: d.depart_time ?? (s.direction === "outbound" ? longDate(s.requested_date) : ""), office: d.office ?? (last.office || (LOCS.includes(loc) ? `${loc}사무실` : loc)),
    office_name: d.office_name ?? (last.office_name || ""), office_phone: d.office_phone ?? (last.office_phone || ""),

const trackTxt = x => `${x.carrier ? ` · ${esc(x.carrier)}` : ""}${x.tracking_no ? ` · 운송장 <span class="mono">${esc(x.tracking_no)}</span>` : ""}${DSP(x).vehicle ? ` · 차량 ${esc(DSP(x).vehicle)}` : ""}${me.isAdmin ? ` · <button class="linkbtn" data-act="shipEdit" data-sid="${x.id}">${DSP(x).office ? "배차 정보 수정" : "배차 정보 입력"}</button>` : ""}`;

// 출납 대장 상태 버튼: 전체, 대여 중(예약·출고·반납 확인 중, 기본값), 연체, 반납 확인 중, 반납 완료, 취소
// 출납 대장 보기. 단계(flow)는 신청이 지나는 순서, 모아 보기(sum)는 여러 단계를 합친 것
const LEDGER_ST = [
  ["all", "전체", () => true, "sum", "취소를 포함한 모든 신청이에요. 최근 시작한 신청이 위에 있어요."],

  ["reserved", "출고 예정", l => l.status === "reserved", "flow", "예약만 되어 있고 아직 나가지 않은 신청이에요. 출고일이 가까운 순이에요."],
  ["out", "대여 중", l => l.status === "out", "flow", "지금 장비가 밖에 나가 있는 신청이에요. 반납 예정일이 가까운 순이에요."],
  ["checking", "반납 확인 대기", l => l.status === "checking", "flow", "장비가 돌아왔고 장비 관리자의 확인을 기다리는 신청이에요."],
  ["done", "반납 완료", l => l.status === "done", "flow", "반납 확인까지 끝난 신청이에요."],
  ["cancelled", "취소", l => l.status === "cancelled", "flow", "취소된 신청이에요."],

function vLedger() {
  const q = filters.ledgerQ.trim().toLowerCase(), st = filters.ledgerSt;
  const stDef = LEDGER_ST.find(x => x[0] === st) || LEDGER_ST.find(x => x[0] === "open");   // 기본은 대여 중
  const matchQ = l => { const e = eqById(l.equipment_id) || {};
    return !q || `${l.loan_no} ${e.internal_id || ""} ${e.label || ""} ${e.asset_no} ${e.name} ${e.model || ""} ${l.customer} ${nameOf(l.requester_id)} ${reqInfo(l)}`.toLowerCase().includes(q); };
  const searched = loans.filter(l => matchQ(l) && (!filters.lgShip || l.delivery));
  const nGroups = test => new Set(searched.filter(test).map(l => l.loan_no)).size;
  const list = searched.filter(stDef[2]);
  // 대여번호(신청번호)별로 묶는다. 최근 시작한 신청이 위로.
  const groups = [...list.reduce((m, l) => (m.has(l.loan_no) ? m.get(l.loan_no).push(l) : m.set(l.loan_no, [l]), m), new Map()).values()]
    .map(g => g.sort(loanEqCmp))
    .sort((a, b) => b[0].start_date.localeCompare(a[0].start_date) || b[0].loan_no.localeCompare(a[0].loan_no));
  // 진행 중 보기: 지금 나가 있음(반납일 가까운 순) → 반납 확인 대기 → 출고 예정(시작일 가까운 순)으로 나눈다
  const t = todayStr();
  const phase = g => g.some(x => x.status === "out") ? "out" : g.some(x => x.status === "checking") ? "checking" : g.some(x => x.status === "reserved") ? "reserved" : "other";
  const minOf = (g, k, st) => g.filter(x => x.status === st).map(x => x[k]).sort()[0] || "";
  const SECTIONS = [["out", "대여 중", "지금 나가 있음 · 반납 예정일이 가까운 순", (a, b) => minOf(a, "due_date", "out").localeCompare(minOf(b, "due_date", "out"))],
    ["checking", "반납 확인 대기", "돌아왔고 장비 관리자 확인을 기다림", (a, b) => (a[0].returned_at || "").localeCompare(b[0].returned_at || "")],
    ["reserved", "출고 예정", "출고일이 가까운 순", (a, b) => minOf(a, "start_date", "reserved").localeCompare(minOf(b, "start_date", "reserved"))]];
  const sectioned = stDef[0] === "open" || stDef[0] === "out" || stDef[0] === "reserved";

  const dday = (d, word) => { const n = daysBetween(t, d); return n === 0 ? `오늘 ${word}` : n === 1 ? `내일 ${word}` : n > 0 ? `${word} D-${n}` : `${word}일 ${-n}일 지남`; };
  const whenPill = g => { const ph = phase(g);
    if (ph === "out") { const d = minOf(g, "due_date", "out"), n = daysBetween(t, d); return `<span class="pill when ${n < 0 ? "p-bad" : n <= 1 ? "p-warn" : "p-info"}">${dday(d, "반납")}</span>`; }
    if (ph === "reserved") { const d = minOf(g, "start_date", "reserved"), n = daysBetween(t, d); return `<span class="pill when ${n < 0 ? "p-bad" : n <= 1 ? "p-warn" : "p-ok"}">${dday(d, "출고")}</span>`; }

  const act = l => {

  const head = g => { const l = g[0], ri = reqInfo(l), o = shipOf(l.loan_no, "outbound");
    const all = loans.filter(x => x.loan_no === l.loan_no && x.status !== "cancelled").sort(loanEqCmp);

    const open = lgOpen.has(l.loan_no) || !!q;

    // 한 상태뿐이면 이름만, 섞였으면 장비 대수와 함께 (예: 출고 2대 · 예약 1대)
    const stName = k => LEDGER_ST.find(x => x[0] === k)?.[1] || LOAN_STATUS[k][0];   // 단계 버튼과 같은 이름

    const eqs = (all.length ? all : g).map(x => eqById(x.equipment_id) || {});

  return `
  <div class="head"><div class="grow"><h2>출납 대장</h2><p class="sub">대여번호(신청번호)별로 묶어서 보여 줘요. 번호 줄을 누르면 장비 목록이 펼쳐지고, 장비 줄을 누르면 자세히 볼 수 있어요.${me.isAdmin ? "" : " 출고·점검은 장비 관리자만 할 수 있어요."}</p></div>

const eqLink = iid => `${location.origin}${location.pathname}#eq/${encodeURIComponent(iid)}`;
function openEqByIid(iid) {

// QR 라벨 내용에서 내부 ID를 꺼낸다 (링크 또는 EQ-0001 그대로)
const iidFromQR = t => { const m = String(t).match(/#eq\/([A-Za-z]+-\d+)/) || String(t).trim().match(/^(EQ-\d+)$/i); return m ? decodeURIComponent(m[1]) : null; };

// 앱 안에서 QR 찍기: 홈 화면 앱의 로그인을 그대로 쓰고, 2대 제한에도 걸리지 않는다
let scanStream = null, scanTimer = null;
function stopScan() { if (scanTimer) cancelAnimationFrame(scanTimer); scanTimer = null; if (scanStream) scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
function loadScript(src, sri) {
  return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script"); s.src = src; s.integrity = sri; s.crossOrigin = "anonymous"; s.onload = ok; s.onerror = () => no(new Error("스캔 도구를 불러오지 못했어요.")); document.head.appendChild(s); });
}
async function scanQR() {
  modal(`<h2>QR 찍기</h2><p class="meta">장비에 붙은 데모콕 QR 라벨을 네모 안에 맞춰 주세요.</p>
    <div class="scan-box"><video id="scV" playsinline muted></video><div class="aim"></div></div>
    <div class="notice" id="scMsg">카메라를 켜는 중…</div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button></div>`, async m => {
    const msg = t => { const n = $("#scMsg", m); if (n) n.textContent = t; };
    if (!navigator.mediaDevices?.getUserMedia) return msg("이 브라우저에서는 카메라를 쓸 수 없어요. 폰 카메라로 라벨을 찍어도 장비 화면이 열려요.");
    try { scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); }
    catch { return msg("카메라를 쓸 수 없어요. 브라우저 설정에서 카메라 권한을 허용해 주세요."); }
    if (!document.body.contains(m)) return stopScan();
    const v = $("#scV", m); v.srcObject = scanStream; await v.play().catch(() => {});
    let detect;
    if ("BarcodeDetector" in window) {
      try { const bd = new BarcodeDetector({ formats: ["qr_code"] }); detect = async () => (await bd.detect(v))[0]?.rawValue; } catch {}
    }
    if (!detect) {
      try { await loadScript("vendor/jsqr-1.4.0.js", "sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx"); }
      catch (e) { return msg(e.message); }
      const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
      detect = async () => {
        const w = v.videoWidth, h = v.videoHeight; if (!w) return null;
        const k = Math.min(1, 640 / Math.max(w, h)); c.width = w * k; c.height = h * k;
        ctx.drawImage(v, 0, 0, c.width, c.height);
        return window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "dontInvert" })?.data;
      };
    }
    msg("QR 라벨을 비춰 주세요.");
    let last = "";
    const tick = async () => {
      if (!scanStream) return;
      let text = null; try { text = await detect(); } catch {}
      if (text && text !== last) {
        last = text;
        const iid = iidFromQR(text);
        if (iid) { closeModal(); return openEqByIid(iid); }
        msg("데모콕 장비 라벨이 아니에요. 장비에 붙은 QR을 찍어 주세요.");
      }
      scanTimer = requestAnimationFrame(tick);
    };
    tick();
  });
}

// QR 라벨 출력 (A4 24칸 라벨지: 64×33.9mm, 3열 8행)
const LABEL_PER_SHEET = 24;
function qrSvg(text) {
  const q = window.qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelForm(ids) {
  const rows = ids.map(eqById).filter(e => e && e.internal_id).sort((a, b) => a.internal_id.localeCompare(b.internal_id));

  modal(`<h2>QR 라벨 출력</h2><p class="meta">장비 ${rows.length}대. A4 24칸 라벨지(한 칸 64×33.9mm, 3열 8행) 기준이에요. 처음에는 일반 종이에 뽑아서 라벨지에 겹쳐 보고 칸이 맞는지 확인해 주세요.</p>
    <div class="fields">
      <label class="f"><span>시작 칸 (이미 쓴 칸 건너뛰기)</span><select id="lbStart">${Array.from({ length: LABEL_PER_SHEET }, (_, i) => `<option value="${i}">${i + 1}번째 칸 (${Math.floor(i / 3) + 1}줄 ${i % 3 + 1}번째)</option>`).join("")}</select></label>
      <label class="f"><span>종이</span><select id="lbCut"><option value="0">라벨지 (선 없음)</option><option value="1">일반 종이 (자르는 선 표시)</option></select></label>
    </div>
    <div class="notice">라벨 ${rows.length}장 · A4 ${Math.ceil(rows.length / LABEL_PER_SHEET)}장. 인쇄 창에서 <b>배율 100%(실제 크기)</b>, <b>여백 없음</b>으로 맞춰 주세요. 오래 쓰려면 투명 테이프로 덮어 주세요.</div>
    <div class="notice bad" id="lbErr" hidden></div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="lbGo">인쇄</button></div>`, m => {
    $("#lbGo", m).addEventListener("click", () => {
      if (!window.qrcode) { $("#lbErr", m).textContent = "QR 도구를 아직 불러오지 못했어요. 잠시 뒤에 다시 눌러 주세요."; $("#lbErr", m).hidden = false; return; }
      printLabels(rows, +$("#lbStart", m).value, $("#lbCut", m).value === "1");
    });
  });
}
function printLabels(rows, skip, cut) {
  const cells = [...Array(skip).fill(null), ...rows], sheets = [];
  for (let i = 0; i < cells.length; i += LABEL_PER_SHEET) sheets.push(cells.slice(i, i + LABEL_PER_SHEET));
  let area = $("#printArea"); if (!area) { area = document.createElement("div"); area.id = "printArea"; document.body.appendChild(area); }
  area.innerHTML = sheets.map(sh => `<div class="lbl-sheet">${sh.map(e => e ? `<div class="lbl ${cut ? "cut" : ""}">${qrSvg(eqLink(e.internal_id))}
      <div class="tx"><span class="app">데모콕 · LMK</span><span class="iid">${esc(e.internal_id)}</span>${e.label ? `<span class="lb">${esc(e.label)}</span>` : ""}<span class="nm">${esc(e.name)}</span></div></div>`
    : `<div class="lbl"></div>`).join("")}</div>`).join("");
  const done = () => { area.innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(() => window.print(), 50);
}

/* ---------- 모달 ---------- */
function modal(html, onMount) {
  const root = $("#modalRoot");
  const x = html.includes('class="flow"') ? "" : `<button class="icon-btn modal-x" data-close-btn aria-label="닫기">✕</button>`;
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${x}${html}</div></div>`;
  const ov = root.firstElementChild;
  // 작성 창(입력 칸이 있는 창)은 바깥을 눌러도 닫지 않는다. 닫기·✕로만 닫는다.
  // 다른 창도 창 안에서 누르기 시작해 바깥에서 뗀 경우(글자 선택 등)는 닫지 않는다.
  const isForm = !!ov.querySelector("input,textarea,select,.flow");
  let downOut = false;
  ov.addEventListener("pointerdown", e => { downOut = e.target === ov; });
  ov.addEventListener("click", e => {
    if (e.target.closest("[data-close-btn]")) return closeModal();
    if (e.target !== ov || !downOut) return;
    if (!isForm) return closeModal();
    const m = ov.firstElementChild; m.classList.remove("nudge"); void m.offsetWidth; m.classList.add("nudge");
    if (!ov.dataset.hinted) { ov.dataset.hinted = "1"; toast("작성 중인 창은 [닫기]나 ✕를 눌러 닫아 주세요."); }
  });
  ov.addEventListener("input", () => { ov.dataset.dirty = "1"; });
  onMount && onMount(ov.firstElementChild);
  const f = ov.querySelector("input:not([type=radio]),select,textarea,button:not(.modal-x)"); f && f.focus();
}

function confirmBox(title, body, okText, fn, danger) {
  modal(`<h2>${esc(title)}</h2><p class="meta">${body}</p><div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn ${danger ? "danger" : "pri"}" id="cOk">${esc(okText)}</button></div>`,
    m => { const b = $("#cOk", m); b.addEventListener("click", () => busy(b, async () => { await fn(); closeModal(); await refresh(); })); });
}

function nextAssetNo() { const n = Math.max(0, ...equipment.map(e => +(/DEMO-(\d+)/.exec(e.asset_no)?.[1] || 0))); return `DEMO-${String(n + 1).padStart(4, "0")}`; }

function eqForm(e, defCat) {
  e = e || { asset_no: "", label: "", name: "", item_no: "", serial_no: "", category: CATS.includes(defCat) ? defCat : CATS[0], location: LOCS[0], status: "available", components: "", note: "" };
  const isEtc = !!e.location && !LOCS.includes(e.location);
  modal(`<h2>${e.id ? "장비 수정" : "장비 등록"}</h2>
    ${e.internal_id ? `<p class="meta">내부 ID ${idTag(e)} · 다른 정보를 바꿔도 내부 ID는 바뀌지 않아요.</p>` : `<p class="meta">내부 ID(EQ-0000)는 저장할 때 자동으로 붙어요. 한 번 붙으면 바뀌지 않아요.</p>`}
    <form id="eqForm" class="fields">
      <label class="f"><span>자산번호 (없으면 비워 두기)</span><input id="eAsset" value="${esc(assetNo(e))}"></label>
      <label class="f"><span>라벨 (예: RA1, SM3G)</span><input id="eLabel" value="${esc(e.label || "")}"></label>
      <label class="f req"><span>제품명</span><input id="eName" value="${esc(e.name)}" required></label>
      <label class="f"><span>모델 (묶음 이름)</span><input id="eModel" list="eModelList" value="${esc(e.model || "")}" placeholder="비워 두면 제품명으로 묶어요"><datalist id="eModelList">${[...new Set(equipment.map(x => modelName(x)))].sort().map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
      <label class="f"><span>품목번호</span><input id="eItem" value="${esc(e.item_no)}"></label>
      <label class="f"><span>시리얼 번호</span><input id="eSerial" value="${esc(e.serial_no)}"></label>
      <label class="f"><span>분류</span><select id="eCat">${CATS.map(c => `<option value="${esc(c)}" ${e.category === c ? "selected" : ""}>${esc(catName(c))}</option>`).join("")}</select></label>
      <label class="f"><span>보관 위치</span><select id="eLoc">${LOCS.map(c => `<option ${e.location === c ? "selected" : ""}>${c}</option>`).join("")}<option value="__etc" ${isEtc ? "selected" : ""}>기타 (직접 기록)</option></select></label>
      <label class="f" id="eLocEtcWrap" ${isEtc ? "" : "hidden"}><span>기타 위치</span><input id="eLocEtc" value="${esc(isEtc ? e.location : "")}" placeholder="예: OO병원 시뮬레이션센터"></label>
      <label class="f"><span>상태</span><select id="eSt">${Object.entries(EQ_STATUS).map(([k, [t]]) => `<option value="${k}" ${e.status === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="f wide"><span>구성품 (반납 점검 기준)</span><textarea id="eComp" placeholder="본체, 충전기, 케이스 …">${esc(e.components)}</textarea></label>
      <label class="f wide"><span>관리 메모</span><textarea id="eNote">${esc(e.note)}</textarea></label>
      <div class="notice bad wide" id="eErr" hidden></div>
      <div class="actions wide"><button type="button" class="btn" data-close-btn>닫기</button><button class="btn pri" type="submit" id="eSave">저장</button></div>
    </form>`, m => {
    $("#eLoc", m).addEventListener("change", ev => { $("#eLocEtcWrap", m).hidden = ev.target.value !== "__etc"; });
    $("#eqForm", m).addEventListener("submit", ev => {
      ev.preventDefault();
      const d = { asset_no: $("#eAsset").value.trim(), label: $("#eLabel").value.trim(), name: $("#eName").value.trim(), model: $("#eModel").value.trim(), item_no: $("#eItem").value.trim(), serial_no: $("#eSerial").value.trim(),
        category: $("#eCat").value, location: $("#eLoc").value === "__etc" ? $("#eLocEtc").value.trim() : $("#eLoc").value,
        status: $("#eSt").value, components: $("#eComp").value.trim(), note: $("#eNote").value.trim() };
      const err = $("#eErr"); err.hidden = true;
      if (!d.name) { err.textContent = "제품명을 입력해 주세요."; err.hidden = false; return; }
      if (!d.location) { err.textContent = "기타를 골랐다면 위치를 직접 입력해 주세요."; err.hidden = false; return; }
      busy($("#eSave"), async () => {
        if (e.id) await must(sb.from("equipment").update(d).eq("id", e.id));
        else await must(sb.from("equipment").insert(d));
        closeModal(); toast(e.id ? "장비 정보를 저장했어요." : "장비를 등록했어요."); await refresh();
      });
    });
  });
}

function verdictHtml(cond) {
  const repair = cond === "broken" || cond === "missing";
  return `<div><h3>장비 판정</h3><div class="fields" style="margin-top:6px">
    <label class="check"><input type="radio" name="vd" value="ok" ${repair ? "" : "checked"}> 사용 가능</label>
    <label class="check"><input type="radio" name="vd" value="repair" ${repair ? "checked" : ""}> 수리 필요</label></div>
    <div class="meta">파손 또는 수리 필요·구성품 누락이면 ‘수리 필요’로 자동 선택돼요. 필요하면 바꿔 주세요.</div></div>`;
}
function bindVerdict(m, condName) {
  let touched = false;
  m.querySelectorAll('input[name="vd"]').forEach(r => r.addEventListener("change", () => touched = true));
  m.querySelectorAll(`input[name="${condName}"]`).forEach(r => r.addEventListener("change", () => {
    if (touched || !r.checked) return;
    const rep = r.value === "broken" || r.value === "missing";
    m.querySelector(`input[name="vd"][value="${rep ? "repair" : "ok"}"]`).checked = true;
  }));
}
function eqCheck(e) {
  const lent = e.status === "onloan" || e.status === "inspect";
  modal(`<h2>상태 점검 기록</h2><p class="meta">${esc(e.name)} ${eqParen(e)} · 실사나 수리 후 확인처럼 출납과 관계없는 점검을 기록해요.</p>
    <div class="fields">${Object.entries(CONDS).map(([k, t]) => `<label class="check"><input type="radio" name="kc" value="${k}" ${(e.last_check || "ok") === k ? "checked" : ""}> ${t}</label>`).join("")}</div>
    <label class="f"><span>점검 메모</span><textarea id="kNote"></textarea></label>
    ${lent ? `<div class="notice">지금 ${esc(EQ_STATUS[e.status][0])} 상태라서 장비 상태는 바꾸지 않고 점검 결과만 기록해요.</div>` : verdictHtml(e.last_check || "ok")}
    <div class="fields">${locPicker("k", e.location)}</div>
    <div class="notice bad" id="kErr" hidden></div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="kOk">기록</button></div>`, m => {
    bindLocPicker(m, "k"); if (!lent) bindVerdict(m, "kc");
    const b = $("#kOk", m);
    b.addEventListener("click", () => {
      const cond = m.querySelector('input[name="kc"]:checked').value, note = $("#kNote", m).value.trim(), loc = locValue(m, "k"), err = $("#kErr", m);
      if (cond !== "ok" && !note) { err.textContent = "손상이나 누락이 있으면 내용을 메모에 적어 주세요."; err.hidden = false; return; }
      if (!loc) { err.textContent = "기타를 골랐다면 위치를 직접 입력해 주세요."; err.hidden = false; return; }
      const d = { last_check: cond, last_check_note: note, last_check_source: "admin", last_check_by: me.id, last_check_at: new Date().toISOString(), location: loc };
      if (!lent) d.status = m.querySelector('input[name="vd"]:checked').value === "repair" ? "repair" : (e.status === "repair" ? "available" : e.status);
      busy(b, async () => { await must(sb.from("equipment").update(d).eq("id", e.id)); closeModal(); toast("점검 결과를 기록했어요."); await refresh(); });
    });
  });
}

function eqView(id) {
  const e = eqById(id); if (!e) return;
  const t = todayStr();
  const sched = loans.filter(l => l.equipment_id === id && ACTIVE(l.status)).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const myOut = loans.find(l => l.equipment_id === id && l.status === "out" && l.requester_id === me.id);
  const hist = loans.filter(l => l.equipment_id === id && l.status === "done").sort((a, b) => (b.returned_at || "").localeCompare(a.returned_at || "")).slice(0, 5);
  modal(`<div class="head"><div class="grow"><h2>${esc(e.name)}</h2><div class="meta">${keyTag(e) ? keyTag(e) + " · " : ""}${me.isAdmin && e.internal_id ? `<span class="mono" title="내부 ID (관리자만 보임)">${esc(e.internal_id)}</span> · ` : ""}<span class="mono">${esc(assetNo(e) || "자산번호 없음")}</span> · ${esc(e.item_no || "품목번호 없음")} · S/N ${esc(e.serial_no || "–")} · ${esc(e.location)}</div></div>${pill(EQ_STATUS, e.status)}</div>
    <div><h3>최근 점검</h3><div style="margin-top:4px">${checkCell(e)}</div></div>
    <div><h3>구성품</h3><div class="meta" style="white-space:pre-wrap">${esc(e.components || "등록된 구성품이 없어요.")}</div></div>
    <div><h3>예약 일정</h3><div class="list">${sched.map(l => `<div class="row"><div class="main"><span class="mono">${fmtD(l.start_date)}–${fmtD(l.due_date)}</span> · ${esc(nameOf(l.requester_id))} · ${esc(l.customer || l.purpose)}</div>${l.status === "out" && l.due_date < t ? `<span class="pill p-bad">연체</span>` : pill(LOAN_STATUS, l.status)}</div>`).join("") || `<div class="empty">잡힌 예약이 없어요.</div>`}</div></div>
    <div><h3>이력</h3><div class="hist" id="eqHist"><div class="ev"><span class="t"></span><span class="meta">불러오는 중…</span></div></div></div>
    <div hidden><h3>최근 반납</h3><div class="list">${hist.map(l => `<div class="row"><div class="main"><span class="mono">${fmtT(l.returned_at)}</span> · ${esc(nameOf(l.requester_id))}</div><span class="pill ${l.return_condition === "ok" ? "p-ok" : "p-warn"}">${esc(CONDS[l.return_condition] || "–")}</span></div>`).join("") || `<div class="empty">반납 기록이 없어요.</div>`}</div></div>
    ${e.note ? `<div class="meta">메모: ${esc(e.note)}</div>` : ""}
    <div class="actions"><button class="btn" data-close-btn>닫기</button>${me.isAdmin ? `<button class="btn" id="eLabel1">QR 라벨</button><button class="btn" id="eCheck">상태 점검 기록</button><button class="btn" id="eEdit">수정</button>` : ""}${myOut ? `<button class="btn" data-act="return" data-id="${myOut.id}">반납 신청</button>` : ""}<button class="btn pri" id="eReq" ${["repair","retired","inspect"].includes(e.status) ? "disabled" : ""}>이 장비 신청</button></div>`, m => {
    $("#eEdit", m)?.addEventListener("click", () => eqForm(e));
    $("#eCheck", m)?.addEventListener("click", () => eqCheck(e));
    $("#eLabel1", m)?.addEventListener("click", () => labelForm([e.id]));
    loadHistory(e.id, $("#eqHist", m));
    $("#eReq", m).addEventListener("click", () => { draft.picks = new Set([id]); closeModal(); go("request"); });
  });
}

async function submitRequest() {
  const err = $("#reqErr"), show = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "nearest" }); };
  err.hidden = true;
  const start = $("#rStart").value, due = $("#rDue").value;
  if (!start || !due || due < start) return show("사용 기간을 확인해 주세요. 반납 예정일은 시작일과 같거나 그 뒤여야 해요.");
  const proxy = me.isAdmin && !draft.edit, outReg = proxy && draft.out, owner = proxy && draft.owner && draft.owner !== me.id ? draft.owner : null;
  if (start < minStart()) return show(me.isAdmin ? "사용 시작일은 1년 전까지만 정할 수 있어요." : "사용 시작일은 오늘이나 그 뒤로 정해 주세요.");
  if (start > maxStart()) return show(`사용 시작일은 오늘부터 1년 안으로 정해 주세요. 입력한 날짜: ${fullD(start)}`);
  if (overMonth(start, due)) return show(`대여 기간은 최대 1달이에요. 반납 예정일을 ${fullD(addMonth1(start))}까지로 정해 주세요.`);
  if (outReg && start > todayStr()) return show("출고됨으로 등록하려면 사용 시작일이 오늘이나 그 전이어야 해요.");
  if (!outReg && !draft.edit && due < todayStr()) return show("반납 예정일이 이미 지났어요. 장비를 이미 가져갔다면 ‘출고됨으로 등록’을 켜 주세요.");
  const picks = [...draft.picks];
  if (!picks.length) return show("빌릴 장비를 1대 이상 골라 주세요.");
  if ($("#rPurpose").value === "기타" && !$("#rEtc").value.trim()) { $("#rEtc").focus(); return show("목적이 ‘기타’면 ‘기타 내용’을 적어 주세요."); }
  const noteVal = joinNote($("#rPurpose").value, $("#rEtc").value, $("#rNote").value);
  let shipment = null;
  if ($("#rDelivery").checked) {
    const later = $("#rShipLater")?.checked;
    shipment = { recipient: $("#sName").value.trim(), phone: $("#sPhone").value.trim(), address: $("#sAddr").value.trim(), date: $("#sDate").value || null, memo: $("#sMemo").value.trim() };
    if (later) shipment.later = true;
    else if (!shipment.recipient || !shipment.phone || !shipment.address || !shipment.date) return show("배송이 필요하면 수령인, 연락처, 주소, 도착 희망일을 모두 입력해 주세요. 아직 모르면 ‘나중에 입력할게요’를 켜 주세요.");
    if ($("#sPick").value) shipment.pickup_date = $("#sPick").value;
  }
  const btn = $("#reqSubmit"); btn.disabled = true;
  if (draft.edit) {
    const no = draft.edit;
    try {
      await must(sb.rpc("update_reservation", {
        p_loan_no: no, p_equipment_ids: picks, p_start: start, p_due: due, p_purpose: $("#rPurpose").value,
        p_customer: $("#rCustomer").value, p_internal: $("#rInternal").value, p_external: $("#rExternal").value,
        p_note: noteVal, p_shipment: shipment,
      }));
      draft = newDraft(); await refresh(true); go("mine");
      toast(`${no} 예약을 고쳤어요.`);
    } catch (e) { btn.disabled = false; show(errText(e)); await refresh(true); }
    return;
  }
  try {
    const args = {
      p_equipment_ids: picks, p_start: start, p_due: due, p_purpose: $("#rPurpose").value,
      p_customer: $("#rCustomer").value, p_internal: $("#rInternal").value, p_external: $("#rExternal").value,
      p_note: noteVal, p_shipment: shipment,
    };
    if (owner) args.p_requester = owner;          // 새 값은 쓸 때만 보낸다
    if (outReg) args.p_checked_out = true;
    const no = await must(sb.rpc("create_loan_request", args));
    draft = newDraft();
    await refresh(true); go(owner ? "ledger" : "mine");
    const who = owner ? `${nameOf(owner)}님 이름으로 ` : "";
    toast(outReg ? `${no} ${who}출고 등록했어요.`
      : `${no} ${who}예약을 확정했어요.${shipment ? (me.isAdmin ? " 물류 탭에서 물류 요청 메시지를 보내 주세요." : " 장비 관리자가 물류사에 배송을 요청해요.") : ""}`);
  } catch (e) { btn.disabled = false; show(errText(e)); await refresh(true); }
}

function extend(l) {
  modal(`<h2>반납 예정일 연장</h2><p class="meta">${esc(eqById(l.equipment_id)?.name)} · 현재 반납 예정일 ${fmtD(l.due_date)}</p>
    <label class="f"><span>새 반납 예정일</span><input type="date" id="xDue" value="${esc(me.isAdmin || addDays(l.due_date, 3) <= addMonth1(l.start_date) ? addDays(l.due_date, 3) : addMonth1(l.start_date))}" min="${esc(addDays(l.due_date, 1))}" ${me.isAdmin ? "" : `max="${addMonth1(l.start_date)}"`}></label>
    <div class="meta">${me.isAdmin ? "관리자는 1달을 넘겨 연장할 수 있어요." : `시작일부터 1달(${fullD(addMonth1(l.start_date))})까지 연장할 수 있어요.`}</div>
    <div class="notice bad" id="xErr" hidden></div>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="xOk">연장</button></div>`, m => {
    const b = $("#xOk", m);
    b.addEventListener("click", async () => {
      const nd = $("#xDue").value, err = $("#xErr"); err.hidden = true;
      if (!nd || nd <= l.due_date) { err.textContent = "지금 반납 예정일보다 뒤 날짜를 골라 주세요."; err.hidden = false; return; }
      if (!me.isAdmin && nd > addMonth1(l.start_date)) { err.textContent = `연장은 시작일부터 1달(${fullD(addMonth1(l.start_date))})까지 할 수 있어요. 더 길게 쓰려면 장비 관리자에게 요청해 주세요.`; err.hidden = false; return; }
      b.disabled = true;
      const { error } = await sb.from("loans").update({ due_date: nd }).eq("id", l.id);
      b.disabled = false;
      if (error) { err.textContent = errText(error); err.hidden = false; return; }
      closeModal(); toast("반납 예정일을 연장했어요."); await refresh();
    });
  });
}

function returnForm(l) {
  // 같은 신청번호에서 지금 반납할 수 있는(출고 상태) 장비. 처음엔 모두 고른 상태로 시작한다.
  const cands = loans.filter(x => x.loan_no === l.loan_no && x.status === "out" && (x.requester_id === me.id || me.isAdmin))
    .sort(loanEqCmp);
  const pick = shipOf(l.loan_no, "pickup"), out = shipOf(l.loan_no, "outbound");
  const src = pick || out || {};
  const pickDefault = (pick && pick.requested_date) || addDays(todayStr(), 1);
  const pickLocked = pick && !["scheduled", "pending", "cancelled"].includes(pick.status);   // 물류사에 이미 요청함
  const st = { place: "의왕", how: null, sel: new Set(cands.map(x => x.id)), ans: {}, pick: {}, note: {}, dateOk: null, retOn: todayStr() };
  const minRet = () => items().reduce((m, x) => x.start_date > m ? x.start_date : m, "");
  const multi = cands.length > 1;
  const items = () => cands.filter(x => st.sel.has(x.id));
  const eqOf = x => eqById(x.equipment_id) || {};
  const checksOf = x => checksFor(eqOf(x));
  const ansOf = x => (st.ans[x.id] = st.ans[x.id] || {});
  const pickOf = x => (st.pick[x.id] = st.pick[x.id] || {});
  const nosOf = x => checksOf(x).filter(q => ansOf(x)[q.k] === "n");
  const picksOf = x => nosOf(x).flatMap(q => pickOf(x)[q.k] || []);
  const resultOf = x => checksOf(x).reduce((c, q) => ansOf(x)[q.k] === "n" && q.cond && COND_RANK[q.cond] > COND_RANK[c] ? q.cond : c, "ok");
  const noteOf = x => ($(`#scN-${x.id}`)?.value || st.note[x.id] || "").trim();
  const general = () => ($("#scNote")?.value || "").trim();
  const hasMemoFor = x => !!(picksOf(x).length || noteOf(x) || general());
  const anyBad = () => items().some(x => resultOf(x) !== "ok");
  const missingMemo = () => items().find(x => resultOf(x) !== "ok" && !hasMemoFor(x));
  const methodOf = () => st.how === "pickup" ? "pickup" : st.place === "문정" ? "drop_munjeong" : "drop_uiwang";
  const steps = () => [...(multi ? ["items"] : []), "date", "place", "method", ...(st.how === "pickup" ? ["pickup"] : []),
    ...(grouped() ? qKeys().map(q => `qq:${q.k}`) : items().flatMap(x => checksOf(x).map(q => `q:${x.id}:${q.k}`))), "memo", "sum"];
  // 2대 이상이면 질문마다 한 화면에 장비를 모두 놓고 장비별로 예/아니오를 고른다 (처음엔 모두 ‘예’)
  const grouped = () => items().length > 1;
  const qKeys = () => { const seen = new Map(); items().forEach(x => checksOf(x).forEach(q => { if (!seen.has(q.k)) seen.set(q.k, q); })); return [...seen.values()]; };
  const qqSec = (q, i, n) => {
    const its = items().filter(x => checksOf(x).some(c => c.k === q.k));
    return `<section data-step="qq:${q.k}" hidden>

            ? checksOf(x).map((q, i) => `<button class="sum-row" data-goto="q:${x.id}:${q.k}"><span>${i + 1}. ${esc(q.q)}</span><b class="${ansOf(x)[q.k] === "n" ? "t-bad" : ""}">${ansOf(x)[q.k] === "n" ? "아니오" : "예"}</b></button>`).join("")
            : `<button class="sum-row" data-goto="${nos.length ? qStep(x, nos[0].k) : firstQ(x)}"><span>${esc(eqOf(x).name)} <span class="mono">${esc(eqNo(eqOf(x)))}</span>${memo ? `<br><span class="t-bad">${esc(memo)}</span>` : ""}</span><b><span class="pill ${CHECK_PILL[r]}">${esc(CONDS[r])}</span>${nos.length ? `\n아니오 ${nos.length}개` : ""}</b></button>`;
        }).join("")}
        <button class="sum-row" data-goto="memo"><span>메모</span><b>${its.length === 1 ? esc([...picksOf(its[0]), gm].filter(Boolean).join("\n") || "없음") : esc(gm || "없음")}</b></button>
        ${its.length === 1 ? `<div class="sum-res">자가점검 결과 <span class="pill ${CHECK_PILL[resultOf(its[0])]}">${esc(CONDS[resultOf(its[0])])}</span></div>` : ""}
        <p class="meta">항목을 누르면 고칠 수 있어요.</p>`;
      $("#sumBox", m).querySelectorAll("[data-goto]").forEach(x => x.addEventListener("click", () => { back2sum = x.dataset.goto !== "items"; go(x.dataset.goto); }));
    };

      const err = $("#rErr", m), show = t => { err.textContent = t; err.hidden = false; };
      err.hidden = true;
      if (missingMemo()) { back2sum = true; go("memo"); memoMiss(); return; }
      const method = methodOf(), gm = general(), its = items();
      const payload = its.map(x => {
        const nos = nosOf(x), n = checksOf(x).length;
        const note = [nos.length ? nos.map(q => `[아니오] ${q.q}${(pickOf(x)[q.k] || []).length ? ` → ${pickOf(x)[q.k].join(", ")}` : ""}`).join("\n") : `자가점검 ${n}개 모두 ‘예’`, noteOf(x), gm].filter(Boolean).join("\n");
        return { loan_id: x.id, self_check: resultOf(x), self_note: note };
      });
      let pickup = null;
      if (method === "pickup") {
        pickup = { date: $("#rpDate", m)?.value || pick?.requested_date || null };
        if ($("#rpName", m)) Object.assign(pickup, { recipient: $("#rpName", m).value.trim(), phone: $("#rpPhone", m).value.trim(), address: $("#rpAddr", m).value.trim(), memo: $("#rpMemo", m).value.trim() });
      }
      b.disabled = true;
      const { error } = await sb.rpc("request_return_bulk", { p_items: payload, p_method: method, p_pickup: pickup, p_place: st.place, p_returned_on: st.retOn !== todayStr() ? st.retOn : null });
      b.disabled = false;
      if (error) return show(errText(error));
      const cnt = its.length > 1 ? `장비 ${its.length}대 ` : "";
      closeModal(); toast(method === "pickup" ? (me.isAdmin ? `${cnt}반납을 신청했어요. 물류 탭에서 회수 요청 메시지를 보내 주세요.` : `${cnt}반납을 신청했어요. 장비 관리자가 물류사에 회수를 요청해요.`) : `${cnt}반납을 신청했어요. 장비를 ${st.place}에 가져다 놓아 주세요.`); await refresh();
    });
    if (!multi) paintChecks();
    go(multi ? "items" : "date");
  });
}

안녕하세요. 아래 데모장비 ${title} 배차를 요청드립니다.

    ${text.includes("(입력 필요)") ? `<div class="notice">‘(입력 필요)’ 항목이 있어요. 장비 관리자가 배차 정보에 채운 뒤 복사해 주세요.${me.isAdmin && shipOf(no, dir) ? ` <button class="linkbtn" id="mDsp">배차 정보 입력</button>` : ""}</div>` : ""}
    <pre class="mail" id="mText">${esc(text)}</pre>
    <div class="actions"><button class="btn" data-close-btn>닫기</button><button class="btn pri" id="mCopy">메시지 복사</button></div>`, m => {
    $("#mDsp", m)?.addEventListener("click", () => shipEdit(shipOf(no, dir).id));

      try { await navigator.clipboard.writeText(text); toast("메시지를 복사했어요."); }
      catch { const r = document.createRange(); r.selectNodeContents($("#mText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("메시지를 선택했어요. 복사해 주세요."); }

}
function shipEdit(sid) {

function exportCsv() {
  const head = ["신청번호","장비 ID","라벨","자산번호","제품명","보관 위치","신청자","내부 요청자","외부 요청자","목적","고객사","시작일","반납 예정일","배송","상태","연체일","출고","반납","반납 방법","자가점검","자가점검 메모","점검 결과","점검 메모","연장 횟수","출고 메모"];
  const t = todayStr();
  const rows = [...loans].sort((a, b) => a.loan_no.localeCompare(b.loan_no) || loanEqCmp(a, b)).map(l => { const e = eqById(l.equipment_id) || {}; return [l.loan_no, e.internal_id || "", e.label || "", assetNo(e), e.name, e.location, nameOf(l.requester_id), l.internal_requester, l.external_requester, l.purpose, l.customer, l.start_date, l.due_date,
    l.delivery ? "Y" : "N", LOAN_STATUS[l.status]?.[0] || l.status, isOverdue(l) ? daysBetween(l.due_date, t) : "", fmtT(l.checkout_at), fmtT(l.returned_at), retLabel(l), CONDS[l.return_self_check] || "", l.return_self_note || "", CONDS[l.return_condition] || "", l.return_note || "", l.extension_count || 0, l.checkout_note || ""]; });
  const csv = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `데모장비_출납대장_${t}.csv`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

document.addEventListener("change", e => {
  if (e.target.id === "lgMine" || e.target.id === "lgShip") { filters[e.target.id] = e.target.checked; render(); return; }
  const ex = e.target.dataset?.ext;
  if (ex) { const n = $("#" + ex); if (!n) return; if (e.target.value === "__etc") { if (EXT_ORGS.includes(n.value)) n.value = ""; n.hidden = false; n.focus(); } else { n.value = e.target.value; n.hidden = true; } return; }
  const id = e.target.id;
  if (id === "eqCat") { filters.eqCat = e.target.value; render(); }
  else if (id === "eqLoc") { filters.eqLoc = e.target.value; render(); }

    draft[id === "rStart" ? "start" : "due"] = e.target.value;

const REQ_IDS = ["rPurpose","rEtc","rCustomer","rInternal","rExternal","rNote","rDelivery","rShipLater","sName","sPhone","sAddr","sDate","sPick","sMemo"];
function collectReqFields() { const o = {}; for (const id of REQ_IDS) { const n = $("#" + id); if (n) o[id] = n.type === "checkbox" ? n.checked : n.value; } return o; }
function restoreReqFields(o) { for (const [id, v] of Object.entries(o)) { if (!o.rDelivery && (id === "sDate" || id === "sPick")) continue; const n = $("#" + id); if (!n) continue; if (n.type === "checkbox") n.checked = v; else n.value = v; } const d = $("#rDelivery"); if (d) $("#shipBox").hidden = !d.checked; lockShipFields();  paintPurpose(); syncExt("rExternal"); paintShipLater(); syncShipDates(); }
// 물류 날짜 기본값은 대여 기간을 따라간다 (도착 = 사용 시작일, 회수 = 반납 예정일). 직접 바꾼 날짜는 그대로 둔다

function paintShipLater() { const c = $("#rShipLater"); if (!c) return; $("#shipLaterTip").hidden = !c.checked; $("#shipFields").querySelectorAll("label.f").forEach(l => { if (["sName","sPhone","sAddr","sDate"].includes(l.querySelector("input")?.id)) l.classList.toggle("req", !c.checked); }); }
function paintPurpose() { const sel = $("#rPurpose"); if (!sel) return; const pd = $("#rPurposeDesc"); if (pd) pd.textContent = purposeDesc(sel.value); const w = $("#rEtcWrap"); if (w) w.hidden = sel.value !== "기타"; }

/* ---------- 로딩 화면 ---------- */
// 데이터를 다 불러오면 바로 닫는다. 깜빡임을 막으려고 최소 0.6초는 보여 주고, 0.2초 동안 서서히 사라진다.
// 0.9초가 지나면 물결을 반복하고, 8초가 지나면 '다시 시도'를 보여 준다.
const SPLASH_MIN = 600, SPLASH_SLOW = 8000;
let splashDone = false;
const splashWait = setTimeout(() => { const s = $("#splash"); if (s && !splashDone) s.classList.add("wait"); }, 900);
const splashSlow = setTimeout(() => { if (!splashDone && $("#splashSlow")) $("#splashSlow").hidden = false; }, SPLASH_SLOW);
$("#splashVer") && ($("#splashVer").textContent = APP_VERSION);
$("#splashRetry")?.addEventListener("click", () => location.reload());
function hideSplash() {
  if (splashDone) return; splashDone = true;
  clearTimeout(splashWait); clearTimeout(splashSlow);
  const s = $("#splash"); if (!s) return;
  setTimeout(() => {
    document.documentElement.classList.remove("splashing");
    s.classList.add("out");
    setTimeout(() => s.remove(), 220);
  }, Math.max(0, SPLASH_MIN - performance.now()));
}

  if (!me.isAdmin && ADMIN_VIEWS.includes(view)) view = "home";
  paintRole(); render(); window.scrollTo(0, 0);
  toast(me.isAdmin ? "관리자 화면으로 돌아왔어요." : "신청자 화면으로 보고 있어요. 위의 [관리자 화면으로]를 누르면 돌아가요.");
  if (me.isAdmin) await refresh(true, true);
});

/* ---------- 시작 ---------- */
async function start() {
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get("error_description");
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (!session) {
    let kicked = false; try { kicked = sessionStorage.getItem("kicked") === "1"; sessionStorage.removeItem("kicked"); } catch {}
    showGate("login", oauthErr ? `<div class="notice bad">로그인하지 못했어요: ${esc(oauthErr)}</div>`
      : kicked ? `<div class="notice">다른 기기에서 같은 계정으로 로그인해서 이 기기는 로그아웃됐어요. 한 계정은 동시에 2대까지 쓸 수 있어요.</div>` : "");
    return;
  }
  if (location.search) { try { history.replaceState(null, "", location.pathname + location.hash); } catch {} }
  me.id = session.user.id;
  if (await sessionGuard(true)) return;
  try {
    const rows = await must(sb.from("profiles").select("*").eq("id", me.id));
    profile = rows[0] || null;
  } catch (e) { showGate("error", esc(errText(e))); return; }
  if (!profile || profile.status === "pending") { showGate("pending"); return; }
  if (profile.status === "disabled") { showGate("disabled"); return; }
  me.realAdmin = profile.role === "admin";
  let asUser = false; try { asUser = me.realAdmin && sessionStorage.getItem("asUser") === "1"; } catch {}
  me.isAdmin = me.realAdmin && !asUser;
  $("#gate").hidden = true; $("#app").hidden = false;
  $("#meName").textContent = profile.display_name || "나";
  paintRole();
  renderTabs();
  try { await loadAll(); render(); hideSplash(); } catch (e) { showGate("error", esc(errText(e))); return; }
  try { pendingEq = pendingEq || localStorage.getItem("pendingEq"); localStorage.removeItem("pendingEq"); } catch {}
  if (pendingEq) { openEqByIid(pendingEq); pendingEq = null; }
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h.startsWith("eq/")) openEqByIid(decodeURIComponent(h.slice(3))); });
  let rc = null; try { rc = sessionStorage.getItem("roleChanged"); sessionStorage.removeItem("roleChanged"); } catch {}
  if (rc === "admin" || rc === "applicant") toast(rc === "admin" ? "장비 관리자로 지정됐어요. 관리자 메뉴가 열렸어요." : "권한이 신청자로 바뀌었어요. 관리자 메뉴가 닫혔어요.");
  setTimeout(() => checkVersion(true), 3000);
  setInterval(() => { if (document.visibilityState === "visible") refresh(true); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
}
sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });
start();
})();
</script>
